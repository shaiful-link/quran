*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) var(--carpet) repeat;background-size:96px 96px;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
  padding:10px 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:1px}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;min-width:36px;height:36px;font-size:14px;font-weight:700;cursor:pointer;padding:0 6px}
.tools button.off{opacity:.55}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:10px;padding:7px 4px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.25}
.tab span{display:block;font-size:11px;font-weight:400;opacity:.85}
.tab.on{background:#fff;color:var(--green);border-color:#fff}
.tab .tick{color:var(--gold);font-weight:700}
main{max-width:820px;margin:0 auto;padding:12px 12px 90px}
.today{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  margin-bottom:12px;font-size:14px;color:var(--ink)}
.today b{color:var(--green2)}
.place{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.place select{font-size:14px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.title{text-align:center;margin:6px 0 10px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:4px 10px 10px}
.title .a{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;font-size:34px;color:var(--green2);font-weight:700;direction:rtl}
.title .n{font-size:14px;color:var(--muted)}
.bism{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;direction:rtl;text-align:center;
  font-size:calc(var(--ar) * .85);font-weight:700;background:var(--green);color:#fff;border-radius:12px;
  padding:6px 10px 10px;margin-bottom:10px;line-height:1.9}
.part{margin:18px 0 8px;font-weight:700;color:var(--green2);font-size:15px;
  border-left:5px solid var(--gold);padding:8px 10px;background:var(--card);border-radius:8px}
.ayah{background:var(--card);border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.18);border-radius:12px;padding:10px 12px 12px;margin-bottom:10px}
.ayah.mark{box-shadow:0 0 0 3px var(--gold)}
.ar{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;direction:rtl;text-align:right;
  font-size:var(--ar);font-weight:700;line-height:2.15;word-spacing:.12em}
.num{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  min-width:1.5em;height:1.5em;padding:0 .2em;margin-right:.25em;border:2px solid var(--line);border-radius:50%;
  font-size:.5em;font-family:system-ui,sans-serif;font-weight:700;color:var(--green2);line-height:1}
.la{direction:ltr;text-align:left;color:var(--latin);font-size:var(--la);line-height:1.7;font-weight:600;
  letter-spacing:.02em;word-spacing:.18em;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.la .n{display:inline-block;font-size:.7em;color:var(--muted);font-weight:700;margin-right:.3em}
body.m-arab .la, body.m-arab .bism .bl{display:none}
body.m-latin .ar, body.m-latin .bism .ba{display:none}
body.m-latin .la{border-top:0;margin-top:0;padding-top:2px}
.bism .bl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;direction:ltr;
  font-size:calc(var(--la) * .8);font-weight:600;line-height:1.5;padding-top:4px}
.done{display:block;width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:700;border-radius:12px;
  border:2px solid var(--green2);background:var(--green2);color:#fff;cursor:pointer}
.done.is{background:var(--card);color:var(--green2)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5;background:var(--card);border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1>Bacaan Harian<small id="date"></small></h1>
      <div class="tools">
        <button id="laMinus" title="Kecilkan tulisan Latin">abc−</button>
        <button id="laPlus" title="Besarkan tulisan Latin">abc+</button>
        <button id="minus" title="Kecilkan tulisan Arab">ع−</button>
        <button id="plus" title="Besarkan tulisan Arab">ع+</button>
        <button id="modeBtn" title="Tukar paparan: Arab + Latin / Latin sahaja / Arab sahaja"></button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<main>
  <div class="today" id="today"></div>
  <div id="view"></div>
  <div class="foot">Teks Arab: Mushaf Standard Indonesia (Kemenag). Latin: gaya NU Online.<br>
  Latin hanya bantuan – semak bacaan dengan mushaf / guru.</div>
</main>
<script>
const SURAHS = [{"id": "mulk", "name": "Al-Mulk", "ar": "الملك", "no": 67, "info": "30 ayat", "parts": [{"title": "", "v": [[1, "تَبٰرَكَ الَّذِيْ بِيَدِهِ الْمُلْكُۖ وَهُوَ عَلٰى كُلِّ شَيْءٍ قَدِيْرٌۙ", "tabârakalladzî biyadihil-mulku wa huwa 'alâ kulli syai'ing qadîr"], [2, "ۨالَّذِيْ خَلَقَ الْمَوْتَ وَالْحَيٰوةَ لِيَبْلُوَكُمْ اَيُّكُمْ اَحْسَنُ عَمَلًاۗ وَهُوَ الْعَزِيْزُ الْغَفُوْرُۙ", "alladzî khalaqal-mauta wal-ḫayâta liyabluwakum ayyukum aḫsanu 'amalâ, wa huwal-'azîzul-ghafûr"], [3, "الَّذِيْ خَلَقَ سَبْعَ سَمٰوٰتٍ طِبَاقًاۗ مَا تَرٰى فِيْ خَلْقِ الرَّحْمٰنِ مِنْ تَفٰوُتٍۗ فَارْجِعِ الْبَصَرَۙ هَلْ تَرٰى مِنْ فُطُوْرٍ", "alladzî khalaqa sab'a samâwâtin thibâqâ, mâ tarâ fî khalqir-raḫmâni min tafâwut, farji'il-bashara hal tarâ min futhûr"], [4, "ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنْقَلِبْ اِلَيْكَ الْبَصَرُ خَاسِئًا وَّهُوَ حَسِيْرٌ", "tsummarji'il-bashara karrataini yangqalib ilaikal-basharu khâsi'aw wa huwa ḫasîr"], [5, "وَلَقَدْ زَيَّنَّا السَّمَاۤءَ الدُّنْيَا بِمَصَابِيْحَ وَجَعَلْنٰهَا رُجُوْمًا لِّلشَّيٰطِيْنِ وَاَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيْرِ", "wa laqad zayyannas-samâ'ad-dun-yâ bimashâbîḫa wa ja'alnâhâ rujûmal lisy-syayâthîni wa a'tadnâ lahum 'adzâbas-sa'îr"], [6, "وَلِلَّذِيْنَ كَفَرُوْا بِرَبِّهِمْ عَذَابُ جَهَنَّمَۗ وَبِئْسَ الْمَصِيْرُ", "wa lilladzîna kafarû birabbihim 'adzâbu jahannam, wa bi'sal-mashîr"], [7, "اِذَآ اُلْقُوْا فِيْهَا سَمِعُوْا لَهَا شَهِيْقًا وَّهِيَ تَفُوْرُۙ", "idzâ ulqû fîhâ sami'û lahâ syahîqaw wa hiya tafûr"], [8, "تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِۗ كُلَّمَآ اُلْقِيَ فِيْهَا فَوْجٌ سَاَلَهُمْ خَزَنَتُهَآ اَلَمْ يَأْتِكُمْ نَذِيْرٌۙ", "takâdu tamayyazu minal-ghaîdh, kullamâ ulqiya fîhâ faujun sa'alahum khazanatuhâ a lam ya'tikum nadzîr"], [9, "قَالُوْا بَلٰى قَدْ جَاۤءَنَا نَذِيْرٌ ەۙ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللّٰهُ مِنْ شَيْءٍۖ اِنْ اَنْتُمْ اِلَّا فِيْ ضَلٰلٍ كَبِيْرٍ", "qâlû balâ qad jâ'anâ nadzîrun fa kadzdzabnâ wa qulnâ mâ nazzalallâhu min syai'in in antum illâ fî dlalâling kabîr"], [10, "وَقَا نْتُمْ اِلَّا بَشَرٌ مِّثْلُنَاۙ وَمَآ اَنْزَلَ الرَّحْمٰنُ مِنْ شَيْءٍۙ اِنْ اَنْتُمْ اِلَّا تَكْذِبُوْنَ", "qâlû mâ antum illâ basyarum mitslunâ wa mâ anzalar-raḫmânu min syai'in in antum illâ takdzibûn"], [16, "قَالُوْا رَبُّنَا يَعْلَمُ اِنَّآ اِلَيْكُمْ لَمُرْسَلُوْنَ", "qâlû rabbunâ ya'lamu innâ ilaikum lamursalûn"], [17, "وَمَا عَلَيْنَآ اِلَّا الْبَلٰغُ الْمُبِيْنُ", "wa mâ 'alainâ illal-balâghul-mubîn"], [18, "قَالُوْٓا اِنَّا تَطَيَّرْنَا بِكُمْۚ  لَىِٕنْ لَّمْ تَنْتَهُوْا لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُمْ مِّنَّا عَذَابٌ اَلِيْمٌ", "qâlû innâ tathayyarnâ bikum, la'il lam tantahû lanarjumannakum wa layamassannakum minnâ 'adzâbun alîm"], [19, "قَالُوْا طَاۤىِٕرُكُمْ مَّعَكُمْۗ اَىِٕنْ ذُكِّرْتُمْۗ بَلْ اَنْتُمْ قَوْمٌ مُّسْرِفُوْنَ", "qâlû thâ'irukum ma'akum, a in dzukkirtum, bal antum qaumum musrifûn"], [20, "وَجَاۤءَ مِنْ اَقْصَا الْمَدِيْنَةِ رَجُلٌ يَّسْعٰى قَالَ يٰقَوْمِ اتَّبِعُوا الْمُرْسَلِيْنَۙ", "wa jâ'a min aqshal-madînati rajuluy yas'â qâla yâ qaumittabi'ul-mursalîn"], [21, "اتَّبِعُوْا مَنْ لَّا يَسْـَٔلُكُمْ اَجْرًا وَّهُمْ مُّهْتَدُوْنَ  ۔", "ittabi'û mal lâ yas'alukum ajraw wa hum muhtadûn"], [22, "وَمَا لِيَ لَآ اَعْبُدُ الَّذِيْ فَطَرَنِيْ وَاِلَيْهِ تُرْجَعُوْنَ", "wa mâ liya lâ a'budulladzî fatharanî wa ilaihi turja'ûn"], [23, "ءَاَتَّخِذُ مِنْ دُوْنِهٖٓ اٰلِهَةً اِنْ يُّرِدْنِ الرَّحْمٰنُ بِضُرٍّ لَّا تُغْنِ عَنِّيْ شَفَاعَتُهُمْ شَيْـًٔا وَّلَا يُنْقِذُوْنِۚ", "a attakhidzu min dûnihî âlihatan iy yuridnir-raḫmânu bidlurril lâ tughni 'annî syafâ'atuhum syai'aw wa lâ yungqidzûn"], [24, "اِنِّيْٓ اِذًا لَّفِيْ ضَلٰلٍ مُّبِيْنٍ", "innî idzal lafî dlalâlim mubîn"], [25, "اِنِّيْٓ اٰمَنْتُ بِرَبِّكُمْ فَاسْمَعُوْنِۗ", "innî âmantu birabbikum fasma'ûn"], [26, "قِيْلَ ادْخُلِ الْجَنَّةَ ۗقَالَ يٰلَيْتَ قَوْمِيْ يَعْلَمُوْنَۙ", "qîladkhulil-jannah, qâla yâ laita qaumî ya'lamûn"], [27, "بِمَا غَفَرَ لِيْ رَبِّيْ وَجَعَلَنِيْ مِنَ الْمُكْرَمِيْنَ", "bimâ ghafara lî rabbî wa ja'alanî minal-mukramîn"], [28, "۞ وَمَآ اَنْزَلْنَا عَلٰى قَوْمِهٖ مِنْۢ بَعْدِهٖ مِنْ جُنْدٍ مِّنَ السَّمَاۤءِ وَمَا كُنَّا مُنْزِلِيْنَ", "wa mâ anzalnâ 'alâ qaumihî mim ba'dihî min jundim minas-samâ'i wa mâ kunnâ munzilîn"], [29, "اِنْ كَانَتْ اِلَّا صَيْحَةً وَّاحِدَةً فَاِذَا هُمْ خَامِدُوْنَ", "ing kânat illâ shaiḫataw wâḫidatan fa idzâ hum khâmidûn"], [30, "يٰحَسْرَةً عَلَى الْعِبَادِۚ مَا يَأْتِيْهِمْ مِّنْ رَّسُوْلٍ اِلَّا كَانُوْا بِهٖ يَسْتَهْزِءُوْنَ", "yâ ḫasratan 'alal-'ibâd, mâ ya'tîhim mir rasûlin illâ kânû bihî yastahzi'ûn"], [31, "اَلَمْ يَرَوْا كَمْ اَهْلَكْنَا قَبْلَهُمْ مِّنَ الْقُرُوْنِ اَنَّهُمْ اِلَيْهِمْ لَا يَرْجِعُوْنَ", "a lam yarau kam ahlaknâ qablahum minal-qurûni annahum ilaihim lâ yarji'ûn"], [32, "وَاِنْ كُلٌّ لَّمَّا جَمِيْعٌ لَّدَيْنَا مُحْضَرُوْنَ ࣖ", "wa ing kullul lammâ jamî'ul ladainâ muḫdlarûn"], [33, "وَاٰيَةٌ لَّهُمُ الْاَرْضُ الْمَيْتَةُ ۖاَحْيَيْنٰهَا وَاَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُوْنَ", "wa âyatul lahumul-ardlul-maitatu aḫyainâhâ wa akhrajnâ min-hâ ḫabban fa min-hu ya'kulûn"], [34, "وَجَعَلْنَا فِيْهَا جَنّٰتٍ مِّنْ نَّخِيْلٍ وَّاَعْنَابٍ وَّفَجَّرْنَا فِيْهَا مِنَ الْعُيُوْنِۙ", "wa ja'alnâ fîhâ jannâtim min nakhîliw wa a'nâbiw wa fajjarnâ fîhâ minal-'uyûn"], [35, "لِيَأْكُلُوْا مِنْ ثَمَرِهٖۙ وَمَا عَمِلَتْهُ اَيْدِيْهِمْ ۗ اَفَلَا يَشْكُرُوْنَ", "liya'kulû min tsamarihî wa mâ 'amilat-hu aidîhim, a fa lâ yasykurûn"], [36, "سُبْحٰنَ الَّذِيْ خَلَقَ الْاَزْوَاجَ كُلَّهَا مِمَّا تُنْۢبِتُ الْاَرْضُ وَمِنْ اَنْفُسِهِمْ وَمِمَّا لَا يَعْلَمُوْنَ", "sub-ḫânalladzî khalaqal-azwâja kullahâ mimmâ tumbitul-ardlu wa min anfusihim wa mimmâ lâ ya'lamûn"], [37, "وَاٰيَةٌ لَّهُمُ الَّيْلُ ۖنَسْلَخُ مِنْهُ النَّهَارَ فَاِذَا هُمْ مُّظْلِمُوْنَۙ", "wa âyatul lahumul-lailu naslakhu min-hun-nahâra fa idzâ hum mudhlimûn"], [38, "وَالشَّمْسُ تَجْرِيْ لِمُسْتَقَرٍّ لَّهَا ۗذٰلِكَ تَقْدِيْرُ الْعَزِيْزِ الْعَلِيْمِۗ", "wasy-syamsu tajrî limustaqarril lahâ, dzâlika taqdîrul-'azîzil-'alîm"], [39, "وَالْقَمَرَ قَدَّرْنٰهُ مَنَازِلَ حَتّٰى عَادَ كَالْعُرْجُوْنِ الْقَدِيْمِ", "wal-qamara qaddarnâhu manâzila ḫattâ 'âda kal-'urjûnil-qadîm"], [40, "لَا الشَّمْسُ يَنْۢبَغِيْ لَهَآ اَنْ تُدْرِكَ الْقَمَرَ وَلَا الَّيْلُ سَابِقُ النَّهَارِ ۗوَكُلٌّ فِيْ فَلَكٍ يَّسْبَحُوْنَ", "lasy-syamsu yambaghî lahâ an tudrikal-qamara wa lal-lailu sâbiqun-nahâr, wa kullun fî falakiy yasbaḫûn"], [41, "وَاٰيَةٌ لَّهُمْ اَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى الْفُلْكِ الْمَشْحُوْنِۙ", "wa âyatul lahum annâ ḫamalnâ dzurriyyatahum fil-fulkil-masy-ḫûn"], [42, "وَخَلَقْنَا لَهُمْ مِّنْ مِّثْلِهٖ مَا يَرْكَبُوْنَ", "wa khalaqnâ lahum mim mitslihî mâ yarkabûn"], [43, "وَاِنْ نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيْخَ لَهُمْ وَلَاهُمْ يُنْقَذُوْنَۙ", "wa in nasya' nughriq-hum fa lâ sharîkha lahum wa lâ hum yungqadzûn"], [44, "اِلَّا رَحْمَةً مِّنَّا وَمَتَاعًا اِلٰى حِيْنٍ", "illâ raḫmatam minnâ wa matâ'an ilâ ḫîn"], [45, "وَاِذَا قِيْلَ لَهُمُ اتَّقُوْا مَا بَيْنَ اَيْدِيْكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُوْنَ", "wa idzâ qîla lahumuttaqû mâ baina aidîkum wa mâ khalfakum la'allakum tur-ḫamûn"], [46, "وَمَا تَأْتِيْهِمْ مِّنْ اٰيَةٍ مِّنْ اٰيٰتِ رَبِّهِمْ اِلَّا كَانُوْا عَنْهَا مُعْرِضِيْنَ", "wa mâ ta'tîhim min âyatim min âyâti rabbihim illâ kânû 'an-hâ mu'ridlîn"], [47, "وَاِذَا قِيْلَ لَهُمْ اَنْفِقُوْا مِمَّا رَزَقَكُمُ اللّٰهُ ۙقَالَ الَّذِيْنَ كَفَرُوْا لِلَّذِيْنَ اٰمَنُوْٓا اَنُطْعِمُ مَنْ لَّوْ يَشَاۤءُ اللّٰهُ اَطْعَمَهٗٓ   ۖاِنْ اَنْتُمْ اِلَّا فِيْ ضَلٰلٍ مُّبِيْنٍ", "wa idzâ qîla lahum anfiqû mimmâ razaqakumullâhu qâlalladzîna kafarû lilladzîna âmanû a nuth'imu mal lau yasyâ'ullâhu ath'amahû in antum illâ fî dlalâlim mubîn"], [48, "وَيَقُوْلُوْنَ مَتٰى هٰذَا الْوَعْدُ اِنْ كُنْتُمْ صٰدِقِيْنَ", "wa yaqûlûna matâ hâdzal-wa'du ing kuntum shâdiqîn"], [49, "مَا يَنْظُرُوْنَ اِلَّا صَيْحَةً وَّاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُوْنَ", "mâ yandhurûna illâ shaiḫataw wâḫidatan ta'khudzuhum wa hum yakhishshimûn"], [50, "فَلَا يَسْتَطِيْعُوْنَ تَوْصِيَةً وَّلَآ اِلٰٓى اَهْلِهِمْ يَرْجِعُوْنَ ࣖ", "fa lâ yastathî'ûna taushiyataw wa lâ ilâ ahlihim yarji'ûn"], [51, "وَنُفِخَ فِى الصُّوْرِ فَاِذَا هُمْ مِّنَ الْاَجْدَاثِ اِلٰى رَبِّهِمْ يَنْسِلُوْنَ", "wa nufikha fish-shûri fa idzâ hum minal-ajdâtsi ilâ rabbihim yansilûn"], [52, "قَالُوْا يٰوَيْلَنَا مَنْۢ بَعَثَنَا مِنْ مَّرْقَدِنَا ۜهٰذَا مَا وَعَدَ الرَّحْمٰنُ وَصَدَقَ الْمُرْسَلُوْنَ", "qâlû yâ wailanâ mam ba'atsanâ mim marqadinâ hâdzâ mâ wa'adar-raḫmânu wa shadaqal-mursalûn"], [53, "اِنْ كَانَتْ اِلَّا صَيْحَةً وَّاحِدَةً فَاِذَا هُمْ جَمِيْعٌ لَّدَيْنَا مُحْضَرُوْنَ", "ing kânat illâ shaiḫataw wâḫidatan fa idzâ hum jamî'ul ladainâ muḫdlarûn"], [54, "فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْـًٔا وَّلَا تُجْزَوْنَ اِلَّا مَا كُنْتُمْ تَعْمَلُوْنَ", "fal-yauma lâ tudhlamu nafsun syai'aw wa lâ tujzauna illâ mâ kuntum ta'malûn"], [55, "اِنَّ اَصْحٰبَ الْجَنَّةِ الْيَوْمَ فِيْ شُغُلٍ فٰكِهُوْنَ ۚ", "inna ash-ḫâbal-jannatil-yauma fî syughulin fâkihûn"], [56, "هُمْ وَاَزْوَاجُهُمْ فِيْ ظِلٰلٍ عَلَى الْاَرَاۤىِٕكِ مُتَّكِـُٔوْنَ ۚ", "hum wa azwâjuhum fî dhilâlin 'alal-arâ'iki muttaki'ûn"], [57, "لَهُمْ فِيْهَا فَاكِهَةٌ وَّلَهُمْ مَّا يَدَّعُوْنَ ۚ", "lahum fîhâ fâkihatuw wa lahum mâ yadda'ûn"], [58, "سَلٰمٌۗ قَوْلًا مِّنْ رَّبٍّ رَّحِيْمٍ", "salâm, qaulam mir rabbir raḫîm"], [59, "وَامْتَازُوا الْيَوْمَ اَيُّهَا الْمُجْرِمُوْنَ", "wamtâzul-yauma ayyuhal-mujrimûn"], [60, "اَلَمْ اَعْهَدْ اِلَيْكُمْ يٰبَنِيْٓ اٰدَمَ اَنْ لَّا تَعْبُدُوا الشَّيْطٰنَۚ اِنَّهٗ لَكُمْ عَدُوٌّ مُّبِيْنٌ", "a lam a'had ilaikum yâ banî âdama al lâ ta'budusy-syaithân, innahû lakum 'aduwwum mubîn"], [61, "وَاَنِ اعْبُدُوْنِيْ ۗهٰذَا صِرَاطٌ مُّسْتَقِيْمٌ", "wa ani'budûnî, hâdzâ shirâthum mustaqîm"], [62, "وَلَقَدْ اَضَلَّ مِنْكُمْ جِبِلًّا كَثِيْرًا ۗاَفَلَمْ تَكُوْنُوْا تَعْقِلُوْنَ", "wa laqad adlalla mingkum jibillang katsîrâ, a fa lam takûnû ta'qilûn"], [63, "هٰذِهٖ جَهَنَّمُ الَّتِيْ كُنْتُمْ تُوْعَدُوْنَ", "hâdzihî jahannamullatî kuntum tû'adûn"], [64, "اِصْلَوْهَا الْيَوْمَ بِمَا كُنْتُمْ تَكْفُرُوْنَ", "ishlauhal-yauma bimâ kuntum takfurûn"], [65, "اَلْيَوْمَ نَخْتِمُ عَلٰٓى اَفْوَاهِهِمْ وَتُكَلِّمُنَآ اَيْدِيْهِمْ وَتَ function maghrib(d){
  const rad = Math.PI / 180;
  const n = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
  const decl = -23.44 * Math.cos(2 * Math.PI / 365 * (n + 10));

  const sunsetUtcMin = 720 - 4 * LNG - eot + 4 * ha + 2;
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, Math.round(sunsetUtcMin)));

    (isFriday ? "<br>Al-Kahfi: 10 ayat pertama dan 10 ayat terakhir." + (malamJumaat ? "" : " Sebelum Maghrib (± " + magText + ").")
      : now.getDay() === 4 ? "<br>Al-Kahfi bermula selepas Maghrib (± " + magText + ")." : "") +
    '<div class="place">Lokasi: <select id="place">' +
    Object.keys(PLACES).map(k => `<option value="${k}" ${k===placeId?"selected":""}>${PLACES[k].name}</option>`).join("") +
    '</select> · Maghrib ± ' + magText + '</div>';
  $("place").addEventListener("change", e => { store.set("q_place", e.target.value); location.reload(); });
}

function renderSurah(){
  const s = SURAHS.find(x => x.id === current) || SURAHS[0];
  let h = `<div class="title"><div class="a">سورة ${s.ar}</div><div class="n">${s.name} · Surah ${s.no} · ${s.info}</div></div>`;
  h += `<div class="bism"><div class="ba">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div class="bl">bismillâhir-raḫmânir-raḫîm</div></div>`;
  s.parts.forEach(p => {
    if (p.title) h += `<div class="part">${p.title}</div>`;
    p.v.forEach(v => {
      h += `<div class="ayah" id="a${v[0]}" data-n="${v[0]}">
        <div class="ar">${v[1]} <span class="num">${arDigits(v[0])}</span></div>
        <div class="la"><span class="n">${v[0]}.</span>${v[2]}</div></div>`;
    });
  });
  const d = isDone(s.id);
  h += `<button class="done ${d?"is":""}" id="doneBtn">${d ? "✓ Sudah dibaca hari ini" : "Tanda sudah baca " + s.name}</button>`;
  $("view").innerHTML = h;

  // tap an ayah to bookmark it (gold outline) – reopens at that ayah next time
  const mark = lastPos[s.id];
  if (mark && $("a" + mark)) $("a" + mark).classList.add("mark");
  document.querySelectorAll(".ayah").forEach(el => el.addEventListener("click", () => {
    document.querySelectorAll(".ayah.mark").forEach(m => m.classList.remove("mark"));
    if (lastPos[s.id] == el.dataset.n) { delete lastPos[s.id]; }
    else { lastPos[s.id] = el.dataset.n; el.classList.add("mark"); }
    store.set("q_pos", lastPos);
  }));
  $("doneBtn").addEventListener("click", () => {
    setDone(s.id, !isDone(s.id));
    if (isDone(s.id)) { delete lastPos[s.id]; store.set("q_pos", lastPos); }
    store.set("q_done", doneMap);
    renderAll(false);
  });
}

function renderAll(scroll){
  renderTabs(); renderToday(); renderSurah();
  if (scroll) {
    const m = lastPos[current];
    if (m && $("a" + m)) $("a" + m).scrollIntoView({block:"center"});
    else window.scrollTo(0, 0);
  }
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.id; store.set("q_surah", current); renderAll(true);
});
$("plus").addEventListener("click", () => { arSize = Math.min(64, arSize + 4); store.set("q_ar", arSize); applySettings(); });
$("minus").addEventListener("click", () => { arSize = Math.max(24, arSize - 4); store.set("q_ar", arSize); applySettings(); });
$("laPlus").addEventListener("click", () => { laSize = Math.min(56, laSize + 3); store.set("q_la2", laSize); applySettings(); });
$("laMinus").addEventListener("click", () => { laSize = Math.max(16, laSize - 3); store.set("q_la2", laSize); applySettings(); });
$("modeBtn").addEventListener("click", () => { mode = MODE_NEXT[mode]; store.set("q_mode", mode); applySettings(); });

$("date").textContent = HARI[now.getDay()] + ", " + now.getDate() + " " + BULAN[now.getMonth()] + " " + now.getFullYear();
store.set("q_done", doneMap);
applySettings();
renderAll(true);
</script>
</body>
</html>
