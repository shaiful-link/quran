*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) var(--carpet) repeat;background-size:96px 96px;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
  padding:10px 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar{max-width:820px;margin:0 auto}
#picker{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
body.pick #picker{display:flex}
body.pick header, body.pick main{display:none}
.pbox{width:100%;max-width:420px;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:22px 18px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);text-align:center}
.plogo{display:block;width:min(220px,62%);height:auto;margin:0 auto 6px}
.psub{font-size:14px;color:var(--muted);margin:4px 0 10px}
.pbtn{display:block;text-decoration:none;background:var(--green);color:#fff;border-radius:14px;padding:12px 12px;margin-top:10px}
.pbtn b{display:block;font-size:24px}
.pbtn span{display:block;font-size:12.5px;opacity:.9;margin-top:4px;line-height:1.4}
#who{color:#fff;text-decoration:none}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.top small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:1px}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;min-width:36px;height:36px;font-size:14px;font-weight:700;cursor:pointer;padding:0 6px}
.tools button.off{opacity:.55}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.tab{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:10px;padding:6px 1px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.25}
.tab span{display:block;font-size:11px;font-weight:400;opacity:.85}
.tab.on{background:#fff;color:var(--green);border-color:#fff}
.tab .tick{display:inline;font-size:inherit;color:var(--gold);font-weight:700;opacity:1}
main{max-width:820px;margin:0 auto;padding:12px 12px 90px}
.today{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  margin-bottom:12px;font-size:14px;color:var(--ink)}
.today b{color:var(--green2)}
.place{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.place select{font-size:14px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.title{text-align:center;margin:6px 0 10px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:4px 10px 10px}
.title .a{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;font-size:34px;color:var(--green2);font-weight:700;direction:rtl}
.title .n{font-size:14px;color:var(--muted)}
.bism{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;direction:rtl;text-align:center;
  font-size:calc(var(--ar) * .85);font-weight:700;background:var(--green);color:#fff;border-radius:12px;
  padding:6px 10px 10px;margin-bottom:10px;line-height:1.9}
.part{margin:18px 0 8px;font-weight:700;color:var(--green2);font-size:15px;
  border-left:5px solid var(--gold);padding:8px 10px;background:var(--card);border-radius:8px}
.ayah{background:var(--card);border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.18);border-radius:12px;padding:10px 12px 12px;margin-bottom:10px}
.ayah.mark{box-shadow:0 0 0 3px var(--gold)}
.ar{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif;direction:rtl;text-align:right;
  font-size:var(--ar);font-weight:700;line-height:2.15;word-spacing:.12em}
.num{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  min-width:1.5em;height:1.5em;padding:0 .2em;margin-right:.25em;border:2px solid var(--line);border-radius:50%;
  font-size:.5em;font-family:system-ui,sans-serif;font-weight:700;color:var(--green2);line-height:1}
.la{direction:ltr;text-align:left;color:var(--latin);font-size:var(--la);line-height:1.7;font-weight:600;
  letter-spacing:.02em;word-spacing:.18em;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.la .n{display:inline-block;font-size:.7em;color:var(--muted);font-weight:700;margin-right:.3em}
body.m-arab .la, body.m-arab .bism .bl{display:none}
body.m-latin .ar, body.m-latin .bism .ba{display:none}
body.m-latin .la{border-top:0;margin-top:0;padding-top:2px}
.bism .bl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;direction:ltr;
  font-size:calc(var(--la) * .8);font-weight:600;line-height:1.5;padding-top:4px}
.done{display:block;width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:700;border-radius:12px;
  border:2px solid var(--green2);background:var(--green2);color:#fff;cursor:pointer}
.done.is{background:var(--card);color:var(--green2)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5;background:var(--card);border-radius:10px;padding:8px 10px}
</style>
</head>

ٓ اَنْتُمْ اِلَّا بَشَرٌ مِّثْلُنَاۙ وَمَآ اَنْزَلَ الرَّحْمٰنُ مِنْ شَيْءٍۙ اِنْ اَنْتُمْ اِلَّا تَكْذِبُوْنَ", "qâlû mâ antum illâ basyarum mitslunâ wa mâ anzalar-raḫmânu min syai'in in antum illâ takdzibûn"], [16, "قَالُوْا رَبُّنَا يَعْلَمُ اِنَّآ اِلَيْكُمْ لَمُرْسَلُوْنَ", "qâlû rabbunâ ya'lamu innâ ilaikum lamursalûn"], [17, "وَمَا عَلَيْنَآ اِلَّا الْبَلٰغُ الْمُبِيْنُ", "wa mâ 'alainâ illal-balâghul-mubîn"], [18, "قَالُوْٓا اِنَّا تَطَيَّرْنَا بِكُمْۚ  لَىِٕنْ لَّمْ تَنْتَهُوْا لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُمْ مِّنَّا عَذَابٌ اَلِيْمٌ", "qâlû innâ tathayyarnâ bikum, la'il lam tantahû lanarjumannakum wa layamassannakum minnâ 'adzâbun alîm"], [19, "قَالُوْا طَاۤىِٕرُكُمْ مَّعَكُمْۗ اَىِٕنْ ذُكِّرْتُمْۗ بَلْ اَنْتُمْ قَوْمٌ مُّسْرِفُوْنَ", "qâlû thâ'irukum ma'akum, a in dzukkirtum, bal antum qaumum musrifûn"], [20, "وَجَاۤءَ مِنْ اَقْصَا الْمَدِيْنَةِ رَجُلٌ يَّسْعٰى قَالَ يٰقَوْمِ اتَّبِعُوا الْمُرْسَلِيْنَۙ", "wa jâ'a min aqshal-madînati rajuluy yas'â qâla yâ qaumittabi'ul-mursalîn"], [21, "اتَّبِعُوْا مَنْ لَّا يَسْـَٔلُكُمْ اَجْرًا وَّهُمْ مُّهْتَدُوْنَ  ۔", "ittabi'û mal lâ yas'alukum ajraw wa hum muhtadûn"], [22, "وَمَا لِيَ لَآ اَعْبُدُ الَّذِيْ فَطَرَنِيْ وَاِلَيْهِ تُرْجَعُوْنَ", "wa mâ liya lâ a'budulladzî fatharanî wa ilaihi turja'ûn"], [23, "ءَاَتَّخِذُ مِنْ دُوْنِهٖٓ اٰلِهَةً اِنْ يُّرِدْنِ الرَّحْمٰنُ بِضُرٍّ لَّا تُغْنِ عَنِّيْ شَفَاعَتُهُمْ شَيْـًٔا وَّلَا يُنْقِذُوْنِۚ", "a attakhidzu min dûnihî âlihatan iy yuridnir-raḫmânu bidlurril lâ tughni 'annî syafâ'atuhum syai'aw wa lâ yungqidzûn"], [24, "اِنِّيْٓ اِذًا لَّفِيْ ضَلٰلٍ مُّبِيْنٍ", "innî idzal lafî dlalâlim mubîn"], [25, "اِنِّيْٓ اٰمَنْتُ بِرَبِّكُمْ فَاسْمَعُوْنِۗ", "innî âmantu birabbikum fasma'ûn"], [26, "قِيْلَ ادْخُلِ الْجَنَّةَ ۗقَالَ يٰلَيْتَ قَوْمِيْ يَعْلَمُوْنَۙ", "qîladkhulil-jannah, qâla yâ laita qaumî ya'lamûn"], [27, "بِمَا غَفَرَ لِيْ رَبِّيْ وَجَعَلَنِيْ مِنَ الْمُكْرَمِيْنَ", "bimâ ghafara lî rabbî wa ja'alanî minal-mukramîn"], [28, "۞ وَمَآ اَنْزَلْنَا عَلٰى قَوْمِهٖ مِنْۢ بَعْدِهٖ مِنْ جُنْدٍ مِّنَ السَّمَاۤءِ وَمَا كُنَّا مُنْزِلِيْنَ", "wa mâ anzalnâ 'alâ qaumihî mim ba'dihî min jundim minas-samâ'i wa mâ kunnâ munzilîn"], [29, "اِنْ كَانَتْ اِلَّا صَيْحَةً وَّاحِدَةً فَاِذَا هُمْ خَامِدُوْنَ", "ing kânat illâ shaiḫataw wâḫidatan fa idzâ hum khâmidûn"], [30, "يٰحَسْرَةً عَلَى الْعِبَادِۚ مَا يَأْتِيْهِمْ مِّنْ رَّسُوْلٍ اِلَّا كَانُوْا بِهٖ يَسْتَهْزِءُوْنَ", "yâ ḫasratan 'alal-'ibâd, mâ ya'tîhim mir rasûlin illâ kânû bihî yastahzi'ûn"], [31, "اَلَمْ يَرَوْا كَمْ اَهْلَكْنَا قَبْلَهُمْ مِّنَ الْقُرُوْنِ اَنَّهُمْ اِلَيْهِمْ لَا يَرْجِعُوْنَ", "a lam yarau kam ahlaknâ qablahum minal-qurûni annahum ilaihim lâ yarji'ûn"], [32, "وَاِنْ كُلٌّ لَّمَّا جَمِيْعٌ لَّدَيْنَا مُحْضَرُوْنَ ࣖ", "wa ing kullul lammâ jamî'ul ladainâ muḫdlarûn"], [33, "وَاٰيَةٌ لَّهُمُ الْاَرْضُ الْمَيْتَةُ ۖاَحْيَيْنٰهَا وَاَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُوْنَ", "wa âyatul lahumul-ardlul-maitatu aḫyainâhâ wa akhrajnâ min-hâ ḫabban fa min-hu ya'kulûn"], [34, "وَجَعَلْنَا فِيْهَا جَنّٰتٍ مِّنْ نَّخِيْلٍ وَّاَعْنَابٍ وَّفَجَّرْنَا فِيْهَا مِنَ الْعُيُوْنِۙ", "wa ja'alnâ fîhâ jannâtim min nakhîliw wa a'nâbiw wa fajjarnâ fîhâ minal-'uyûn"], [35, "لِيَأْكُلُوْا مِنْ ثَمَرِهٖۙ وَمَا عَمِلَتْهُ اَيْدِيْهِمْ ۗ اَفَلَا يَشْكُرُوْنَ", "liya'kulû min tsamarihî wa mâ 'amilat-hu aidîhim, a fa lâ yasykurûn"], [36, "سُبْحٰنَ الَّذِيْ خَلَقَ الْاَزْوَاجَ كُلَّهَا مِمَّا تُنْۢبِتُ الْاَرْضُ وَمِنْ اَنْفُسِهِمْ وَمِمَّا لَا يَعْلَمُوْنَ", "sub-ḫânalladzî khalaqal-azwâja kullahâ mimmâ tumbitul-ardlu wa min anfusihim wa mimmâ lâ ya'lamûn"], [37, "وَاٰيَةٌ لَّهُمُ الَّيْلُ ۖنَسْلَخُ مِنْهُ النَّهَارَ فَاِذَا هُمْ مُّظْلِمُوْنَۙ", "wa âyatul lahumul-lailu naslakhu min-hun-nahâra fa idzâ hum mudhlimûn"], [38, "وَالشَّمْسُ تَجْرِيْ لِمُسْتَقَرٍّ لَّهَا ۗذٰلِكَ تَقْدِيْرُ الْعَزِيْزِ الْعَلِيْمِۗ", "wasy-syamsu tajrî limustaqarril lahâ, dzâlika taqdîrul-'azîzil-'alîm"], [39, "وَالْقَمَرَ قَدَّرْنٰهُ مَنَازِلَ حَتّٰى عَادَ كَالْعُرْجُوْنِ الْقَدِيْمِ", "wal-qamara qaddarnâhu manâzila ḫattâ 'âda kal-'urjûnil-qadîm"], [40, "لَا الشَّمْسُ يَنْۢبَغِيْ لَهَآ اَنْ تُدْرِكَ الْقَمَرَ وَلَا الَّيْلُ سَابِقُ النَّهَارِ ۗوَكُلٌّ فِيْ فَلَكٍ يَّسْبَحُوْنَ", "lasy-syamsu yambaghî lahâ an tudrikal-qamara wa lal-lailu sâbiqun-nahâr, wa kullun fî falakiy yasbaḫûn"], [41, "وَاٰيَةٌ لَّهُمْ اَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى الْفُلْكِ الْمَشْحُوْنِۙ", "wa âyatul lahum annâ ḫamalnâ dzurriyyatahum fil-fulkil-masy-ḫûn"], [42, "وَخَلَقْنَا لَهُمْ مِّنْ مِّثْلِهٖ مَا يَرْكَبُوْنَ", "wa khalaqnâ lahum mim mitslihî mâ yarkabûn"], [43, "وَاِنْ نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيْخَ لَهُمْ وَلَاهُمْ يُنْقَذُوْنَۙ", "wa in nasya' nughriq-hum fa lâ sharîkha lahum wa lâ hum yungqadzûn"], [44, "اِلَّا رَحْمَةً مِّنَّا وَمَتَاعًا اِلٰى حِيْنٍ", "illâ raḫmatam minnâ wa matâ'an ilâ ḫîn"], [45, "وَاِذَا قِيْلَ لَهُمُ اتَّقُوْا مَا بَيْنَ اَيْدِيْكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُوْنَ", "wa idzâ qîla lahumuttaqû mâ baina aidîkum wa mâ khalfakum la'allakum tur-ḫamûn"], [46, "وَمَا تَأْتِيْهِمْ مِّنْ اٰيَةٍ مِّنْ اٰيٰتِ رَبِّهِمْ اِلَّا كَانُوْا عَنْهَا مُعْرِضِيْنَ", "wa mâ ta'tîhim min âyatim min âyâti rabbihim illâ kânû 'an-hâ mu'ridlîn"], [47, "وَاِذَا قِيْلَ لَهُمْ اَنْفِقُوْا مِمَّا رَزَقَكُمُ اللّٰهُ ۙقَالَ الَّذِيْنَ كَفَرُوْا لِلَّذِيْنَ اٰمَنُوْٓا اَنُطْعِمُ مَنْ لَّوْ يَشَاۤءُ اللّٰهُ اَطْعَمَهٗٓ   ۖاِنْ اَنْتُمْ اِلَّا فِيْ ضَلٰلٍ مُّبِيْنٍ", "wa idzâ qîla lahum anfiqû mimmâ razaqakumullâhu qâlalladzîna kafarû lilladzîna âmanû a nuth'imu mal lau yasyâ'ullâhu ath'amahû in antum illâ fî dlalâlim mubîn"], [48, "وَيَقُوْلُوْنَ مَتٰى هٰذَا الْوَعْدُ اِنْ كُنْتُمْ صٰدِقِيْنَ", "wa yaqûlûna matâ hâdzal-wa'du ing kuntum shâdiqîn"], [49, "مَا يَنْظُرُوْنَ اِلَّا صَيْحَةً وَّاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُوْنَ", "mâ yandhurûna illâ shaiḫataw wâḫidatan ta'khudzuhum wa hum yakhishshimûn"], [50, "فَلَا يَسْتَطِيْعُوْنَ تَوْصِيَةً وَّلَآ اِلٰٓى اَهْلِهِمْ يَرْجِعُوْنَ ࣖ", "fa lâ yastathî'ûna taushiyataw wa lâ ilâ ahlihim yarji'ûn"], [51, "وَنُفِخَ فِى الصُّوْرِ فَاِذَا هُمْ مِّنَ الْاَجْدَاثِ اِلٰى رَبِّهِمْ يَنْسِلُوْنَ", "wa nufikha fish-shûri fa idzâ hum minal-ajdâtsi ilâ rabbihim yansilûn"], [52, "قَالُوْا يٰوَيْلَنَا مَنْۢ بَعَثَنَا مِنْ مَّرْقَدِنَا ۜهٰذَا مَا وَعَدَ الرَّحْمٰنُ وَصَدَقَ الْمُرْسَلُوْنَ", "qâlû yâ wailanâ mam ba'atsanâ mim marqadinâ hâdzâ mâ wa'adar-raḫmânu wa shadaqal-mursalûn"], [53, "اِنْ كَانَتْ اِلَّا صَيْحَةً وَّاحِدَةً فَاِذَا هُمْ جَمِيْعٌ لَّدَيْنَا مُحْضَرُوْنَ", "ing kânat illâ shaiḫataw wâḫidatan fa idzâ hum jamî'ul ladainâ muḫdlarûn"], [54, "فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْـًٔا وَّلَا تُجْزَوْنَ اِلَّا مَا كُنْتُمْ تَعْمَلُوْنَ", "fal-yauma lâ tudhlamu nafsun syai'aw wa lâ tujzauna illâ mâ kuntum ta'malûn"], [55, "اِنَّ اَصْحٰبَ الْجَنَّةِ الْيَوْمَ فِيْ شُغُلٍ فٰكِهُوْنَ ۚ", "inna ash-ḫâbal-jannatil-yauma fî syughulin fâkihûn"], [56, "هُمْ وَاَزْوَاجُهُمْ فِيْ ظِلٰلٍ عَلَى الْاَرَاۤىِٕكِ مُتَّكِـُٔوْنَ ۚ", "hum wa azwâjuhum fî dhilâlin 'alal-arâ'iki muttaki'ûn"], [57, "لَهُمْ فِيْهَا فَاكِهَةٌ وَّلَهُمْ مَّا يَدَّعُوْنَ ۚ", "lahum fîhâ fâkihatuw wa lahum mâ yadda'ûn"], [58, "سَلٰمٌۗ قَوْلًا مِّنْ رَّبٍّ رَّحِيْمٍ", "salâm, qaulam mir rabbir raḫîm"], [59, "وَامْتَازُوا الْيَوْمَ اَيُّهَا الْمُجْرِمُوْنَ", "wamtâzul-yauma ayyuhal-mujrimûn"], [60, "اَلَمْ اَعْهَدْ اِلَيْكُمْ يٰبَنِيْٓ اٰدَمَ اَنْ لَّا تَعْبُدُوا الشَّيْطٰنَۚ اِنَّهٗ لَكُمْ عَدُوٌّ مُّبِيْنٌ", "a lam a'had ilaikum yâ banî âdama al lâ ta'budusy-syaithân, innahû lakum 'aduwwum mubîn"], [61, "وَاَنِ اعْبُدُوْنِيْ ۗهٰذَا صِرَاطٌ مُّسْتَقِيْمٌ", "wa ani'budûnî, hâdzâ shirâthum mustaqîm"], [62, "وَلَقَدْ اَضَلَّ مِنْكُمْ جِبِلًّا كَثِيْرًا ۗاَفَلَمْ تَكُوْنُوْا تَعْقِلُوْنَ", "wa laqad adlalla mingkum jibillang katsîrâ, a fa lam takûnû ta'qilûn"], [63, "هٰذِهٖ جَهَنَّمُ الَّتِيْ كُنْتُمْ تُوْعَدُوْنَ", "hâdzihî jahannamullatî kuntum tû'adûn"], [64, "اِصْلَوْهَا الْيَوْمَ بِمَا كُنْتُمْ تَكْفُرُوْنَ", "ishlauhal-yauma bimâ kuntum takfurûn"], [65, "اَلْيَوْمَ نَخْتِمُ عَلٰٓى اَفْوَاهِهِمْ وَتُكَلِّمُنَآ اَيْدِيْهِمْ وَتَشْهَدُ اَرْجُلُهُمْ بِمَا كَانُوْا يَكْسِبُوْنَ", "al-yauma nakhtimu 'alâ afwâhihim wa tukallimunâ aidîhim wa tasy-hadu arjuluhum bimâ kânû yaksibûn"], [66, "وَلَوْ نَشَاۤءُ لَطَمَسْنَا عَلٰٓى اَعْيُنِهِمْ فَاسْتَبَقُوا الصِّرَاطَ فَاَنّٰى يُبْصِرُوْنَ", "walau nasyâ'u lathamasnâ 'alâ a'yunihim fastabaqush-shirâtha fa annâ yubshirûn"], [67, "وَلَوْ نَشَاۤءُ لَمَسَخْنٰهُمْ عَلٰى مَكَانَتِهِمْ فَمَا اسْتَطَاعُوْا مُضِيًّا وَّلَا يَرْجِعُوْنَ ࣖ", "walau nasyâ'u lamasakhnâhum 'alâ makânatihim famastathâ'û mudliyyaw wa lâ yarji'ûn"], [68, "وَمَنْ نُّعَمِّرْهُ نُنَكِّسْهُ فِى الْخَلْقِۗ اَفَلَا يَعْقِلُوْنَ", "wa man nu'ammir-hu nunakkis-hu fil-khalq, a fa lâ ya'qilûn"], [69, "وَمَا عَلَّمْنٰهُ الشِّعْرَ وَمَا يَنْۢبَغِيْ لَهٗ ۗاِنْ هُوَ اِلَّا ذِكْرٌ وَّقُرْاٰنٌ مُّبِيْنٌ ۙ", "wa mâ 'allamnâhusy-syi'ra wa mâ yambaghî lah, in huwa illâ dzikruw wa qur'ânum mubîn"], [70, "لِّيُنْذِرَ مَنْ كَانَ حَيًّا وَّيَحِقَّ الْقَوْلُ عَلَى الْكٰفِرِيْنَ", "liyundzira mang kâna ḫayyaw wa yaḫiqqal-qaulu 'alal-kâfirîn"], [71, "اَوَلَمْ يَرَوْا اَنَّا خَلَقْنَا لَهُمْ مِّمَّا عَمِلَتْ اَيْدِيْنَآ اَنْعَامًا فَهُمْ لَهَا مَالِكُوْنَ", "a wa lam yarau annâ khalaqnâ lahum mimmâ 'amilat aidînâ an'âman fa hum lahâ mâlikûn"], [72, "وَذَلَّلْنٰهَا لَهُمْ فَمِنْهَا رَكُوْبُهُمْ وَمِنْهَا يَأْكُلُوْنَ", "wa dzallalnâhâ lahum fa min-hâ rakûbuhum wa min-hâ ya'kulûn"], [73, "وَلَهُمْ فِيْهَا مَنَافِعُ وَمَشَارِبُۗ اَفَلَا يَشْكُرُوْنَ", "wa lahum fîhâ manâfi'u wa masyârib, a fa lâ yasykurûn"], [74, "وَاتَّخَذُوْا مِنْ دُوْنِ اللّٰهِ اٰلِهَةً لَّعَلَّهُمْ يُنْصَرُوْنَ ۗ", "wattakhadzû min dûnillâhi âlihatal la'allahum yunsharûn"], [75, "لَا يَسْتَطِيْعُوْنَ نَصْرَهُمْۙ وَهُمْ لَهُمْ جُنْدٌ مُّحْضَرُوْنَ", "lâ yastathî'ûna nashrahum wa hum lahum jundum muḫdlarûn"], [76, "فَلَا يَحْزُنْكَ قَوْلُهُمْ ۘاِنَّا نَعْلَمُ مَا يُسِرُّوْنَ وَمَا يُعْلِنُوْنَ", "fa lâ yaḫzungka qauluhum, innâ na'lamu mâ yusirrûna wa mâ yu'linûn"], [77, "اَوَلَمْ يَرَ الْاِنْسَانُ اَنَّا خَلَقْنٰهُ مِنْ نُّطْفَةٍ فَاِذَا هُوَ خَصِيْمٌ مُّبِيْنٌ", "a wa lam yaral-insânu annâ khalaqnâhu min nuthfatin fa idzâ huwa khashîmum mubîn"], [78, "وَضَرَبَ لَنَا مَثَلًا وَّنَسِيَ خَلْقَهٗۗ قَالَ مَنْ يُّحْيِ الْعِظَامَ وَهِيَ رَمِيْمٌ", "wa dlaraba lanâ matsalaw wa nasiya khalqah, qâla may yuḫyil-'idhâma wa hiya ramîm"], [79, "قُلْ يُحْيِيْهَا الَّذِيْٓ اَنْشَاَهَآ اَوَّلَ مَرَّةٍ ۗوَهُوَ بِكُلِّ خَلْقٍ عَلِيْمٌ ۙ", "qul yuḫyîhalladzî ansya'ahâ awwala marrah, wa huwa bikulli khalqin 'alîm"], [80, "ِۨالَّذِيْ جَعَلَ لَكُمْ مِّنَ الشَّجَرِ الْاَخْضَرِ نَارًاۙ فَاِذَآ اَنْتُمْ مِّنْهُ تُوْقِدُوْنَ", "alladzî ja'ala lakum minasy-syajaril-akhdlari nâran fa idzâ antum min-hu tûqidûn"], [81, "اَوَلَيْسَ الَّذِيْ خَلَقَ السَّمٰوٰتِ وَالْاَرْضَ بِقٰدِرٍ عَلٰٓى اَنْ يَّخْلُقَ مِثْلَهُمْ ۗبَلٰى وَهُوَ الْخَلّٰقُ الْعَلِيْمُ", "a wa laisalladzî khalaqas-samâwâti wal-ardla biqâdirin 'alâ ay yakhluqa mitslahum, balâ wa huwal-khallâqul-'alîm"], [82, "اِنَّمَآ اَمْرُهٗٓ اِذَآ اَرَادَ شَيْـًٔاۖ اَنْ يَّقُوْلَ لَهٗ كُنْ فَيَكُوْنُ", "innamâ amruhû idzâ arâda syai'an ay yaqûla lahû kun fa yakûn"], [83, "فَسُبْحٰنَ الَّذِيْ بِيَدِهٖ مَلَكُوْتُ كُلِّ شَيْءٍ وَّاِلَيْهِ تُرْجَعُوْنَ ࣖ", "fa sub-ḫânalladzî biyadihî malakûtu kulli syai'iw wa ilaihi turja'ûn"]]}]}, {"id": "kahfi", "name": "Al-Kahfi", "ar": "الكهف", "no": 18, "info": "Ayat 1–10 & 100–110", "parts": [{"title": "Ayat 1–10", "v": [[1, "اَلْحَمْدُ لِلّٰهِ الَّذِيْٓ اَنْزَلَ عَلٰى عَبْدِهِ الْكِتٰبَ وَلَمْ يَجْعَلْ لَّهٗ عِوَجًا ۜ", "al-ḫamdu lillâhilladzî anzala 'alâ 'abdihil-kitâba wa lam yaj'al lahû 'iwajâ"], [2, "قَيِّمًا لِّيُنْذِرَ بَأْسًا شَدِيْدًا مِّنْ لَّدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِيْنَ الَّذِيْنَ يَعْمَلُوْنَ الصّٰلِحٰتِ اَنَّ لَهُمْ اَجْرًا حَسَنًاۙ", "qayyimal liyundzira ba'san syadîdam mil ladun-hu wa yubasysyiral-mu'minînalladzîna ya'malûnash-shâliḫâti anna lahum ajran ḫasanâ"], [3, "مَّاكِثِيْنَ فِيْهِ اَبَدًاۙ", "mâkitsîna fîhi abadâ"], [4, "وَّيُنْذِرَ الَّذِيْنَ قَالُوا اتَّخَذَ اللّٰهُ وَلَدًاۖ", "wa yundziralladzîna qâluttakhadzallâhu َجْرًا حَسَنًاۙ", "qayyimal liyundzira ba'san syadîdam mil ladun-hu wa yubasysyiral-mu'minînalladzîna ya'malûnash-shâliḫâti anna lahum ajran ḫasanâ"], [3, "مَّاكِثِيْنَ فِيْهِ اَبَدًاۙ", "mâkitsîna fîhi abadâ"], [4, "وَّيُنْذِرَ الَّذِيْنَ قَالُوا اتَّخَذَ اللّٰهُ وَلَدًاۖ", "wa yundziralladzîna qâluttakhadzallâhu waladâ"], [5, "مَّا لَهُمْ بِهٖ مِنْ عِلْمٍ وَّلَا لِاٰبَاۤىِٕهِمْۗ  كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ اَفْوَاهِهِمْۗ اِنْ يَّقُوْلُوْنَ اِلَّا كَذِبًا", "mâ lahum bihî min 'ilmiw wa lâ li'âbâ'ihim, kaburat kalimatan takhruju min afwâhihim, iy yaqûlûna illâ kadzibâ"], [6, "فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلٰٓى اٰثَارِهِمْ اِنْ لَّمْ يُؤْمِنُوْا بِهٰذَا الْحَدِيْثِ اَسَفًا", "fa la'allaka bâkhi'un nafsaka 'alâ âtsârihim il lam yu'minû bihâdzal-ḫadîtsi asafâ"], [7, "اِنَّا جَعَلْنَا مَا عَلَى الْاَرْضِ زِيْنَةً لَّهَا لِنَبْلُوَهُمْ اَيُّهُمْ اَحْسَنُ عَمَلًا", "innâ ja'alnâ mâ 'alal-ardli zînatal lahâ linabluwahum ayyuhum aḫsanu 'amalâ"], [8, "وَاِنَّا لَجَاعِلُوْنَ مَا عَلَيْهَا صَعِيْدًا جُرُزًاۗ", "wa innâ lajâ'ilûna mâ 'alaihâ sha'îdan juruzâ"], [9, "اَمْ حَسِبْتَ اَنَّ اَصْحٰبَ الْكَهْفِ وَالرَّقِيْمِ كَانُوْا مِنْ اٰيٰتِنَا عَجَبًا", "am ḫasibta anna ash-ḫâbal-kahfi war-raqîmi kânû min âyâtinâ 'ajabâ"], [10, "اِذْ اَوَى الْفِتْيَةُ اِلَى الْكَهْفِ فَقَالُوْا رَبَّنَآ اٰتِنَا مِنْ لَّدُنْكَ رَحْمَةً وَّهَيِّئْ لَنَا مِنْ اَمْرِنَا رَشَدًا", "idz awal-fityatu ilal-kahfi fa qâlû rabbanâ âtinâ mil ladungka raḫmataw wa hayyi' lanâ min amrinâ rasyadâ"], [11, "فَضَرَبْنَا عَلٰٓى اٰذَانِهِمْ فِى الْكَهْفِ سِنِيْنَ عَدَدًاۙ", "fa dlarabnâ 'alâ âdzânihim fil-kahfi sinîna 'adadâ"], [12, "ثُمَّ بَعَثْنٰهُمْ لِنَعْلَمَ اَيُّ الْحِزْبَيْنِ اَحْصٰى لِمَا لَبِثُوْٓا اَمَدًا ࣖ", "tsumma ba'atsnâhum lina'lama ayyul-ḫizbaini aḫshâ limâ labitsû amadâ"], [13, "نَحْنُ نَقُصُّ عَلَيْكَ نَبَاَهُمْ بِالْحَقِّۗ اِنَّهُمْ فِتْيَةٌ اٰمَنُوْا بِرَبِّهِمْ وَزِدْنٰهُمْ هُدًىۖ", "naḫnu naqushshu 'alaika naba'ahum bil-ḫaqq, innahum fityatun âmanû birabbihim wa zidnâhum hudâ"], [14, "وَّرَبَطْنَا عَلٰى قُلُوْبِهِمْ اِذْ قَامُوْا فَقَالُوْا رَبُّنَا رَبُّ السَّمٰوٰتِ وَالْاَرْضِ لَنْ نَّدْعُوَا۟ مِنْ دُوْنِهٖٓ اِلٰهًا لَّقَدْ قُلْنَآ اِذًا شَطَطًا", "wa rabathnâ 'alâ qulûbihim idz qâmû fa qâlû rabbunâ rabbus-samâwâti wal-ardli lan nad'uwa min dûnihî ilâhal laqad qulnâ idzan syathathâ"], [15, "هٰٓؤُلَاۤءِ قَوْمُنَا اتَّخَذُوْا مِنْ دُوْنِهٖٓ اٰلِهَةًۗ  لَوْلَا يَأْتُوْنَ عَلَيْهِمْ بِسُلْطٰنٍۢ بَيِّنٍۗ فَمَنْ اَظْلَمُ مِمَّنِ افْتَرٰى عَلَى اللّٰهِ كَذِبًاۗ", "hâ'ulâ'i qaumunattakhadzû min dûnihî âlihah, lau lâ ya'tûna 'alaihim bisulthânim bayyin, fa man adhlamu mim maniftarâ 'alallâhi kadzibâ"], [16, "وَاِذِ اعْتَزَلْتُمُوْهُمْ وَمَا يَعْبُدُوْنَ اِلَّا اللّٰهَ فَأْوٗٓا اِلَى الْكَهْفِ يَنْشُرْ لَكُمْ رَبُّكُمْ مِّنْ رَّحْمَتِهٖ وَيُهَيِّئْ لَكُمْ مِّنْ اَمْرِكُمْ مِّرْفَقًا", "wa idzi'tazaltumûhum wa mâ ya'budûna illallâha fa'wû ilal-kahfi yansyur lakum rabbukum mir raḫmatihî wa yuhayyi' lakum min amrikum mirfaqâ"], [17, "۞ وَتَرَى الشَّمْسَ اِذَا طَلَعَتْ تَّزَاوَرُ عَنْ كَهْفِهِمْ ذَاتَ الْيَمِيْنِ وَاِذَا غَرَبَتْ تَّقْرِضُهُمْ ذَاتَ الشِّمَالِ وَهُمْ فِيْ فَجْوَةٍ مِّنْهُۗ ذٰلِكَ مِنْ اٰيٰتِ اللّٰهِ ۗمَنْ يَّهْدِ اللّٰهُ فَهُوَ الْمُهْتَدِ وَمَنْ يُّضْلِلْ فَلَنْ تَجِدَ لَهٗ وَلِيًّا مُّرْشِدًا ࣖ", "wa tarasy-syamsa idzâ thala'at tazâwaru 'ang kahfihim dzâtal-yamîni wa idzâ gharabat taqridluhum dzâtasy-syimâli wa hum fî fajwatim min-h, dzâlika min âyâtillâh, may yahdillâhu fa huwal-muhtadi wa may yudllil fa lan tajida lahû waliyyam mursyidâ"], [18, "وَتَحْسَبُهُمْ اَيْقَاظًا وَّهُمْ رُقُوْدٌ  ۖوَّنُقَلِّبُهُمْ ذَاتَ الْيَمِيْنِ وَذَاتَ الشِّمَالِ ۖوَكَلْبُهُمْ بَاسِطٌ ذِرَاعَيْهِ بِالْوَصِيْدِۗ  لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَّلَمُلِئْتَ مِنْهُمْ رُعْبًا", "wa taḫsabuhum aiqâdhaw wa hum ruqûduw wa nuqallibuhum dzâtal-yamîni wa dzâtasy-syimâli wa kalbuhum bâsithun dzirâ'aihi bil-washîd, lawiththala'ta 'alaihim lawallaita min-hum firâraw wa lamuli'ta min-hum ru'bâ"], [19, "وَكَذٰلِكَ بَعَثْنٰهُمْ لِيَتَسَاۤءَلُوْا بَيْنَهُمْۗ قَالَ قَاۤىِٕلٌ مِّنْهُمْ كَمْ لَبِثْتُمْۗ قَالُوْا لَبِثْنَا يَوْمًا اَوْ بَعْضَ يَوْمٍۗ قَالُوْا رَبُّكُمْ اَعْلَمُ بِمَا لَبِثْتُمْۗ فَابْعَثُوْٓا اَحَدَكُمْ بِوَرِقِكُمْ هٰذِهٖٓ اِلَى الْمَدِيْنَةِ فَلْيَنْظُرْ اَيُّهَآ اَزْكٰى طَعَامًا فَلْيَأْتِكُمْ بِرِزْقٍ مِّنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ اَحَدًا", "wa kadzâlika ba'atsnâhum liyatasâ'alû bainahum, qâla qâ'ilum min-hum kam labitstum, qâlû labitsnâ yauman au ba'dla yaûm, qâlû rabbukum a'lamu bimâ labitstum, fab'atsû aḫadakum biwariqikum hâdzihî ilal-madînati falyandhur ayyuhâ azkâ tha'âman falya'tikum birizqim min-hu walyatalaththaf wa lâ yusy'iranna bikum aḫadâ"], [20, "اِنَّهُمْ اِنْ يَّظْهَرُوْا عَلَيْكُمْ يَرْجُمُوْكُمْ اَوْ يُعِيْدُوْكُمْ فِيْ مِلَّتِهِمْ وَلَنْ تُفْلِحُوْٓا اِذًا اَبَدًا", "innahum iy yadh-harû 'alaikum yarjumûkum au yu'îdûkum fî millatihim wa lan tufliḫû idzan abadâ"], [21, "وَكَذٰلِكَ اَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوْٓا اَنَّ وَعْدَ اللّٰهِ حَقٌّ وَّاَنَّ السَّاعَةَ لَا رَيْبَ فِيْهَاۚ اِذْ يَتَنَازَعُوْنَ بَيْنَهُمْ اَمْرَهُمْ فَقَالُوا ابْنُوْا عَلَيْهِمْ بُنْيَانًاۗ رَبُّهُمْ اَعْلَمُ بِهِمْۗ قَالَ الَّذِيْنَ غَلَبُوْا عَلٰٓى اَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِمْ مَّسْجِدًا", "wa kadzâlika a'tsarnâ 'alaihim liya'lamû anna wa'dallâhi ḫaqquw wa annas-sâ'ata lâ raiba fîhâ, idz yatanâza'ûna bainahum amrahum fa qâlubnû 'alaihim bun-yânâ, rabbuhum a'lamu bihim, qâlalladzîna ghalabû 'alâ amrihim lanattakhidzanna 'alaihim masjidâ"], [22, "سَيَقُوْلُوْنَ ثَلٰثَةٌ رَّابِعُهُمْ كَلْبُهُمْۚ وَيَقُوْلُوْنَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًاۢ بِالْغَيْبِۚ وَيَقُوْلُوْنَ سَبْعَةٌ وَّثَامِنُهُمْ كَلْبُهُمْ ۗقُلْ رَّبِّيْٓ اَعْلَمُ بِعِدَّتِهِمْ مَّا يَعْلَمُهُمْ اِلَّا قَلِيْلٌ ەۗ فَلَا تُمَارِ فِيْهِمْ اِلَّا مِرَاۤءً ظَاهِرًا ۖوَّلَا تَسْتَفْتِ فِيْهِمْ مِّنْهُمْ اَحَدًا ࣖ", "sayaqûlûna tsalâtsatur râbi'uhum kalbuhum, wa yaqûlûna khamsatun sâdisuhum kalbuhum rajmam bil-ghaîb, wa yaqûlûna sab'atuw wa tsâminuhum kalbuhum, qur rabbî a'lamu bi'iddatihim mâ ya'lamuhum illâ qalîl, fa lâ tumâri fîhim illâ mirâ'an dhâhiraw wa lâ tastafti fîhim min-hum aḫadâ"], [23, "وَلَا تَقُوْلَنَّ لِشَا۟يْءٍ اِنِّيْ فَاعِلٌ ذٰلِكَ غَدًاۙ", "wa lâ taqûlanna lisyai'in innî fâ'ilun dzâlika ghadâ"], [24, "اِلَّآ اَنْ يَّشَاۤءَ اللّٰهُ ۖوَاذْكُرْ رَّبَّكَ اِذَا نَسِيْتَ وَقُلْ عَسٰٓى اَنْ يَّهْدِيَنِ رَبِّيْ لِاَقْرَبَ مِنْ هٰذَا رَشَدًا", "illâ ay yasyâ'allâhu wadzkur rabbaka idzâ nasîta wa qul 'asâ ay yahdiyani rabbî li'aqraba min hâdzâ rasyadâ"], [25, "وَلَبِثُوْا فِيْ كَهْفِهِمْ ثَلٰثَ مِائَةٍ سِنِيْنَ وَازْدَادُوْا تِسْعًا", "wa labitsû fî kahfihim tsalâtsa mi'atin sinîna wazdâdû tis'â"], [26, "قُلِ اللّٰهُ اَعْلَمُ بِمَا لَبِثُوْا ۚ لَهٗ غَيْبُ السَّمٰوٰتِ وَالْاَرْضِۗ اَبْصِرْ بِهٖ وَاَسْمِعْۗ مَا لَهُمْ مِّنْ دُوْنِهٖ مِنْ وَّلِيٍّۗ وَلَا يُشْرِكُ فِيْ حُكْمِهٖٓ اَحَدًا", "qulillâhu a'lamu bimâ labitsû, lahû ghaibus-samâwâti wal-ardl, abshir bihî wa asmi', mâ lahum min dûnihî miw waliyy, wa lâ yusyriku fî ḫukmihî aḫadâ"], [27, "وَاتْلُ مَآ اُوْحِيَ اِلَيْكَ مِنْ كِتَابِ رَبِّكَۗ  لَا مُبَدِّلَ لِكَلِمٰتِهٖۗ وَلَنْ تَجِدَ مِنْ دُوْنِهٖ مُلْتَحَدًا", "watlu mâ ûḫiya ilaika ming kitâbi rabbik, lâ mubaddila likalimâtih, wa lan tajida min dûnihî multaḫadâ"], [28, "وَاصْبِرْ نَفْسَكَ مَعَ الَّذِيْنَ يَدْعُوْنَ رَبَّهُمْ بِالْغَدٰوةِ وَالْعَشِيِّ يُرِيْدُوْنَ وَجْهَهٗ وَلَا تَعْدُ عَيْنٰكَ عَنْهُمْۚ تُرِيْدُ زِيْنَةَ الْحَيٰوةِ الدُّنْيَاۚ وَلَا تُطِعْ مَنْ اَغْفَلْنَا قَلْبَهٗ عَنْ ذِكْرِنَا وَاتَّبَعَ هَوٰىهُ وَكَانَ اَمْرُهٗ فُرُطًا", "washbir nafsaka ma'alladzîna yad'ûna rabbahum bil-ghadâti wal-'asyiyyi yurîdûna waj-hahû wa lâ ta'du 'ainâka 'an-hum, turîdu zînatal-ḫayâtid-dun-yâ, wa lâ tuthi' man aghfalnâ qalbahû 'an dzikrinâ wattaba'a hawâhu wa kâna amruhû furuthâ"], [29, "وَقُلِ الْحَقُّ مِنْ رَّبِّكُمْۗ فَمَنْ شَاۤءَ فَلْيُؤْمِنْ وَّمَنْ شَاۤءَ فَلْيَكْفُرْۚ اِنَّآ اَعْتَدْنَا لِلظّٰلِمِيْنَ نَارًاۙ اَحَاطَ بِهِمْ سُرَادِقُهَاۗ وَاِنْ يَّسْتَغِيْثُوْا يُغَاثُوْا بِمَاۤءٍ كَالْمُهْلِ يَشْوِى الْوُجُوْهَۗ بِئْسَ الشَّرَابُۗ وَسَاۤءَتْ مُرْتَفَقًا", "wa qulil-ḫaqqu mir rabbikum, fa man syâ'a falyu'miw wa man syâ'a falyakfur, innâ a'tadnâ lidh-dhâlimîna nâran aḫâtha bihim surâdiquhâ, wa iy yastaghîtsû yughâtsû bimâ'ing kal-muhli yasywil-wujûh, bi'sasy-syarâb, wa sâ'at murtafaqâ"], [30, "اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ اِنَّا لَا نُضِيْعُ اَجْرَ مَنْ اَحْسَنَ عَمَلًاۚ", "innalladzîna âmanû wa 'amilush-shâliḫâti innâ lâ nudlî'u ajra man aḫsana 'amalâ"], [31, "اُولٰۤىِٕكَ لَهُمْ جَنّٰتُ عَدْنٍ تَجْرِيْ مِنْ تَحْتِهِمُ الْاَنْهٰرُ يُحَلَّوْنَ فِيْهَا مِنْ اَسَاوِرَ مِنْ ذَهَبٍ وَّيَلْبَسُوْنَ ثِيَابًا خُضْرًا مِّنْ سُنْدُسٍ وَّاِسْتَبْرَقٍ مُّتَّكِىِٕيْنَ فِيْهَا عَلَى الْاَرَاۤىِٕكِۗ نِعْمَ الثَّوَابُۗ وَحَسُنَتْ مُرْتَفَقًا", "ulâ'ika lahum jannâtu 'adnin tajrî min taḫtihimul-an-hâru yuḫallauna fîhâ min asâwira min dzahabiw wa yalbasûna tsiyâban khudlram min sundusiw wa istabraqim muttaki'îna fîhâ 'alal-arâ'ik, ni'mats-tsawâb, wa ḫasunat murtafaqâ"], [32, "۞ وَاضْرِبْ لَهُمْ مَّثَلًا رَّجُلَيْنِ جَعَلْنَا لِاَحَدِهِمَا جَنَّتَيْنِ مِنْ اَعْنَابٍ وَّحَفَفْنٰهُمَا بِنَخْلٍ وَّجَعَلْنَا بَيْنَهُمَا زَرْعًاۗ", "wadlrib lahum matsalar rajulaini ja'alnâ li'aḫadihimâ jannataini min a'nâbiw wa ḫafafnâhumâ binakhliw wa ja'alnâ bainahumâ zar'â"], [33, "كِلْتَا الْجَنَّتَيْنِ اٰتَتْ اُكُلَهَا وَلَمْ تَظْلِمْ مِّنْهُ شَيْـًٔاۙ وَّفَجَّرْنَا خِلٰلَهُمَا نَهَرًاۙ", "kiltal-jannataini âtat ukulahâ wa lam tadhlim min-hu syai'aw wa fajjarnâ khilâlahumâ naharâ"], [34, "وَّكَانَ لَهٗ ثَمَرٌۚ فَقَالَ لِصَاحِبِهٖ وَهُوَ يُحَاوِرُهٗٓ اَنَا۠ اَكْثَرُ مِنْكَ مَالًا وَّاَعَزُّ نَفَرًا", "wa kâna lahû tsamar, fa qâla lishâḫibihî wa huwa yuḫâwiruhû ana aktsaru mingka mâlaw wa a'azzu nafarâ"], [35, "وَدَخَلَ جَنَّتَهٗ وَهُوَ ظَالِمٌ لِّنَفْسِهٖۚ قَالَ مَآ اَظُنُّ اَنْ تَبِيْدَ هٰذِهٖٓ اَبَدًاۙ", "wa dakhala jannatahû wa huwa dhâlimul linafsih, qâla mâ adhunnu an tabîda hâdzihî abadâ"], [36, "وَّمَآ اَظُنُّ السَّاعَةَ قَاۤىِٕمَةً وَّلَىِٕنْ رُّدِدْتُّ اِلٰى رَبِّيْ لَاَجِدَنَّ خَيْرًا مِّنْهَا مُنْقَلَبًا", "wa mâ adhunnus-sâ'ata qâ'imataw wa la'ir rudittu ilâ rabbî la'ajidanna khairam min-hâ mungqalabâ"], [37, "قَالَ لَهٗ صَاحِبُهٗ وَهُوَ يُحَاوِرُهٗٓ اَكَفَرْتَ بِالَّذِيْ خَلَقَكَ مِنْ تُرَابٍ ثُمَّ مِنْ نُّطْفَةٍ ثُمَّ سَوّٰىكَ رَجُلًاۗ", "qâla lahû shâḫibuhû wa huwa yuḫâwiruhû a kafarta billadzî khalaqaka min turâbin tsumma min nuthfatin tsumma sawwâka rajulâ"], [38, "لٰكِنَّا۠ هُوَ اللّٰهُ رَبِّيْ وَلَآ اُشْرِكُ بِرَبِّيْٓ اَحَدًا", "lâkinna huwallâhu rabbî wa lâ usyriku birabbî aḫadâ"], [39, "وَلَوْلَآ اِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاۤءَ اللّٰهُ ۙ لَا قُوَّةَ اِلَّا بِاللّٰهِ ۚاِنْ تَرَنِ اَنَا۠ اَقَلَّ مِنْكَ مَالًا وَّوَلَدًاۚ", "walau lâ idz dakhalta jannataka qulta mâ syâ'allâhu lâ quwwata illâ billâh, in tarani ana aqalla mingka mâlaw wa waladâ"], [40, "فَعَسٰى رَبِّيْٓ اَنْ يُّؤْتِيَنِ خَيْرًا مِّنْ جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِّنَ السَّمَاۤءِ فَتُصْبِحَ صَعِيْدًا زَلَقًاۙ", "fa asâ rabbî ay yu'tiyani khairam min jannatika wa yursila 'alaihâ ḫusbânam minas-samâ'i fa tushbiḫa sha'îdan zalaqâ"], [41, "اَوْ يُصْبِحَ مَاۤؤُهَا غَوْرًا فَلَنْ تَسْتَطِيْعَ لَهٗ طَلَبًا", "au yushbiḫa mâ'uhâ ghauran fa lan tastathî'a lahû thalabâ"], [42, "وَاُحِيْطَ بِثَمَرِهٖ فَاَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلٰى مَآ اَنْفَقَ فِيْهَا وَهِيَ خَاوِيَةٌ عَلٰى عُرُوْشِهَا وَيَقُوْلُ يٰلَيْتَنِيْ لَمْ اُشْرِكْ بِرَبِّيْٓ اَحَدًا", "wa uḫîtha bitsamarihî fa ashbaḫa yuqallibu kaffaihi 'alâ mâ anfaqa fîhâ wa hiya khâwiyatun 'alâ 'urûsyihâ wa yaqûlu yâ laitanî lam usyrik birabbî aḫadâ"], [43, "وَلَمْ تَكُنْ لَّهٗ فِئَةٌ يَّنْصُرُوْنَهٗ مِنْ دُوْنِ اللّٰهِ وَمَا كَانَ مُنْتَصِرًاۗ", "wa lam takul lahû fi'atuy yanshurûnahû min dûnillâhi wa mâ kâna muntashirâ"], [44, "هُنَالِكَ الْوَلَايَةُ لِلّٰهِ الْحَقِّۗ هُوَ خَيْرٌ ثَوَابًا وَّخَيْرٌ عُقْبًا ࣖ", "hunâlikal-walâyatu lillâhil-ḫaqq, huwa khairun tsawâbaw wa khairun 'uqbâ"], [45, "وَاضْرِبْ لَهُمْ مَّثَلَ الْحَيٰوةِ الدُّنْيَا كَمَاۤءٍ اَنْزَلْنٰهُ مِنَ السَّمَاۤءِ فَاخْتَلَطَ بِهٖ نَبَاتُ الْاَرْضِ فَاَصْبَحَ هَشِيْمًا تَذْرُوْهُ الرِّيٰحُ ۗوَكَانَ اللّٰهُ عَلٰى كُلِّ شَيْءٍ مُّقْتَدِرًا", "wadlrib lahum matsalal-ḫayâtid-dun-yâ kamâ'in anzalnâhu minas-samâ'i fakhtalatha bihî nabâtul-ardli fa ashbaḫa hasyîman tadzrûhur-riyâḫ, wa kânallâhu 'alâ kulli syai'im muqtadirâ"], [46, "اَلْمَالُ وَالْبَنُوْنَ زِيْنَةُ الْحَيٰوةِ الدُّنْيَاۚ وَالْبٰقِيٰتُ الصّٰلِحٰتُ خَيْرٌ عِنْدَ رَبِّكَ ثَوَابًا وَّخَيْرٌ اَمَلًا", "al-mâlu wal-banûna zînatul-ḫayâtid-dun-yâ, wal-bâqiyâtush-shâliḫâtu khairun 'inda rabbika tsawâbaw wa khairun amalâ"], [47, "وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْاَرْضَ بَارِزَةًۙ وَّحَشَرْنٰهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ اَحَدًاۚ", "wa yauma nusayyirul-jibâla wa taral-ardla bârizataw wa ḫasyarnâhum fa lam nughâdir min-hum aḫadâ"], [48, "وَعُرِضُوْا عَلٰى رَبِّكَ صَفًّاۗ  لَقَدْ جِئْتُمُوْنَا كَمَا خَلَقْنٰكُمْ اَوَّلَ مَرَّةٍۢ  ۖبَلْ زَعَمْتُمْ اَلَّنْ نَّجْعَلَ لَكُمْ مَّوْعِدًا", "wa 'uridlû 'alâ rabbika shaffâ, laqad ji'tumûnâ kamâ khalaqnâkum awwala marratim bal za'amtum allan naj'ala lakum mau'idâ"], [49, "وَوُضِعَ الْكِتٰبُ فَتَرَى الْمُجْرِمِيْنَ مُشْفِقِيْنَ مِمَّا فِيْهِ وَيَقُوْلُوْنَ يٰوَيْلَتَنَا مَالِ هٰذَا الْكِتٰبِ لَا يُغَادِرُ صَغِيْرَةً وَّلَا كَبِيْرَةً اِلَّآ اَحْصٰىهَاۚ وَوَجَدُوْا مَا عَمِلُوْا حَاضِرًاۗ وَلَا يَظْلِمُ رَبُّكَ اَحَدًا ࣖ", "wa wudli'al kitâbu fa taral-mujrimîna musyfiqîna mimmâ fîhi wa yaqûlûna yâ wailatanâ mâli hâdzal-kitâbi lâ yughâdiru shaghîrataw wa lâ kabîratan illâ aḫshâhâ, wa wajadû mâ 'amilû ḫâdlirâ, wa lâ yadhlimu rabbuka aḫadâ"], [50, "وَاِذْ قُلْنَا لِلْمَلٰۤىِٕكَةِ اسْجُدُوْا لِاٰدَمَ فَسَجَدُوْٓا اِلَّآ اِبْلِيْسَۗ كَانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ اَمْرِ رَبِّهٖۗ اَفَتَتَّخِذُوْنَهٗ وَذُرِّيَّتَهٗٓ اَوْلِيَاۤءَ مِنْ دُوْنِيْ وَهُمْ لَكُمْ عَدُوٌّۗ بِئْسَ لِلظّٰلِمِيْنَ بَدَلًا", "wa idz qulnâ lil-malâ'ikatisjudû li'âdama fa sajadû illâ iblîs, kâna minal-jinni fa fasaqa 'an amri rabbih, a fa tattakhidzûnahû wa dzurriyyatahû auliyâ'a min dûnî wa hum lakum 'aduww, bi'sa lidh-dhâlimîna badalâ"], [51, "۞ مَآ اَشْهَدْتُّهُمْ خَلْقَ السَّمٰوٰتِ وَالْاَرْضِ وَلَا خَلْقَ اَنْفُسِهِمْۖ وَمَا كُنْتُ مُتَّخِذَ الْمُضِلِّيْنَ عَضُدًا", "mâ asy-hattuhum khalqas-samâwâti wal-ardli wa lâ khalqa anfusihim wa mâ kuntu muttakhidzal-mudlillîna 'adludâ"], [52, "وَيَوْمَ يَقُوْلُ نَادُوْا شُرَكَاۤءِيَ الَّذِيْنَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيْبُوْا لَهُمْ وَجَعَلْنَا بَيْنَهُمْ مَّوْبِقًا", "wa yauma yaqûlu nâdû syurakâ'iyalladzîna za'amtum fa da'auhum fa lam yastajîbû lahum wa ja'alnâ bainahum maubiqâ"], [53, "وَرَاَ الْمُجْرِمُوْنَ النَّارَ فَظَنُّوْٓا اَنَّهُمْ مُّوَاقِعُوْهَا وَلَمْ يَجِدُوْا عَنْهَا مَصْرِفًا ࣖ", "wa ra'al-mujrimûnan-nâra fa dhannû annahum muwâqi'ûhâ wa lam yajidû 'an-hâ mashrifâ"], [54, "وَلَقَدْ صَرَّفْنَا فِيْ هٰذَا الْقُرْاٰنِ لِلنَّاسِ مِنْ كُلِّ مَثَلٍۗ وَكَانَ الْاِنْسَانُ اَكْثَرَ شَيْءٍ جَدَلًا", "wa laqad sharrafnâ fî hâdzal-qur'âni lin-nâsi ming kulli matsal, wa kânal-insânu aktsara syai'in jadalâ"], [55, "وَمَا مَنَعَ النَّاسَ اَنْ يُّؤْمِنُوْٓا اِذْ جَاۤءَهُمُ الْهُدٰى وَيَسْتَغْفِرُوْا رَبَّهُمْ اِلَّآ اَنْ تَأْتِيَهُمْ سُنَّةُ الْاَوَّلِيْنَ اَوْ يَأْتِيَهُمُ الْعَذَابُ قُبُلًا", "wa mâ mana'an-nâsa ay yu'minû idz jâ'ahumul-hudâ wa yastaghfirû rabbahum illâ an ta'tiyahum sunnatul-awwalîna au ya'tiyahumul-'adzâbu qubulâ"], [56, "وَمَا نُرْسِلُ الْمُرْسَلِيْنَ اِلَّا مُبَشِّرِيْنَ وَمُنْذِرِيْنَۚ وَيُجَادِلُ الَّذِيْنَ كَفَرُوْا بِالْبَاطِلِ لِيُدْحِضُوْا بِهِ الْحَقَّ وَاتَّخَذُوْٓا اٰيٰتِيْ وَمَآ اُنْذِرُوْا هُزُوًا", "wa mâ nursilul-mursalîna illâ mubasysyirîna wa mundzirîn, wa yujâdilulladzîna kafarû bil-bâthili liyud-ḫidlû bihil-ḫaqqa wattakhadzû âyâtî wa mâ undzirû huzuwâ"], [57, "وَمَنْ اَظْلَمُ مِمَّنْ ذُكِّرَ بِاٰيٰتِ رَبِّهٖ فَاَعْرَضَ عَنْهَا وَنَسِيَ مَا قَدَّمَتْ يَدَاهُۗ اِنَّا جَعَلْنَا عَلٰى قُلُوْبِهِمْ اَكِنَّةً اَنْ يَّفْقَهُوْهُ وَفِيْٓ اٰذَانِهِمْ وَقْرًاۗ وَاِنْ تَدْعُهُمْ اِلَى الْهُدٰى فَلَنْ يَّهْتَدُوْٓا اِذًا اَبَدًا", "wa man adhlamu mim man dzukkira bi'âyâti rabbihî fa a'radla 'an-hâ wa nasiya mâ qaddamat yadâh, innâ ja'alnâ 'alâ qulûbihim akinnatan ay yafqahûhu wa fî âdzânihim waqrâ, wa in tad'uhum ilal-hudâ fa lay yahtadû idzan abadâ"], [58, "وَرَبُّكَ الْغَفُوْرُ ذُو الرَّحْمَةِۗ  لَوْ يُؤَاخِذُهُمْ بِمَا كَسَبُوْا لَعَجَّلَ لَهُمُ الْعَذَابَۗ بَلْ لَّهُمْ مَّوْعِدٌ لَّنْ يَّجِدُوْا مِنْ دُوْنِهٖ مَوْىِٕلًا", "wa rabbukal-ghafûru dzur-raḫmah, lau yu'âkhidzuhum bimâ kasabû la'ajjala lahumul-'adzâb, bal lahum mau'idul lay yajidû min dûnihî mau'ilâ"], [59, "وَتِلْكَ الْقُرٰٓى اَهْلَكْنٰهُمْ لَمَّا ظَلَمُوْا وَجَعَلْنَا لِمَهْلِكِهِمْ مَّوْعِدًا ࣖ", "wa tilkal-qurâ ahlaknâhum lammâ dhalamû wa ja'alnâ limahlikihim mau'idâ"], [60, "وَاِذْ قَالَ مُوْسٰى لِفَتٰىهُ لَآ اَبْرَحُ حَتّٰٓى  اَبْلُغَ مَجْمَعَ الْبَحْرَيْنِ اَوْ اَمْضِيَ حُقُبًا", "wa idz qâla mûsâ lifatâhu lâ abraḫu ḫattâ ablugha majma'al-baḫraini au amdliya ḫuqubâ"], [61, "فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوْتَهُمَا فَاتَّخَذَ سَبِيْلَهٗ فِى الْبَحْرِ سَرَبًا", "fa lammâ balaghâ majma'a bainihimâ nasiyâ ḫûtahumâ fattakhadza sabîlahû fil-baḫri sarabâ"], [62, "فَلَمَّا جَاوَزَا قَالَ لِفَتٰىهُ اٰتِنَا غَدَاۤءَنَاۖ  لَقَدْ لَقِيْنَا مِنْ سَفَرِنَا هٰذَا نَصَبًا", "fa lammâ jâwazâ qâla lifatâhu âtinâ ghadâ'anâ laqad laqînâ min safarinâ hâdzâ nashabâ"], [63, "قَالَ اَرَاَيْتَ اِذْ اَوَيْنَآ اِلَى الصَّخْرَةِ فَاِنِّيْ نَسِيْتُ الْحُوْتَۖ وَمَآ اَنْسٰىنِيْهُ اِلَّا الشَّيْطٰنُ اَنْ اَذْكُرَهٗۚ وَاتَّخَذَ سَبِيْلَهٗ فِى الْبَحْرِ عَجَبًا", "qâla a ra'aita idz awainâ ilash-shakhrati fa innî nasîtul-ḫûta wa mâ ansânîhu illasy-syaithânu an adzkurah, wattakhadza sabîlahû fil-baḫri 'ajabâ"], [64, "قَالَ ذٰلِكَ مَا كُنَّا نَبْغِۖ فَارْتَدَّا عَلٰٓى اٰثَارِهِمَا قَصَصًاۙ", "qâla dzâlika mâ kunnâ nabghi fartaddâ 'alâ âtsârihimâ qashashâ"], [65, "فَوَجَدَا عَبْدًا مِّنْ عِبَادِنَآ اٰتَيْنٰهُ رَحْمَةً مِّنْ عِنْدِنَا وَعَلَّمْنٰهُ مِنْ لَّدُنَّا عِلْمًا", "fa wajadâ 'abdam min 'ibâdinâ âtainâhu raḫmatam min 'indinâ wa 'allamnâhu mil ladunnâ 'ilmâ"], [66, "قَالَ لَهٗ مُوسٰى هَلْ اَتَّبِعُكَ عَلٰٓى اَنْ تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا", "qâla lahû mûsâ hal attabi'uka 'alâ an tu'allimani mimmâ 'ullimta rusydâ"], [67, "قَالَ اِنَّكَ لَنْ تَسْتَطِيْعَ مَعِيَ صَبْرًا", "qâla innaka lan tastathî'a ma'iya shabrâ"], [68, "وَكَيْفَ تَصْبِرُ عَلٰى مَا لَمْ تُحِطْ بِهٖ خُبْرًا", "wa kaifa tashbiru 'alâ mâ lam tuḫith bihî khubrâ"], [69, "قَالَ سَتَجِدُنِيْٓ اِنْ شَاۤءَ اللّٰهُ صَابِرًا وَّلَآ اَعْصِيْ لَكَ اَمْرًا", "qâla satajidunî in syâ'allâhu shâbiraw wa lâ a'shî laka amrâ"], [70, "قَالَ فَاِنِ اتَّبَعْتَنِيْ فَلَا تَسْـَٔلْنِيْ عَنْ شَيْءٍ حَتّٰٓى اُحْدِثَ لَكَ مِنْهُ ذِكْرًا ࣖ", "qâla fa inittaba'tanî fa lâ tas'alnî 'an syai'in ḫattâ uḫditsa laka min-hu dzikrâ"], [71, "فَانْطَلَقَاۗ حَتّٰٓى اِذَا رَكِبَا فِى السَّفِيْنَةِ خَرَقَهَاۗ قَالَ اَخَرَقْتَهَا لِتُغْرِقَ اَهْلَهَاۚ  لَقَدْ جِئْتَ شَيْـًٔا اِمْرًا", "fanthalaqâ, ḫattâ idzâ rakibâ fis-safînati kharaqahâ, qâla a kharaqtahâ litughriqa ahlahâ, laqad ji'ta syai'an imrâ"], [72, "قَالَ اَلَمْ اَقُلْ اِنَّكَ لَنْ تَسْتَطِيْعَ مَعِيَ صَبْرًا", "qâla a lam aqul innaka lan tastathî'a ma'iya shabrâ"], [73, "قَالَ لَا تُؤَاخِذْنِيْ بِمَا نَسِيْتُ وَلَا تُرْهِقْنِيْ مِنْ اَمْرِيْ عُسْرًا", "qâla lâ tu'âkhidznî bimâ nasîtu wa lâ tur-hiqnî min amrî 'usrâ"], [74, "فَانْطَلَقَا ۗحَتّٰٓى اِذَا لَقِيَا غُلٰمًا فَقَتَلَهٗ ۙقَالَ اَقَتَلْتَ نَفْسًا زَكِيَّةً؈ۢبِغَيْرِ نَفْسٍۗ  لَقَدْ جِئْتَ شَيْـًٔا نُكْرًا   ۔", "fanthalaqâ, ḫattâ idzâ laqiyâ ghulâman fa qatalahû qâla a qatalta nafsan zakiyyatam bighairi nafs, laqad ji'ta syai'an nukrâ"], [75, "۞ قَالَ اَلَمْ اَقُلْ لَّكَ اِنَّكَ لَنْ تَسْتَطِيْعَ مَعِيَ صَبْرًا", "qâla a lam aqul laka innaka lan tastathî'a ma'iya shabrâ"], [76, "قَالَ اِنْ سَاَلْتُكَ عَنْ شَيْءٍۢ بَعْدَهَا فَلَا تُصٰحِبْنِيْۚ قَدْ بَلَغْتَ مِنْ لَّدُنِّيْ عُذْرًا", "qâla in sa'altuka 'an syai'im ba'dahâ fa lâ tushâḫibnî, qad balaghta mil ladunnî 'udzrâ"], [77, "فَانْطَلَقَا ۗحَتّٰىٓ اِذَآ اَتَيَآ اَهْلَ قَرْيَةِ ِۨاسْتَطْعَمَآ اَهْلَهَا فَاَبَوْا اَنْ يُّضَيِّفُوْهُمَا فَوَجَدَا فِيْهَا جِدَارًا يُّرِيْدُ اَنْ يَّنْقَضَّ فَاَقَامَهٗ ۗقَالَ لَوْ شِئْتَ لَتَّخَذْتَ عَلَيْهِ اَجْرًا", "fanthalaqâ, ḫattâ idzâ atayâ ahla qaryatinistath'amâ ahlahâ fa abau ay yudlayyifûhumâ fa wajadâ fîhâ jidâray yurîdu ay yangqadldla fa aqâmah, qâla lau syi'ta lattakhadzta 'alaihi ajrâ"], [78, "قَالَ هٰذَا فِرَاقُ بَيْنِيْ وَبَيْنِكَۚ سَاُنَبِّئُكَ بِتَأْوِيْلِ مَا لَمْ تَسْتَطِعْ عَّلَيْهِ صَبْرًا", "qâla hâdzâ firâqu bainî wa bainik, sa'unabbi'uka bita'wîli mâ lam tastathi' 'alaihi shabrâ"], [79, "اَمَّا السَّفِيْنَةُ فَكَانَتْ لِمَسٰكِيْنَ يَعْمَلُوْنَ فِى الْبَحْرِ فَاَرَدْتُّ اَنْ اَعِيْبَهَاۗ وَكَانَ وَرَاۤءَهُمْ مَّلِكٌ يَّأْخُذُ كُلَّ سَفِيْنَةٍ غَصْبًا", "ammas-safînatu fa kânat limasâkîna ya'malûna fil-baḫri fa arattu an a'îbahâ, wa kâna warâ'ahum malikuy ya'khudzu kulla safînatin ghashbâ"], [80, "وَاَمَّا الْغُلٰمُ فَكَانَ اَبَوَاهُ مُؤْمِنَيْنِ فَخَشِيْنَآ اَنْ يُّرْهِقَهُمَا طُغْيَانًا وَّكُفْرًا ۚ", "wa ammal-ghulâmu fa kâna abawâhu mu'minaini fa khasyînâ ay yur-hiqahumâ thughyânaw wa kufrâ"], [81, "فَاَرَدْنَآ اَنْ يُّبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكٰوةً وَّاَقْرَبَ رُحْمًا", "fa aradnâ ay yubdilahumâ rabbuhumâ khairam min-hu zakâtaw wa aqraba ruḫmâ"], [82, "وَاَمَّا الْجِدَارُ فَكَانَ لِغُلٰمَيْنِ يَتِيْمَيْنِ فِى الْمَدِيْنَةِ وَكَانَ تَحْتَهٗ كَنْزٌ لَّهُمَا وَكَانَ اَبُوْهُمَا صَالِحًا ۚفَاَرَادَ رَبُّكَ اَنْ يَّبْلُغَآ اَشُدَّهُمَا وَيَسْتَخْرِجَا كَنْزَهُمَا رَحْمَةً مِّنْ رَّبِّكَۚ وَمَا فَعَلْتُهٗ عَنْ اَمْرِيْۗ ذٰلِكَ تَأْوِيْلُ مَا لَمْ تَسْطِعْ عَّلَيْهِ صَبْرًاۗ  ࣖ", "wa ammal-jidâru fa kâna lighulâmaini yatîmaini fil-madînati wa kâna taḫtahû kanzul lahumâ wa kâna abûhumâ shâliḫâ, fa arâda rabbuka ay yablughâ asyuddahumâ wa yastakhrijâ kanzahumâ raḫmatam mir rabbik, wa mâ fa'altuhû 'an amrî, dzâlika ta'wîlu mâ lam tasthi' 'alaihi shabrâ"], [83, "وَيَسْـَٔلُوْنَكَ عَنْ ذِى الْقَرْنَيْنِۗ قُلْ سَاَتْلُوْا عَلَيْكُمْ مِّنْهُ ذِكْرًا ۗ", "wa yas'alûnaka 'an dzil-qarnaîn, qul sa'atlû 'alaikum min-hu dzikrâ"], [84, "اِنَّا مَكَّنَّا لَهٗ فِى الْاَرْضِ وَاٰتَيْنٰهُ مِنْ كُلِّ شَيْءٍ سَبَبًا ۙ", "innâ makkannâ lahû fil-ardli wa âtainâhu ming kulli syai'in sababâ"], [85, "فَاَتْبَعَ سَبَبًا", "fa atba'a sababâ"], [86, "حَتّٰىٓ اِذَا بَلَغَ مَغْرِبَ الشَّمْسِ وَجَدَهَا تَغْرُبُ فِيْ عَيْنٍ حَمِئَةٍ وَّوَجَدَ عِنْدَهَا قَوْمًا ەۗ قُلْنَا يٰذَا الْقَرْنَيْنِ اِمَّآ اَنْ تُعَذِّبَ وَاِمَّآ اَنْ تَتَّخِذَ فِيْهِمْ حُسْنًا", "ḫattâ idzâ balagha maghribasy-syamsi wajadahâ taghrubu fî 'ainin ḫami'atiw wa wajada 'indahâ qaumâ, qulnâ yâ dzal-qarnaini immâ an tu'adzdziba wa immâ an tattakhidza fîhim ḫusnâ"], [87, "قَالَ اَمَّا مَنْ ظَلَمَ فَسَوْفَ نُعَذِّبُهٗ ثُمَّ يُرَدُّ اِلٰى رَبِّهٖ فَيُعَذِّبُهٗ عَذَابًا نُّكْرًا", "qâla ammâ man dhalama fa saufa nu'adzdzibuhû tsumma yuraddu ilâ rabbihî fa yu'adzdzibuhû 'adzâban nukrâ"], [88, "وَاَمَّا مَنْ اٰمَنَ وَعَمِلَ صَالِحًا فَلَهٗ جَزَاۤءً ۨالْحُسْنٰىۚ وَسَنَقُوْلُ لَهٗ مِنْ اَمْرِنَا يُسْرًا ۗ", "wa ammâ man âmana wa 'amila shâliḫan fa lahû jazâ'anil-ḫusnâ, wa sanaqûlu lahû min amrinâ yusrâ"], [89, "ثُمَّ اَتْبَعَ سَبَبًا", "tsumma atba'a sababâ"], [90, "حَتّٰىٓ اِذَا بَلَغَ مَطْلِعَ الشَّمْسِ وَجَدَهَا تَطْلُعُ عَلٰى قَوْمٍ لَّمْ نَجْعَلْ لَّهُمْ مِّنْ دُوْنِهَا سِتْرًا ۙ", "ḫattâ idzâ balagha mathli'asy-syamsi wajadahâ tathlu'u 'alâ qaumil lam naj'al lahum min dûnihâ sitrâ"], [91, "كَذٰلِكَۗ وَقَدْ اَحَطْنَا بِمَا لَدَيْهِ خُبْرًا", "kadzâlik, wa qad aḫathnâ bimâ ladaihi khubrâ"], [92, "ثُمَّ اَتْبَعَ سَبَبًا", "tsumma atba'a sababâ"], [93, "حَتّٰىٓ اِذَا بَلَغَ بَيْنَ السَّدَّيْنِ وَجَدَ مِنْ دُوْنِهِمَا قَوْمًاۙ  لَّا يَكَادُوْنَ يَفْقَهُوْنَ قَوْلًا", "ḫattâ idzâ balagha bainas-saddaini wajada min dûnihimâ qaumal lâ yakâdûna yafqahûna qaulâ"], [94, "قَالُوْا يٰذَا الْقَرْنَيْنِ اِنَّ يَأْجُوْجَ وَمَأْجُوْجَ مُفْسِدُوْنَ فِى الْاَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلٰٓى اَنْ تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّا", "qâlû yâ dzal-qarnaini inna ya'jûja wa ma'jûja mufsidûna fil-ardli fa hal naj'alu laka kharjan 'alâ an taj'ala bainanâ wa bainahum saddâ"], [95, "قَالَ مَا مَكَّنِّيْ فِيْهِ رَبِّيْ خَيْرٌ فَاَعِيْنُوْنِيْ بِقُوَّةٍ اَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا ۙ", "qâla mâ makkannî fîhi rabbî khairun fa a'înûnî biquwwatin aj'al bainakum wa bainahum radmâ"], [96, "اٰتُوْنِيْ زُبَرَ الْحَدِيْدِۗ حَتّٰىٓ اِذَا سَاوٰى بَيْنَ الصَّدَفَيْنِ قَالَ انْفُخُوْا ۗحَتّٰىٓ اِذَا جَعَلَهٗ نَارًاۙ قَالَ اٰتُوْنِيْٓ اُفْرِغْ عَلَيْهِ قِطْرًا ۗ", "âtûnî zubaral-ḫadîd, ḫattâ idzâ sâwâ bainash-shadafaini qâlanfukhû, ḫattâ idzâ ja'alahû nârang qâla âtûnî ufrigh 'alaihi qithrâ"], [97, "فَمَا اسْطَاعُوْٓا اَنْ يَّظْهَرُوْهُ وَمَا اسْتَطَاعُوْا لَهٗ نَقْبًا", "fa masthâ'û ay yadh-harûhu wa mastathâ'û lahû naqbâ"], [98, "قَالَ هٰذَا رَحْمَةٌ مِّنْ رَّبِّيْۚ فَاِذَا جَاۤءَ وَعْدُ رَبِّيْ جَعَلَهٗ دَكَّاۤءَۚ وَكَانَ وَعْدُ رَبِّيْ حَقًّا ۗ", "qâla hâdzâ raḫmatum mir rabbî, fa idzâ jâ'a wa'du rabbî ja'alahû dakkâ', wa kâna wa'du rabbî ḫaqqâ"], [99, "۞ وَتَرَكْنَا بَعْضَهُمْ يَوْمَىِٕذٍ يَّمُوْجُ فِيْ بَعْضٍ وَّنُفِخَ فِى الصُّوْرِ فَجَمَعْنٰهُمْ جَمْعًا ۙ", "wa taraknâ ba'dlahum yauma'idziy yamûju fî ba'dliw wa nufikha fish-shûri fa jama'nâhum jam'â"], [100, "وَّعَرَضْنَا جَهَنَّمَ يَوْمَىِٕذٍ لِّلْكٰفِرِيْنَ عَرْضًا ۙ", "wa 'aradlnâ jahannama yauma'idzil lil-kâfirîna 'ardlâ"], [101, "ۨالَّذِيْنَ كَانَتْ اَعْيُنُهُمْ فِيْ غِطَاۤءٍ عَنْ ذِكْرِيْ وَكَانُوْا لَا يَسْتَطِيْعُوْنَ سَمْعًا ࣖ", "alladzîna kânat a'yunuhum fî ghithâ'in 'an dzikrî wa kânû lâ yastathî'ûna sam'â"], [102, "اَفَحَسِبَ الَّذِيْنَ كَفَرُوْٓا اَنْ يَّتَّخِذُوْا عِبَادِيْ مِنْ دُوْنِيْٓ اَوْلِيَاۤءَ ۗاِنَّآ اَعْتَدْنَا جَهَنَّمَ لِلْكٰفِرِيْنَ نُزُلًا", "a fa ḫasiballadzîna kafarû ay yattakhidzû 'ibâdî min dûnî auliyâ', innâ a'tadnâ jahannama lil-kâfirîna nuzulâ"], [103, "قُلْ هَلْ نُنَبِّئُكُمْ بِالْاَخْسَرِيْنَ اَعْمَالًا ۗ", "qul hal nunabbi'ukum bil-akhsarîna a'mâlâ"], [104, "اَلَّذِيْنَ ضَلَّ سَعْيُهُمْ فِى الْحَيٰوةِ الدُّنْيَا وَهُمْ يَحْسَبُوْنَ اَنَّهُمْ يُحْسِنُوْنَ صُنْعًا", "alladzîna dlalla sa'yuhum fil-ḫayâtid-dun-yâ wa hum yaḫsabûna annahum yuḫsinûna shun'â"], [105, "اُولٰۤىِٕكَ الَّذِيْنَ كَفَرُوْا بِاٰيٰتِ رَبِّهِمْ وَلِقَاۤىِٕهٖ فَحَبِطَتْ اَعْمَالُهُمْ فَلَا نُقِيْمُ لَهُمْ يَوْمَ الْقِيٰمَةِ وَزْنًا", "ulâ'ikalladzîna kafarû bi'âyâti rabbihim wa liqâ'ihî fa ḫabithat a'mâluhum fa lâ nuqîmu lahum yaumal-qiyâmati waznâ"], [106, "ذٰلِكَ جَزَاۤؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوْا وَاتَّخَذُوْٓا اٰيٰتِيْ وَرُسُلِيْ هُزُوًا", "dzâlika jazâ'uhum jahannamu bimâ kafarû wattakhadzû âyâtî wa rusulî huzuwâ"], [107, "اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ كَانَتْ لَهُمْ جَنّٰتُ الْفِرْدَوْسِ نُزُلًا ۙ", "innalladzîna âmanû wa 'amilush-shâliḫâti kânat lahum jannâtul-firdausi nuzulâ"], [108, "خٰلِدِيْنَ فِيْهَا لَا يَبْغُوْنَ عَنْهَا حِوَلًا", "khâlidîna fîhâ lâ yabghûna 'an-hâ ḫiwalâ"], [109, "قُلْ لَّوْ كَانَ الْبَحْرُ مِدَادًا لِّكَلِمٰتِ رَبِّيْ لَنَفِدَ الْبَحْرُ قَبْلَ اَنْ تَنْفَدَ كَلِمٰتُ رَبِّيْ وَلَوْ جِئْنَا بِمِثْلِهٖ مَدَدًا", "qul lau kânal-baḫru midâdal likalimâti rabbî lanafidal-baḫru qabla an tanfada kalimâtu rabbî walau ji'nâ bimitslihî madadâ"], [110, "قُلْ اِنَّمَآ اَنَا۠ بَشَرٌ مِّثْلُكُمْ يُوْحٰٓى اِلَيَّ اَنَّمَآ اِلٰهُكُمْ اِلٰهٌ وَّاحِدٌۚ فَمَنْ كَانَ يَرْجُوْا لِقَاۤءَ رَبِّهٖ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَّلَا يُشْرِكْ بِعِبَادَةِ رَبِّهٖٓ اَحَدًا ࣖ", "qul innamâ ana basyarum mitslukum yûḫâ ilayya annamâ ilâhukum ilâhuw wâḫid, fa mang kâna yarjû liqâ'a rabbihî falya'mal 'amalan shâliḫaw wa lâ yusyrik bi'ibâdati rabbihî aḫadâ"]]}]}, {"id": "baqarah", "name": "Al-Baqarah", "ar": "البقرة", "no": 2, "info": "Ayat 1–5, 125, 201, 255, 284–286", "parts": [{"title": "Ayat 1–5", "v": [[1, "الۤمّۤ ۚ", "alif lâm mîm"], [2, "ذٰلِكَ الْكِتٰبُ لَا رَيْبَ ۛ فِيْهِ ۛ هُدًى لِّلْمُتَّقِيْنَۙ", "dzâlikal-kitâbu lâ raiba fîh, hudal lil-muttaqîn"], [3, "الَّذِيْنَ يُؤْمِنُوْنَ بِالْغَيْبِ وَيُقِيْمُوْنَ الصَّلٰوةَ وَمِمَّا رَزَقْنٰهُمْ يُنْفِقُوْنَ ۙ", "alladzîna yu'minûna bil-ghaibi wa yuqîmûnash-shalâta wa mimmâ razaqnâhum yunfiqûn"], [4, "وَالَّذِيْنَ يُؤْمِنُوْنَ بِمَآ اُنْزِلَ اِلَيْكَ وَمَآ اُنْزِلَ مِنْ قَبْلِكَ ۚ وَبِالْاٰخِرَةِ هُمْ يُوْقِنُوْنَۗ", "wa // today's list: Al-Mulk + Yasin daily, Al-Kahfi on Friday
// daily list uses the short Al-Kahfi set; on Jumaat it is swapped for the full Al-Kahfi set
const todayList = SURAHS.map(s => s.id).filter(id =>
  JO ? (id !== "kahfi" || isFriday) : (isFriday ? id !== "kahfi" : id !== "kahfifull"));

const MODE_LABEL = { both: "Arab+Latin", latin: "Latin sahaja", arab: "Arab sahaja" };
const MODE_NEXT  = { both: "latin", latin: "arab", arab: "both" };
const arDigits = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const $ = id => document.getElementById(id);

function applySettings(){
  document.documentElement.style.setProperty("--ar", arSize + "px");
  document.documentElement.style.setProperty("--la", laSize + "px");
  document.body.classList.remove("m-both", "m-latin", "m-arab");
  document.body.classList.add("m-" + mode);
  $("modeBtn").textContent = MODE_LABEL[mode];
}

function renderTabs(){
  $("tabs").style.gridTemplateColumns = "repeat(" + Math.min(4, SURAHS.length) + ",1fr)";
  $("tabs").innerHTML = SURAHS.map(s => {
    const tick = isDone(s.id) ? ' <span class="tick">✓</span>' : "";
    const sub = (s.jumaat || (JO && s.id === "kahfi")) ? "<span>Jumaat</span>" : "";
    return `<button class="tab ${s.id===current?"on":""}" data-id="${s.id}">${s.name}${tick}${sub}</button>`;
  }).join("");
}

function renderToday(){
  const names = todayList.map(id => {
    const s = SURAHS.find(x => x.id === id);
    return (isDone(id) ? "✓ " : "") + "<b>" + s.name + "</b>";
  }).join(" · ");
  $("today").innerHTML = (malamJumaat ? "Malam Jumaat – baca: " : isFriday ? "Hari ini Jumaat – baca: " : "Bacaan hari ini: ") + names +
    (isFriday ? "<br>Al-Kahfi: " + (JO ? "ayat 1–10 dan 100–110." : "baca <b>penuh</b> (110 ayat).") + (malamJumaat ? "" : " Sebelum Maghrib (± " + magText + ").")
      : "<br>" + (JO ? "Al-Kahfi: hari Jumaat sahaja." : "Al-Kahfi: ayat 1–10 dan 100–110.") +
        (now.getDay() === 4 ? (JO ? " Bermula" : " Baca penuh bermula") + " selepas Maghrib (± " + magText + ")." : "")) +
    '<div class="place">Lokasi: <select id="place">' +
    Object.keys(PLACES).map(k => `<option value="${k}" ${k===placeId?"selected":""}>${PLACES[k].name}</option>`).join("") +
    '</select> · Maghrib ± ' + magText + '</div>';
  $("place").addEventListener("change", e => { store.set("q_place", e.target.value); location.reload(); });
}

function renderSurah(){
  const s = SURAHS.find(x => x.id === current) || SURAHS[0];
  const parts = s.parts, info = s.info;
  let h = s.heading
    ? `<div class="title"><div class="a" style="font-family:inherit;font-size:24px;direction:ltr">${s.heading}</div><div class="n">${info}</div></div>`
    : `<div class="title"><div class="a">سورة ${s.ar}</div><div class="n">${s.name} · Surah ${s.no} · ${info}</div></div>`;
  if (!s.nobism) h += `<div class="bism"><div class="ba">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div class="bl">bismillâhir-raḫmânir-raḫîm</div></div>`;
  parts.forEach((p, pi) => {
    if (p.title) h += `<div class="part">${p.title}</div>`;
    p.v.forEach(v => {
      h += `<div class="ayah" id="a${pi}_${v[0]}" data-n="${pi}_${v[0]}">
        <div class="ar">${v[1]} <span class="num">${arDigits(v[0])}</span></div>
        <div class="la"><span class="n">${v[0]}.</span>${v[2]}</div></div>`;
    });
  });
  const d = isDone(s.id);
  h += `<button class="done ${d?"is":""}" id="doneBtn">${d ? "✓ Sudah dibaca hari ini" : "Tanda sudah baca " + s.name}</button>`;
  $("view").innerHTML = h;

  // tap an ayah to bookmark it (gold outline) – reopens at that ayah next time
  const mark = lastPos[s.id];
  if (mark && $("a" + mark)) $("a" + mark).classList.add("mark");
  document.querySelectorAll(".ayah").forEach(el => el.addEventListener("click", () => {
    document.querySelectorAll(".ayah.mark").forEach(m => m.classList.remove("mark"));
    if (lastPos[s.id] == el.dataset.n) { delete lastPos[s.id]; }
    else { lastPos[s.id] = el.dataset.n; el.classList.add("mark"); }
    store.set("q_pos", lastPos);
  }));
  $("doneBtn").addEventListener("click", () => {
    setDone(s.id, !isDone(s.id));
    if (isDone(s.id)) { delete lastPos[s.id]; store.set("q_pos", lastPos); }
    store.set("q_done", doneMap);
    renderAll(false);
  });
}

function renderAll(scroll){
  renderTabs(); renderToday(); renderSurah();
  if (scroll) {
    const m = lastPos[current];
    if (m && $("a" + m)) $("a" + m).scrollIntoView({block:"center"});
    else window.scrollTo(0, 0);
  }
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.id; store.set("q_surah", current); renderAll(true);
});
$("plus").addEventListener("click", () => { arSize = Math.min(64, arSize + 4); store.set("q_ar", arSize); applySettings(); });
$("minus").addEventListener("click", () => { arSize = Math.max(24, arSize - 4); store.set("q_ar", arSize); applySettings(); });
$("laPlus").addEventListener("click", () => { laSize = Math.min(56, laSize + 3); store.set("q_la2", laSize); applySettings(); });
$("laMinus").addEventListener("click", () => { laSize = Math.max(16, laSize - 3); store.set("q_la2", laSize); applySettings(); });
$("modeBtn").addEventListener("click", () => { mode = MODE_NEXT[mode]; store.set("q_mode", mode); applySettings(); });

$("who").textContent = PROFILE.name + " ▾";
$("pickList").innerHTML = Object.keys(PROFILES).map(k =>
  `<a class="pbtn" href="#${k}"${PROFILES[k].box ? ` style="background:${PROFILES[k].box}"` : ""}><b>${PROFILES[k].name}</b><span>${PROFILES[k].desc}</span></a>`).join("");
$("date").textContent = HARI[now.getDay()] + ", " + now.getDate() + " " + BULAN[now.getMonth()] + " " + now.getFullYear();
store.set("q_done", doneMap);
applySettings();
renderAll(true);
</script>
</body>
</html>
