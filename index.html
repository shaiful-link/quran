صٰرٰى ۗ تِلْكَ اَمَانِيُّهُمْ ۗ قُلْ هَاتُوْا بُرْهَانَكُمْ اِنْ كُنْتُمْ صٰدِقِيْنَ", "wa qâlû lay yadkhulal-jannata illâ mang kâna hûdan au nashârâ, tilka amâniyyuhum, qul hâtû bur-hânakum ing kuntum shâdiqîn"], [112, "بَلٰى مَنْ اَسْلَمَ وَجْهَهٗ لِلّٰهِ وَهُوَ مُحْسِنٌ فَلَهٗٓ اَجْرُهٗ عِنْدَ رَبِّهٖۖ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُوْنَ ࣖ", "balâ man aslama waj-hahû lillâhi wa huwa muḫsinun fa lahû ajruhû 'inda rabbihî wa lâ khaufun 'alaihim wa lâ hum yaḫzanûn"], [113, "وَقَالَتِ الْيَهُوْدُ لَيْسَتِ النَّصٰرٰى عَلٰى شَيْءٍۖ وَّقَالَتِ النَّصٰرٰى لَيْسَتِ الْيَهُوْدُ عَلٰى شَيْءٍۙ وَّهُمْ يَتْلُوْنَ الْكِتٰبَۗ  كَذٰلِكَ قَالَ الَّذِيْنَ لَا يَعْلَمُوْنَ مِثْلَ قَوْلِهِمْ ۚ فَاللّٰهُ يَحْكُمُ بَيْنَهُمْ يَوْمَ الْقِيٰمَةِ فِيْمَا كَانُوْا فِيْهِ يَخْتَلِفُوْنَ", "wa qâlatil-yahûdu laisatin-nashârâ 'alâ syai'iw wa qâlatin-nashârâ laisatil-yahûdu 'alâ syai'iw wa hum yatlûnal-kitâb, kadzâlika qâlalladzîna lâ ya'lamûna mitsla qaulihim, fallâhu yaḫkumu bainahum yaumal-qiyâmati fîmâ kânû fîhi yakhtalifûn"], [114, "وَمَنْ اَظْلَمُ مِمَّنْ مَّنَعَ مَسٰجِدَ اللّٰهِ اَنْ يُّذْكَرَ فِيْهَا اسْمُهٗ وَسَعٰى فِيْ خَرَابِهَاۗ اُولٰۤىِٕكَ مَا كَانَ لَهُمْ اَنْ يَّدْخُلُوْهَآ اِلَّا خَاۤىِٕفِيْنَ ەۗ لَهُمْ فِى الدُّنْيَا خِزْيٌ وَّلَهُمْ فِى الْاٰخِرَةِ عَذَابٌ عَظِيْمٌ", "wa man adhlamu mim mam mana'a masâjidallâhi ay yudzkara fîhasmuhû wa sa'â fî kharâbihâ, ulâ'ika mâ kâna lahum ay yadkhulûhâ illâ khâ'ifîn, lahum fid-dun-yâ khizyuw wa lahum fil-âkhirati 'adzâbun 'adhîm"], [115, "وَلِلّٰهِ الْمَشْرِقُ وَالْمَغْرِبُ  فَاَيْنَمَا تُوَلُّوْا فَثَمَّ وَجْهُ اللّٰهِ ۗ اِنَّ اللّٰهَ وَاسِعٌ عَلِيْمٌ", "wa lillâhil-masyriqu wal-maghribu fa ainamâ tuwallû fa tsamma waj-hullâh, innallâha wâsi'un 'alîm"], [116, "وَقَالُوا اتَّخَذَ اللّٰهُ وَلَدًا ۙسُبْحٰنَهٗ ۗ بَلْ لَّهٗ مَا فِى السَّمٰوٰتِ وَالْاَرْضِۗ  كُلٌّ لَّهٗ قَانِتُوْنَ", "wa qâluttakhadzallâhu waladan sub-ḫânah, bal lahû mâ fis-samâwâti wal-ardl, kullul lahû qânitûn"], [117, "بَدِيْعُ السَّمٰوٰتِ وَالْاَرْضِۗ وَاِذَا قَضٰٓى اَمْرًا فَاِنَّمَا يَقُوْلُ لَهٗ كُنْ فَيَكُوْنُ", "badî'us-samâwâti wal-ardl, wa idzâ qadlâ amran fa innamâ yaqûlu lahû kun fa yakûn"], [118, "وَقَالَ الَّذِيْنَ لَا يَعْلَمُوْنَ لَوْلَا يُكَلِّمُنَا اللّٰهُ اَوْ تَأْتِيْنَآ اٰيَةٌ  ۗ كَذٰلِكَ قَالَ الَّذِيْنَ مِنْ قَبْلِهِمْ مِّثْلَ قَوْلِهِمْ ۗ تَشَابَهَتْ قُلُوْبُهُمْ ۗ قَدْ بَيَّنَّا الْاٰيٰتِ لِقَوْمٍ يُّوْقِنُوْنَ", "wa qâlalladzîna lâ ya'lamûna lau lâ yukallimunallâhu au ta'tînâ âyah, kadzâlika qâlalladzîna ming qablihim mitsla qaulihim, tasyâbahat qulûbuhum, qad bayyannal-âyâti liqaumiy yûqinûn"], [119, "اِنَّآ اَرْسَلْنٰكَ بِالْحَقِّ بَشِيْرًا وَّنَذِيْرًاۙ وَّلَا تُسْـَٔلُ عَنْ اَصْحٰبِ الْجَحِيْمِ", "innâ arsalnâka bil-ḫaqqi basyîraw wa nadzîraw wa lâ tus'alu 'an ash-ḫâbil-jaḫîm"], [120, "وَلَنْ تَرْضٰى عَنْكَ الْيَهُوْدُ وَلَا النَّصٰرٰى حَتّٰى تَتَّبِعَ مِلَّتَهُمْ ۗ قُلْ اِنَّ هُدَى اللّٰهِ هُوَ الْهُدٰى ۗ وَلَىِٕنِ اتَّبَعْتَ اَهْوَاۤءَهُمْ بَعْدَ الَّذِيْ جَاۤءَكَ مِنَ الْعِلْمِ ۙ مَا لَكَ مِنَ اللّٰهِ مِنْ وَّلِيٍّ وَّلَا نَصِيْرٍ", "wa lan tardlâ 'angkal-yahûdu wa lan-nashârâ ḫattâ tattabi'a millatahum, qul inna hudallâhi huwal-hudâ, wa la'inittaba'ta ahwâ'ahum ba'dalladzî jâ'aka minal-'ilmi mâ laka minallâhi miw waliyyiw wa lâ nashîr"], [121, "اَلَّذِيْنَ اٰتَيْنٰهُمُ الْكِتٰبَ يَتْلُوْنَهٗ حَقَّ تِلَاوَتِهٖۗ اُولٰۤىِٕكَ يُؤْمِنُوْنَ بِهٖ ۗ وَمَنْ يَّكْفُرْ بِهٖ فَاُولٰۤىِٕكَ هُمُ الْخٰسِرُوْنَ ࣖ", "alladzîna âtainâhumul-kitâba yatlûnahû ḫaqqa tilâwatih, ulâ'ika yu'minûna bih, wa may yakfur bihî fa ulâ'ika humul-khâsirûn"], [122, "يٰبَنِيْٓ اِسْرَاۤءِيْلَ اذْكُرُوْا نِعْمَتِيَ الَّتِيْٓ اَنْعَمْتُ عَلَيْكُمْ وَاَنِّيْ فَضَّلْتُكُمْ عَلَى الْعٰلَمِيْنَ", "yâ banî isrâ'îladzkurû ni'matiyallatî an'amtu 'alaikum wa annî fadldlaltukum 'alal-'âlamîn"], [123, "وَاتَّقُوْا يَوْمًا لَّا تَجْزِيْ نَفْسٌ عَنْ نَّفْسٍ شَيْـًٔا وَّلَا يُقْبَلُ مِنْهَا عَدْلٌ وَّلَا تَنْفَعُهَا شَفَاعَةٌ وَّلَا هُمْ يُنْصَرُوْنَ", "wattaqû yaumal lâ tajzî nafsun 'an nafsin syai'aw wa lâ yuqbalu min-hâ 'adluw wa lâ tanfa'uhâ syafâ'atuw wa lâ hum yunsharûn"], [124, "۞ وَاِذِ ابْتَلٰٓى اِبْرٰهٖمَ رَبُّهٗ بِكَلِمٰتٍ فَاَتَمَّهُنَّ ۗ قَالَ اِنِّيْ جَاعِلُكَ لِلنَّاسِ اِمَامًا ۗ قَالَ وَمِنْ ذُرِّيَّتِيْ ۗ قَالَ لَا يَنَالُ عَهْدِى الظّٰلِمِيْنَ", "wa idzibtalâ ibrâhîma rabbuhû bikalimâtin fa atammahunn, qâla innî jâ'iluka lin-nâsi imâmâ, qâla wa min dzurriyyatî, qâla lâ yanâlu 'ahdidh-dhâlimîn"], [125, "وَاِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِّلنَّاسِ وَاَمْنًاۗ وَاتَّخِذُوْا مِنْ مَّقَامِ اِبْرٰهٖمَ مُصَلًّىۗ  وَعَهِدْنَآ اِلٰٓى اِبْرٰهٖمَ وَاِسْمٰعِيْلَ اَنْ طَهِّرَا بَيْتِيَ لِلطَّاۤىِٕفِيْنَ وَالْعٰكِفِيْنَ وَالرُّكَّعِ السُّجُوْدِ", "wa idz ja'alnal-baita matsâbatal lin-nâsi wa amnâ, wattakhidzû mim maqâmi ibrâhîma mushallâ, wa 'ahidnâ ilâ ibrâhîma wa ismâ'îla an thahhirâ baitiya lith-thâ'ifîna wal-'âkifîna war-rukka'is-sujûd"], [126, "وَاِذْ قَالَ اِبْرٰهٖمُ رَبِّ اجْعَلْ هٰذَا بَلَدًا اٰمِنًا وَّارْزُقْ اَهْلَهٗ مِنَ الثَّمَرٰتِ مَنْ اٰمَنَ مِنْهُمْ بِاللّٰهِ وَالْيَوْمِ الْاٰخِرِۗ قَالَ وَمَنْ كَفَرَ فَاُمَتِّعُهٗ قَلِيْلًا ثُمَّ اَضْطَرُّهٗٓ اِلٰى عَذَابِ النَّارِ ۗ وَبِئْسَ الْمَصِيْرُ", "wa idz qâla ibrâhîmu rabbij'al hâdzâ baladan âminaw warzuq ahlahû minats-tsamarâti man âmana min-hum billâhi wal-yaumil-âkhir, qâla wa mang kafara fa umatti'uhû qalîlan tsumma adltharruhû ilâ 'adzâbin-nâr, wa bi'sal-mashîr"], [127, "وَاِذْ يَرْفَعُ اِبْرٰهٖمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَاِسْمٰعِيْلُۗ رَبَّنَا تَقَبَّلْ مِنَّا ۗ اِنَّكَ اَنْتَ السَّمِيْعُ الْعَلِيْمُ", "wa idz yarfa'u ibrâhîmul-qawâ'ida minal-baiti wa ismâ'îl, rabbanâ taqabbal minnâ, innaka antas-samî'ul-'alîm"], [128, "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَآ اُمَّةً مُّسْلِمَةً لَّكَۖ وَاَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۚ اِنَّكَ اَنْتَ التَّوَّابُ الرَّحِيْمُ", "rabbanâ waj'alnâ muslimaini laka wa min dzurriyyatinâ ummatam muslimatal laka wa arinâ manâsikanâ wa tub 'alainâ, innaka antat-tawwâbur-raḫîm"], [129, "رَبَّنَا وَابْعَثْ فِيْهِمْ رَسُوْلًا مِّنْهُمْ يَتْلُوْا عَلَيْهِمْ اٰيٰتِكَ وَيُعَلِّمُهُمُ الْكِتٰبَ وَالْحِكْمَةَ وَيُزَكِّيْهِمْ ۗ اِنَّكَ اَنْتَ الْعَزِيْزُ الْحَكِيْمُ ࣖ", "rabbanâ wab'ats fîhim rasûlam min-hum yatlû 'alaihim âyâtika wa yu'allimuhumul-kitâba wal-ḫikmata wa yuzakkîhim, innaka antal-'azîzul-ḫakîm"], [130, "وَمَنْ يَّرْغَبُ عَنْ مِّلَّةِ اِبْرٰهٖمَ اِلَّا مَنْ سَفِهَ نَفْسَهٗ ۗوَلَقَدِ اصْطَفَيْنٰهُ فِى الدُّنْيَا ۚوَاِنَّهٗ فِى الْاٰخِرَةِ لَمِنَ الصّٰلِحِيْنَ", "wa may yarghabu 'am millati ibrâhîma illâ man safiha nafsah, wa laqadishthafainâhu fid-dun-yâ, wa innahû fil-âkhirati laminash-shâliḫîn"], [131, "اِذْ قَالَ لَهٗ رَبُّهٗٓ اَسْلِمْۙ  قَالَ اَسْلَمْتُ لِرَبِّ الْعٰلَمِيْنَ", "idz qâla lahû rabbuhû aslim qâla aslamtu lirabbil-'âlamîn"], [132, "وَوَصّٰى بِهَآ اِبْرٰهٖمُ بَنِيْهِ وَيَعْقُوْبُۗ يٰبَنِيَّ اِنَّ اللّٰهَ اصْطَفٰى لَكُمُ الدِّيْنَ فَلَا تَمُوْتُنَّ اِلَّا وَاَنْتُمْ مُّسْلِمُوْنَ ۗ", "wa washshâ bihâ ibrâhîmu banîhi wa ya'qûb, yâ baniyya innallâhashthafâ lakumud-dîna fa lâ tamûtunna illâ wa antum muslimûn"], [133, "اَمْ كُنْتُمْ شُهَدَاۤءَ اِذْ حَضَرَ يَعْقُوْبَ الْمَوْتُۙ اِذْ قَالَ لِبَنِيْهِ مَا تَعْبُدُوْنَ مِنْۢ بَعْدِيْۗ قَالُوْا نَعْبُدُ اِلٰهَكَ وَاِلٰهَ اٰبَاۤىِٕكَ اِبْرٰهٖمَ وَاِسْمٰعِيْلَ وَاِسْحٰقَ اِلٰهًا وَّاحِدًاۚ وَنَحْنُ لَهٗ مُسْلِمُوْنَ", "am kuntum syuhadâ'a idz ḫadlara ya'qûbal-mautu idz qâla libanîhi mâ ta'budûna mim ba'dî, qâlû na'budu ilâhaka wa ilâha âbâ'ika ibrâhîma wa ismâ'îla wa is-ḫâqa ilâhaw wâḫidâ, wa naḫnu lahû muslimûn"], [134, "تِلْكَ اُمَّةٌ قَدْ خَلَتْ ۚ لَهَا مَا كَسَبَتْ وَلَكُمْ مَّا كَسَبْتُمْ ۚ وَلَا تُسْـَٔلُوْنَ عَمَّا كَانُوْا يَعْمَلُوْنَ", "tilka ummatung qad khalat, lahâ mâ kasabat wa lakum mâ kasabtum, wa lâ tus'alûna 'ammâ kânû ya'malûn"], [135, "وَقَالُوْا كُوْنُوْا هُوْدًا اَوْ نَصٰرٰى تَهْتَدُوْا ۗ قُلْ بَلْ مِلَّةَ اِبْرٰهٖمَ حَنِيْفًا ۗوَمَا كَانَ مِنَ الْمُشْرِكِيْنَ", "wa qâlû kûnû hûdan au nashârâ tahtadû, qul bal millata ibrâhîma ḫanîfâ, wa mâ kâna minal-musyrikîn"], [136, "قُوْلُوْٓا اٰمَنَّا بِاللّٰهِ وَمَآ اُنْزِلَ اِلَيْنَا وَمَآ اُنْزِلَ اِلٰٓى اِبْرٰهٖمَ وَاِسْمٰعِيْلَ وَاِسْحٰقَ وَيَعْقُوْبَ وَالْاَسْبَاطِ وَمَآ اُوْتِيَ مُوْسٰى وَعِيْسٰى وَمَآ اُوْتِيَ النَّبِيُّوْنَ مِنْ رَّبِّهِمْۚ  لَا نُفَرِّقُ بَيْنَ اَحَدٍ مِّنْهُمْۖ وَنَحْنُ لَهٗ مُسْلِمُوْنَ", "qûlû âmannâ billâhi wa mâ unzila ilainâ wa mâ unzila ilâ ibrâhîma wa ismâ'îla wa is-ḫâqa wa ya'qûba wal-asbâthi wa mâ ûtiya mûsâ wa 'îsâ wa mâ ûtiyan-nabiyyûna mir rabbihim, lâ nufarriqu baina aḫadim min-hum wa naḫnu lahû muslimûn"], [137, "فَاِنْ اٰمَنُوْا بِمِثْلِ مَآ اٰمَنْتُمْ بِهٖ فَقَدِ اهْتَدَوْا ۚوَاِنْ تَوَلَّوْا فَاِنَّمَا هُمْ فِيْ شِقَاقٍۚ فَسَيَكْفِيْكَهُمُ اللّٰهُ ۚوَهُوَ السَّمِيْعُ الْعَلِيْمُ ۗ", "fa in âmanû bimitsli mâ âmantum bihî fa qadihtadau, wa in tawallau fa innamâ hum fî syiqâq, fa sayakfîkahumullâh, wa huwas-samî'ul-'alîm"], [138, "صِبْغَةَ اللّٰهِ ۚ وَمَنْ اَحْسَنُ مِنَ اللّٰهِ صِبْغَةً ۖ وَّنَحْنُ لَهٗ عٰبِدُوْنَ", "shibghatallâh, wa man aḫsanu minallâhi shibghataw wa naḫnu lahû 'âbidûn"], [139, "قُلْ اَتُحَاۤجُّوْنَنَا فِى اللّٰهِ وَهُوَ رَبُّنَا وَرَبُّكُمْۚ وَلَنَآ اَعْمَالُنَا وَلَكُمْ اَعْمَالُكُمْۚ وَنَحْنُ لَهٗ مُخْلِصُوْنَ ۙ", "qul a tuḫâjjûnanâ fillâhi wa huwa rabbunâ wa rabbukum, wa lanâ a'mâlunâ wa lakum a'mâlukum, wa naḫnu lahû mukhlishûn"], [140, "اَمْ تَقُوْلُوْنَ اِنَّ اِبْرٰهٖمَ وَاِسْمٰعِيْلَ وَاِسْحٰقَ وَيَعْقُوْبَ وَالْاَسْبَاطَ كَانُوْا هُوْدًا اَوْ نَصٰرٰى ۗ قُلْ ءَاَنْتُمْ اَعْلَمُ اَمِ اللّٰهُ ۗ وَمَنْ اَظْلَمُ مِمَّنْ كَتَمَ شَهَادَةً عِنْدَهٗ مِنَ اللّٰهِ ۗ وَمَا اللّٰهُ بِغَافِلٍ عَمَّا تَعْمَلُوْنَ", "am taqûlûna inna ibrâhîma wa ismâ'îla wa is-ḫâqa wa ya'qûba wal-asbâtha kânû hûdan au nashârâ, qul a antum a'lamu amillâh, wa man adhlamu mim mang katama syahâdatan 'indahû minallâh, wa mallâhu bighâfilin 'ammâ ta'malûn"], [141, "تِلْكَ اُمَّةٌ قَدْ خَلَتْ ۚ لَهَا مَا كَسَبَتْ وَلَكُمْ مَّا كَسَبْتُمْ ۚ وَلَا تُسْـَٔلُوْنَ عَمَّا كَانُوْا يَعْمَلُوْنَ ࣖ   ۔", "tilka ummatung qad khalat, lahâ mâ kasabat wa lakum mâ kasabtum, wa lâ tus'alûna 'ammâ kânû ya'malûn"], [142, "۞ سَيَقُوْلُ السُّفَهَاۤءُ مِنَ النَّاسِ مَا وَلّٰىهُمْ عَنْ قِبْلَتِهِمُ الَّتِيْ كَانُوْا عَلَيْهَا ۗ قُلْ لِّلّٰهِ الْمَشْرِقُ وَالْمَغْرِبُۗ يَهْدِيْ مَنْ يَّشَاۤءُ اِلٰى صِرَاطٍ مُّسْتَقِيْمٍ", "sayaqûlus-sufahâ'u minan-nâsi mâ wallâhum 'ang qiblatihimullatî kânû 'alaihâ, qul lillâhil-masyriqu wal-maghrib, yahdî may yasyâ'u ilâ shirâthim mustaqîm"], [143, "وَكَذٰلِكَ جَعَلْنٰكُمْ اُمَّةً وَّسَطًا لِّتَكُوْنُوْا شُهَدَاۤءَ عَلَى النَّاسِ وَيَكُوْنَ الرَّسُوْلُ عَلَيْكُمْ شَهِيْدًا ۗ وَمَا جَعَلْنَا الْقِبْلَةَ الَّتِيْ كُنْتَ عَلَيْهَآ اِلَّا لِنَعْلَمَ مَنْ يَّتَّبِعُ الرَّسُوْلَ مِمَّنْ يَّنْقَلِبُ عَلٰى عَقِبَيْهِۗ  وَاِنْ كَانَتْ لَكَبِيْرَةً اِلَّا عَلَى الَّذِيْنَ هَدَى اللّٰهُ  ۗوَمَا كَانَ اللّٰهُ لِيُضِيْعَ اِيْمَانَكُمْ ۗ اِنَّ اللّٰهَ بِالنَّاسِ لَرَءُوْفٌ رَّحِيْمٌ", "wa kadzâlika ja'alnâkum ummataw wasathal litakûnû syuhadâ'a 'alan-nâsi wa yakûnar-rasûlu 'alaikum syahîdâ, wa mâ ja'alnal-qiblatallatî kunta 'alaihâ illâ lina'lama may yattabi'ur-rasûla mim may yangqalibu 'alâ 'aqibaîh, wa ing kânat lakabîratan illâ 'alalladzîna hadallâh, wa mâ kânallâhu liyudlî'a îmânakum, innallâha bin-nâsi lara'ûfur raḫîm"], [144, "قَدْ نَرٰى تَقَلُّبَ وَجْهِكَ فِى السَّمَاۤءِۚ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضٰىهَا ۖ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۗ وَحَيْثُ مَا كُنْتُمْ فَوَلُّوْا وُجُوْهَكُمْ شَطْرَهٗ ۗ وَاِنَّ الَّذِيْنَ اُوْتُوا الْكِتٰبَ لَيَعْلَمُوْنَ اَنَّهُ الْحَقُّ مِنْ رَّبِّهِمْ ۗ وَمَا اللّٰهُ بِغَافِلٍ عَمَّا يَعْمَلُوْنَ", "qad narâ taqalluba waj-hika fis-samâ', fa lanuwalliyannaka qiblatan tardlâhâ fa walli waj-haka syathral-masjidil-ḫarâm, wa ḫaitsu mâ kuntum fa wallû wujûhakum syathrah, wa innalladzîna ûtul-kitâba laya'lamûna annahul-ḫaqqu mir rabbihim, wa mallâhu bighâfilin 'ammâ ya'malûn"], [145, "وَلَىِٕنْ اَتَيْتَ الَّذِيْنَ اُوْتُوا الْكِتٰبَ بِكُلِّ اٰيَةٍ مَّا تَبِعُوْا قِبْلَتَكَ ۚ وَمَآ اَنْتَ بِتَابِعٍ قِبْلَتَهُمْ ۚ وَمَا بَعْضُهُمْ بِتَابِعٍ قِبْلَةَ بَعْضٍۗ وَلَىِٕنِ اتَّبَعْتَ اَهْوَاۤءَهُمْ مِّنْۢ بَعْدِ مَاجَاۤءَكَ مِنَ الْعِلْمِ ۙ اِنَّكَ اِذًا لَّمِنَ الظّٰلِمِيْنَ ۘ", "wa la'in ataitalladzîna ûtul-kitâba bikulli âyatim mâ tabi'û qiblatak, wa mâ anta bitâbi'ing qiblatahum, wa mâ ba'dluhum bitâbi'ing qiblata ba'dl, wa la'inittaba'ta ahwâ'ahum mim ba'di mâ jâ'aka minal-'ilmi innaka idzal laminadh-dhâlimîn"], [146, "اَلَّذِيْنَ اٰتَيْنٰهُمُ الْكِتٰبَ يَعْرِفُوْنَهٗ كَمَا يَعْرِفُوْنَ اَبْنَاۤءَهُمْ ۗ وَاِنَّ فَرِيْقًا مِّنْهُمْ لَيَكْتُمُوْنَ الْحَقَّ وَهُمْ يَعْلَمُوْنَ", "alladzîna âtainâhumul-kitâba ya'rifûnahû kamâ ya'rifûna abnâ'ahum, wa inna farîqam min-hum layaktumûnal-ḫaqqa wa hum ya'lamûn"], [147, "اَلْحَقُّ مِنْ رَّبِّكَ فَلَا تَكُوْنَنَّ مِنَ الْمُمْتَرِيْنَ ࣖ", "al-ḫaqqu mir rabbika fa lâ takûnanna minal-mumtarîn"], [148, "وَلِكُلٍّ وِّجْهَةٌ هُوَ مُوَلِّيْهَا فَاسْتَبِقُوا الْخَيْرٰتِۗ اَيْنَ مَا تَكُوْنُوْا يَأْتِ بِكُمُ اللّٰهُ جَمِيْعًا ۗ اِنَّ اللّٰهَ عَلٰى كُلِّ شَيْءٍ قَدِيْرٌ", "wa likulliw wij-hatun huwa muwallîhâ fastabiqul-khairât, aina mâ takûnû ya'ti bikumullâhu jamî'â, innallâha 'alâ kulli syai'ing qadîr"], [149, "وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۗ وَاِنَّهٗ لَلْحَقُّ مِنْ رَّبِّكَ ۗ وَمَا اللّٰهُ بِغَافِلٍ عَمَّا تَعْمَلُوْنَ", "wa min ḫaitsu kharajta fa walli waj-haka syathral-masjidil-ḫarâm, wa innahû lal-ḫaqqu mir rabbik, wa mallâhu bighâfilin 'ammâ ta'malûn"], [150, "وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۗ وَحَيْثُ مَا كُنْتُمْ فَوَلُّوْا وُجُوْهَكُمْ شَطْرَهٗ ۙ لِئَلَّا يَكُوْنَ لِلنَّاسِ عَلَيْكُمْ حُجَّةٌ اِلَّا الَّذِيْنَ ظَلَمُوْا مِنْهُمْ فَلَا تَخْشَوْهُمْ وَاخْشَوْنِيْ وَلِاُتِمَّ نِعْمَتِيْ عَلَيْكُمْ وَلَعَلَّكُمْ تَهْتَدُوْنَۙ", "wa min ḫaitsu kharajta fa walli waj-haka syathral-masjidil-ḫarâm, wa ḫaitsu mâ kuntum fa wallû wujûhakum syathrahû li'allâ yakûna lin-nâsi 'alaikum ḫujjatun illalladzîna dhalamû min-hum fa lâ takhsyauhum wakhsyaunî wa li'utimma ni'matî 'alaikum wa la'allakum tahtadûn"], [151, "كَمَآ اَرْسَلْنَا فِيْكُمْ رَسُوْلًا مِّنْكُمْ يَتْلُوْا عَلَيْكُمْ اٰيٰتِنَا وَيُزَكِّيْكُمْ وَيُعَلِّمُكُمُ الْكِتٰبَ وَالْحِكْمَةَ وَيُعَلِّمُكُمْ مَّا لَمْ تَكُوْنُوْا تَعْلَمُوْنَۗ", "kamâ arsalnâ fîkum rasûlam mingkum yatlû 'alaikum âyâtinâ wa yuzakkîkum wa yu'allimukumul-kitâba wal-ḫikmata wa yu'allimukum mâ lam takûnû ta'lamûn"], [152, "فَاذْكُرُوْنِيْٓ اَذْكُرْكُمْ وَاشْكُرُوْا لِيْ وَلَا تَكْفُرُوْنِ ࣖ", "fadzkurûnî adzkurkum wasykurû lî wa lâ takfurûn"], [153, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوا اسْتَعِيْنُوْا بِالصَّبْرِ وَالصَّلٰوةِ ۗ اِنَّ اللّٰهَ مَعَ الصّٰبِرِيْنَ", "yâ ayyuhalladzîna âmanusta'înû bish-shabri wash-shalâh, innallâha ma'ash-shâbirîn"], [154, "وَلَا تَقُوْلُوْا لِمَنْ يُّقْتَلُ فِيْ سَبِيْلِ اللّٰهِ اَمْوَاتٌ ۗ بَلْ اَحْيَاۤءٌ وَّلٰكِنْ لَّا تَشْعُرُوْنَ", "wa lâ taqûlû limay yuqtalu fî sabîlillâhi amwât, bal aḫyâ'uw wa lâkil lâ tasy'urûn"], [155, "وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِّنَ الْخَوْفِ وَالْجُوْعِ وَنَقْصٍ مِّنَ الْاَمْوَالِ وَالْاَنْفُسِ وَالثَّمَرٰتِۗ وَبَشِّرِ الصّٰبِرِيْنَ", "wa lanabluwannakum bisyai'im minal-khaufi wal-jû'i wa naqshim minal-amwâli wal-anfusi wats-tsamarât, wa basysyirish-shâbirîn"], [156, "اَلَّذِيْنَ اِذَآ اَصَابَتْهُمْ مُّصِيْبَةٌ ۗ قَالُوْٓا اِنَّا لِلّٰهِ وَاِنَّآ اِلَيْهِ رٰجِعُوْنَۗ", "alladzîna idzâ ashâbat-hum mushîbah, qâlû innâ lillâhi wa innâ ilaihi râji'ûn"], [157, "اُولٰۤىِٕكَ عَلَيْهِمْ صَلَوٰتٌ مِّنْ رَّبِّهِمْ وَرَحْمَةٌ  ۗوَاُولٰۤىِٕكَ هُمُ الْمُهْتَدُوْنَ", "ulâ'ika 'alaihim shalawâtum mir rabbihim wa raḫmah, wa ulâ'ika humul-muhtadûn"], [158, "۞ اِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَاۤىِٕرِ اللّٰهِ ۚ فَمَنْ حَجَّ الْبَيْتَ اَوِ اعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ اَنْ يَّطَّوَّفَ بِهِمَا ۗ وَمَنْ تَطَوَّعَ خَيْرًاۙ فَاِنَّ اللّٰهَ شَاكِرٌ عَلِيْمٌ", "innash-shafâ wal-marwata min sya'â'irillâh, fa man ḫajjal-baita awi'tamara fa lâ junâḫa 'alaihi ay yaththawwafa bihimâ, wa man tathawwa'a khairan fa innallâha syâkirun 'alîm"], [159, "اِنَّ الَّذِيْنَ يَكْتُمُوْنَ مَآ اَنْزَلْنَا مِنَ الْبَيِّنٰتِ وَالْهُدٰى مِنْۢ بَعْدِ مَا بَيَّنّٰهُ لِلنَّاسِ فِى الْكِتٰبِۙ اُولٰۤىِٕكَ يَلْعَنُهُمُ اللّٰهُ وَيَلْعَنُهُمُ اللّٰعِنُوْنَۙ", "innalladzîna yaktumûna mâ anzalnâ minal-bayyinâti wal-hudâ mim ba'di mâ bayyannâhu lin-nâsi fil-kitâbi ulâ'ika yal'anuhumullâhu wa yal'anuhumul-lâ'inûn"], [160, "اِلَّا الَّذِيْنَ تَابُوْا وَاَصْلَحُوْا وَبَيَّنُوْا فَاُولٰۤىِٕكَ اَتُوْبُ عَلَيْهِمْ ۚ وَاَنَا التَّوَّابُ الرَّحِيْمُ", "illalladzîna tâbû wa ashlaḫû wa bayyanû fa ulâ'ika atûbu 'alaihim, wa anat-tawwâbur-raḫîm"], [161, "اِنَّ الَّذِيْنَ كَفَرُوْا وَمَاتُوْا وَهُمْ كُفَّارٌ اُولٰۤىِٕكَ عَلَيْهِمْ لَعْنَةُ اللّٰهِ وَالْمَلٰۤىِٕكَةِ وَالنَّاسِ اَجْمَعِيْنَۙ", "innalladzîna kafarû wa mâtû wa hum kuffârun ulâ'ika 'alaihim la'natullâhi wal-malâ'ikati wan-nâsi ajma'în"], [162, "خٰلِدِيْنَ فِيْهَا ۚ لَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْظَرُوْنَ", "khâlidîna fîhâ, lâ yukhaffafu 'an-humul-'adzâbu wa lâ hum yundharûn"], [163, "وَاِلٰهُكُمْ اِلٰهٌ وَّاحِدٌۚ  لَآاِلٰهَ اِلَّا هُوَ الرَّحْمٰنُ الرَّحِيْمُ ࣖ", "wa ilâhukum ilâhuw wâḫid, lâ ilâha illâ huwar-raḫmânur-raḫîm"], [164, "اِنَّ فِيْ خَلْقِ السَّمٰوٰتِ وَالْاَرْضِ وَاخْتِلَافِ الَّيْلِ وَالنَّهَارِ وَالْفُلْكِ الَّتِيْ تَجْرِيْ فِى الْبَحْرِ بِمَا يَنْفَعُ النَّاسَ وَمَآ اَنْزَلَ اللّٰهُ مِنَ السَّمَاۤءِ مِنْ مَّاۤءٍ فَاَحْيَا بِهِ الْاَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيْهَا مِنْ كُلِّ دَاۤبَّةٍ ۖ وَّتَصْرِيْفِ الرِّيٰحِ وَالسَّحَابِ الْمُسَخَّرِ بَيْنَ السَّمَاۤءِ وَالْاَرْضِ لَاٰيٰتٍ لِّقَوْمٍ يَّعْقِلُوْنَ", "inna fî khalqis-samâwâti wal-ardli wakhtilâfil-laili wan-nahâri wal-fulkillatî tajrî fil-baḫri bimâ yanfa'un-nâsa wa mâ anzalallâhu minas-samâ'i mim mâ'in fa aḫyâ bihil-ardla ba'da mautihâ wa batstsa fîhâ ming kulli dâbbatiw wa tashrîfir-riyâḫi was-saḫâbil-musakhkhari bainas-samâ'i wal-ardli la'âyâtil liqaumiy ya'qilûn"], [165, "وَمِنَ النَّاسِ مَنْ يَّتَّخِذُ مِنْ دُوْنِ اللّٰهِ اَنْدَادًا يُّحِبُّوْنَهُمْ كَحُبِّ اللّٰهِ ۗ وَالَّذِيْنَ اٰمَنُوْٓا اَشَدُّ حُبًّا لِّلّٰهِ ۙوَلَوْ يَرَى الَّذِيْنَ ظَلَمُوْٓا اِذْ يَرَوْنَ الْعَذَابَۙ اَنَّ الْقُوَّةَ لِلّٰهِ جَمِيْعًا ۙوَّاَنَّ اللّٰهَ شَدِيْدُ الْعَذَابِ", "wa minan-nâsi may yattakhidzu min dûnillâhi andâday yuḫibbûnahum kaḫubbillâh, walladzîna âmanû asyaddu ḫubbal lillâhi walau yaralladzîna dhalamû idz yaraunal-'adzâba annal-quwwata lillâhi jamî'aw wa annallâha syadîdul-'adzâb"], [166, "اِذْ تَبَرَّاَ الَّذِيْنَ اتُّبِعُوْا مِنَ الَّذِيْنَ اتَّبَعُوْا وَرَاَوُا الْعَذَابَ وَتَقَطَّعَتْ بِهِمُ الْاَسْبَابُ", "idz tabarra'alladzînattubi'û minalladzînattaba'û wa ra'awul-'adzâba wa taqaththa'at bihimul-asbâb"], [167, "وَقَالَ الَّذِيْنَ اتَّبَعُوْا لَوْ اَنَّ لَنَا كَرَّةً فَنَتَبَرَّاَ مِنْهُمْ ۗ كَمَا تَبَرَّءُوْا مِنَّا ۗ كَذٰلِكَ يُرِيْهِمُ اللّٰهُ اَعْمَالَهُمْ حَسَرٰتٍ عَلَيْهِمْ ۗ وَمَا هُمْ بِخَارِجِيْنَ مِنَ النَّارِ ࣖ", "wa qâlalladzînattaba'û lau anna lanâ karratan fa natabarra'a min-hum, kamâ tabarra'û minnâ, kadzâlika yurîhimullâhu a'mâlahum ḫasarâtin 'alaihim, wa mâ hum bikhârijîna minan-nâr"], [168, "يٰٓاَيُّهَا النَّاسُ كُلُوْا مِمَّا فِى الْاَرْضِ حَلٰلًا طَيِّبًا ۖوَّلَا تَتَّبِعُوْا خُطُوٰتِ الشَّيْطٰنِۗ اِنَّهٗ لَكُمْ عَدُوٌّ مُّبِيْنٌ", "yâ ayyuhan-nâsu kulû mimmâ fil-ardli ḫalâlan thayyibaw wa lâ tattabi'û khuthuwâtisy-syaithân, innahû lakum 'aduwwum mubîn"], [169, "اِنَّمَا يَأْمُرُكُمْ بِالسُّوْۤءِ وَالْفَحْشَاۤءِ وَاَنْ تَقُوْلُوْا عَلَى اللّٰهِ مَا لَا تَعْلَمُوْنَ", "innamâ ya'murukum bis-sû'i wal-faḫsyâ'i wa an taqûlû 'alallâhi mâ lâ ta'lamûn"], [170, "وَاِذَا قِيْلَ لَهُمُ اتَّبِعُوْا مَآ اَنْزَلَ اللّٰهُ قَالُوْا بَلْ نَتَّبِعُ مَآ اَلْفَيْنَا عَلَيْهِ اٰبَاۤءَنَا ۗ اَوَلَوْ كَانَ اٰبَاۤؤُهُمْ لَا يَعْقِلُوْنَ شَيْـًٔا وَّلَا يَهْتَدُوْنَ", "wa idzâ qîla lahumuttabi'û mâ anzalallâhu qâlû bal nattabi'u mâ alfainâ 'alaihi âbâ'anâ, a walau kâna âbâ'uhum lâ ya'qilûna syai'aw wa lâ yahtadûn"], [171, "وَمَثَلُ الَّذِيْنَ كَفَرُوْا كَمَثَلِ الَّذِيْ يَنْعِقُ بِمَا لَا يَسْمَعُ اِلَّا دُعَاۤءً وَّنِدَاۤءً ۗ صُمٌّ ۢ بُكْمٌ عُمْيٌ فَهُمْ لَا يَعْقِلُوْنَ", "wa matsalulladzîna kafarû kamatsalilladzî yan'iqu bimâ lâ yasma'u illâ du'â'aw wa nidâ'â, shummum bukmun 'umyun fa hum lâ ya'qilûn"], [172, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْا كُلُوْا مِنْ طَيِّبٰتِ مَا رَزَقْنٰكُمْ وَاشْكُرُوْا لِلّٰهِ اِنْ كُنْتُمْ اِيَّاهُ تَعْبُدُوْنَ", "yâ ayyuhalladzîna âmanû kulû min thayyibâti mâ razaqnâkum wasykurû lillâhi ing kuntum iyyâhu ta'budûn"], [173, "اِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنْزِيْرِ وَمَآ اُهِلَّ بِهٖ لِغَيْرِ اللّٰهِ ۚ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَّلَا عَادٍ فَلَآ اِثْمَ عَلَيْهِ ۗ اِنَّ اللّٰهَ غَفُوْرٌ رَّحِيْمٌ", "innamâ ḫarrama 'alaikumul-maitata wad-dama wa laḫmal-khinzîri wa mâ uhilla bihî lighairillâh, fa manidlthurra ghaira bâghiw wa lâ 'âdin fa lâ itsma 'alaîh, innallâha ghafûrur raḫîm"], [174, "اِنَّ الَّذِيْنَ يَكْتُمُوْنَ مَآ اَنْزَلَ اللّٰهُ مِنَ الْكِتٰبِ وَيَشْتَرُوْنَ بِهٖ ثَمَنًا قَلِيْلًاۙ اُولٰۤىِٕكَ مَا يَأْكُلُوْنَ فِيْ بُطُوْنِهِمْ اِلَّا النَّارَ وَلَا يُكَلِّمُهُمُ اللّٰهُ يَوْمَ الْقِيٰمَةِ وَلَا يُزَكِّيْهِمْ ۚوَلَهُمْ عَذَابٌ اَلِيْمٌ", "innalladzîna yaktumûna mâ anzalallâhu minal-kitâbi wa yasytarûna bihî tsamanang qalîlan ulâ'ika mâ ya'kulûna fî buthûnihim illan-nâra wa lâ yukallimuhumullâhu yaumal-qiyâmati wa lâ yuzakkîhim, wa lahum 'adzâbun alîm"], [175, "اُولٰۤىِٕكَ الَّذِيْنَ اشْتَرَوُا الضَّلٰلَةَ بِالْهُدٰى وَالْعَذَابَ بِالْمَغْفِرَةِ ۚ فَمَآ اَصْبَرَهُمْ عَلَى النَّارِ", "ulâ'ikalladzînasytarawudl-dlalâta bil-hudâ wal-'adzâba bil-maghfirah, fa mâ ashbarahum 'alan-nâr"], [176, "ذٰلِكَ بِاَنَّ اللّٰهَ نَزَّلَ الْكِتٰبَ بِالْحَقِّ ۗ وَاِنَّ الَّذِيْنَ اخْتَلَفُوْا فِى الْكِتٰبِ لَفِيْ شِقَاقٍۢ بَعِيْدٍ ࣖ", "dzâlika bi'annallâha nazzalal-kitâba bil-ḫaqq, wa innalladzînakhtalafû fil-kitâbi lafî syiqâqim ba'îd"], [177, "۞ لَيْسَ الْبِرَّاَنْ تُوَلُّوْا وُجُوْهَكُمْ قِبَلَ الْمَشْرِقِ وَالْمَغْرِبِ وَلٰكِنَّ الْبِرَّ مَنْ اٰمَنَ بِاللّٰهِ وَالْيَوْمِ الْاٰخِرِ وَالْمَلٰۤىِٕكَةِ وَالْكِتٰبِ وَالنَّبِيّٖنَ ۚ وَاٰتَى الْمَالَ عَلٰى حُبِّهٖ ذَوِى الْقُرْبٰى وَالْيَتٰمٰى وَالْمَسٰكِيْنَ وَابْنَ السَّبِيْلِۙ وَالسَّاۤىِٕلِيْنَ وَفىِ الرِّقَابِۚ وَاَقَامَ الصَّلٰوةَ وَاٰتَى الزَّكٰوةَ ۚ وَالْمُوْفُوْنَ بِعَهْدِهِمْ اِذَا عَاهَدُوْا ۚ وَالصّٰبِرِيْنَ فِى الْبَأْسَاۤءِ وَالضَّرَّاۤءِ وَحِيْنَ الْبَأْسِۗ اُولٰۤىِٕكَ الَّذِيْنَ صَدَقُوْا ۗوَاُولٰۤىِٕكَ هُمُ الْمُتَّقُوْنَ", "laisal-birra an tuwallû wujûhakum qibalal-masyriqi wal-maghribi wa lâkinnal-birra man âmana billâhi wal-yaumil-âkhiri wal-malâ'ikati wal-kitâbi wan-nabiyyîn, wa âtal-mâla 'alâ ḫubbihî dzawil-qurbâ wal-yatâmâ wal-masâkîna wabnas-sabîli was-sâ'ilîna wa fir-riqâb, wa aqâmash-shalâta wa âtaz-zakâh, wal-mûfûna bi'ahdihim idzâ 'âhadû, wash-shâbirîna fil-ba'sâ'i wadl-dlarrâ'i wa ḫînal-ba's, ulâ'ikalladzîna shadaqû, wa ulâ'ika humul-muttaqûn"], [178, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِى الْقَتْلٰىۗ  اَلْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالْاُنْثٰى بِالْاُنْثٰىۗ  فَمَنْ عُفِيَ لَهٗ مِنْ اَخِيْهِ شَيْءٌ فَاتِّبَاعٌ ۢبِالْمَعْرُوْفِ وَاَدَاۤءٌ اِلَيْهِ بِاِحْسَانٍ ۗ ذٰلِكَ تَخْفِيْفٌ مِّنْ رَّبِّكُمْ وَرَحْمَةٌ  ۗفَمَنِ اعْتَدٰى بَعْدَ ذٰلِكَ فَلَهٗ عَذَابٌ اَلِيْمٌ", "yâ ayyuhalladzîna âmanû kutiba 'alaikumul-qishâshu fil-qatlâ, al-ḫurru bil-ḫurri wal-'abdu bil-'abdi wal-untsâ bil-untsâ, fa man 'ufiya lahû min akhîhi syai'un fattibâ'um bil-ma'rûfi wa adâ'un ilaihi bi'iḫsân, dzâlika takhfîfum mir rabbikum wa raḫmah, fa mani'tadâ ba'da dzâlika fa lahû 'adzâbun alîm"], [179, "وَلَكُمْ فِى الْقِصَاصِ حَيٰوةٌ يّٰٓاُولِى الْاَلْبَابِ لَعَلَّكُمْ تَتَّقُوْنَ", "wa lakum fil-qishâshi ḫayâtuy yâ ulil-albâbi la'allakum tattaqûn"], [180, "كُتِبَ عَلَيْكُمْ اِذَا حَضَرَ اَحَدَكُمُ الْمَوْتُ اِنْ تَرَكَ خَيْرًا ۖ ۨالْوَصِيَّةُ لِلْوَالِدَيْنِ وَالْاَقْرَبِيْنَ بِالْمَعْرُوْفِۚ حَقًّا عَلَى الْمُتَّقِيْنَ ۗ", "kutiba 'alaikum idzâ ḫadlara aḫadakumul-mautu in taraka khairanil-washiyyatu lil-wâlidaini wal-aqrabîna bil-ma'rûf, ḫaqqan 'alal-muttaqîn"], [181, "فَمَنْۢ بَدَّلَهٗ بَعْدَمَا سَمِعَهٗ فَاِنَّمَآ اِثْمُهٗ عَلَى الَّذِيْنَ يُبَدِّلُوْنَهٗ ۗ اِنَّ اللّٰهَ سَمِيْعٌ عَلِيْمٌ ۗ", "fa mam baddalahû ba'da mâ sami'ahû fa innamâ itsmuhû 'alalladzîna yubaddilûnah, innallâha samî'un 'alîm"], [182, "فَمَنْ خَافَ مِنْ مُّوْصٍ جَنَفًا اَوْ اِثْمًا فَاَصْلَحَ بَيْنَهُمْ فَلَآ اِثْمَ عَلَيْهِ ۗ اِنَّ اللّٰهَ غَفُوْرٌ رَّحِيْمٌ ࣖ", "fa man khâfa mim mûshin janafan au itsman fa ashlaḫa bainahum fa lâ itsma 'alaîh, innallâha ghafûrur raḫîm"], [183, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِيْنَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُوْنَۙ", "yâ ayyuhalladzîna âmanû kutiba 'alaikumush-shiyâmu kamâ kutiba 'alalladzîna ming qablikum la'allakum tattaqûn"], [184, "اَيَّامًا مَّعْدُوْدٰتٍۗ فَمَنْ كَانَ مِنْكُمْ مَّرِيْضًا اَوْ عَلٰى سَفَرٍ فَعِدَّةٌ مِّنْ اَيَّامٍ اُخَرَ ۗ وَعَلَى الَّذِيْنَ يُطِيْقُوْنَهٗ فِدْيَةٌ طَعَامُ مِسْكِيْنٍۗ  فَمَنْ تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَّهٗ ۗ وَاَنْ تَصُوْمُوْا خَيْرٌ لَّكُمْ اِنْ كُنْتُمْ تَعْلَمُوْنَ", "ayyâmam ma'dûdât, fa mang kâna mingkum marîdlan au 'alâ safarin fa 'iddatum min ayyâmin ukhar, wa 'alalladzîna yuthîqûnahû fidyatun tha'âmu miskîn, fa man tathawwa'a khairan fa huwa khairul lah, wa an tashûmû khairul lakum ing kuntum ta'lamûn"], [185, "شَهْرُ رَمَضَانَ الَّذِيْٓ اُنْزِلَ فِيْهِ الْقُرْاٰنُ هُدًى لِّلنَّاسِ وَبَيِّنٰتٍ مِّنَ الْهُدٰى وَالْفُرْقَانِۚ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ ۗ وَمَنْ كَانَ مَرِيْضًا اَوْ عَلٰى سَفَرٍ فَعِدَّةٌ مِّنْ اَيَّامٍ اُخَرَ ۗ يُرِيْدُ اللّٰهُ بِكُمُ الْيُسْرَ وَلَا يُرِيْدُ بِكُمُ الْعُسْرَ ۖ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللّٰهَ عَلٰى مَا هَدٰىكُمْ وَلَعَلَّكُمْ تَشْكُرُوْنَ", "syahru ramadlânalladzî unzila fîhil-qur'ânu hudal lin-nâsi wa bayyinâtim minal-hudâ wal-furqân, fa man syahida mingkumusy-syahra falyashum-h, wa mang kâna marîdlan au 'alâ safarin fa 'iddatum min ayyâmin ukhar, yurîdullâhu bikumul-yusra wa lâ yurîdu bikumul-'usra wa litukmilul-'iddata wa litukabbirullâha 'alâ mâ hadâkum wa la'allakum tasykurûn"], [186, "وَاِذَا سَاَلَكَ عِبَادِيْ عَنِّيْ فَاِنِّيْ قَرِيْبٌ ۗ اُجِيْبُ دَعْوَةَ الدَّاعِ اِذَا دَعَانِۙ فَلْيَسْتَجِيْبُوْا لِيْ وَلْيُؤْمِنُوْا بِيْ لَعَلَّهُمْ يَرْشُدُوْنَ", "wa idzâ sa'alaka 'ibâdî 'annî fa innî qarîb, ujîbu da'watad-dâ'i idzâ da'âni falyastajîbû lî walyu'minû bî la'allahum yarsyudûn"], [187, "اُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ اِلٰى نِسَاۤىِٕكُمْ ۗ هُنَّ لِبَاسٌ لَّكُمْ وَاَنْتُمْ لِبَاسٌ لَّهُنَّ ۗ عَلِمَ اللّٰهُ اَنَّكُمْ كُنْتُمْ تَخْتَانُوْنَ اَنْفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنْكُمْ ۚ فَالْـٰٔنَ بَاشِرُوْهُنَّ وَابْتَغُوْا مَا كَتَبَ اللّٰهُ لَكُمْ ۗ وَكُلُوْا وَاشْرَبُوْا حَتّٰى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْاَبْيَضُ مِنَ الْخَيْطِ الْاَسْوَدِ مِنَ الْفَجْرِۖ  ثُمَّ اَتِمُّوا الصِّيَامَ اِلَى الَّيْلِۚ وَلَا تُبَاشِرُوْهُنَّ وَاَنْتُمْ عَاكِفُوْنَۙ فِى الْمَسٰجِدِ ۗ تِلْكَ حُدُوْدُ اللّٰهِ فَلَا تَقْرَبُوْهَاۗ  كَذٰلِكَ يُبَيِّنُ اللّٰهُ اٰيٰتِهٖ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُوْنَ", "uḫilla lakum lailatash-shiyâmir-rafatsu ilâ nisâ'ikum, hunna libâsul lakum wa antum libâsul lahunn, 'alimallâhu annakum kuntum takhtânûna anfusakum fa tâba 'alaikum wa 'afâ 'angkum, fal-âna bâsyirûhunna wabtaghû mâ kataballâhu lakum, wa kulû wasyrabû ḫattâ yatabayyana lakumul-khaithul-abyadlu minal-khaithil-aswadi minal-fajr, tsumma atimmush-shiyâma ilal-laîl, wa lâ tubâsyirûhunna wa antum 'âkifûna fil-masâjid, tilka ḫudûdullâhi fa lâ taqrabûhâ, kadzâlika yubayyinullâhu âyâtihî lin-nâsi la'allahum yattaqûn"], [188, "وَلَا تَأْكُلُوْٓا اَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ وَتُدْلُوْا بِهَآ اِلَى الْحُكَّامِ لِتَأْكُلُوْا فَرِيْقًا مِّنْ اَمْوَالِ النَّاسِ بِالْاِثْمِ وَاَنْتُمْ تَعْلَمُوْنَ ࣖ", "wa lâ ta'kulû amwâlakum bainakum bil-bâthili wa tudlû bihâ ilal-ḫukkâmi lita'kulû farîqam min amwâlin-nâsi bil-itsmi wa antum ta'lamûn"], [189, "۞ يَسـَٔلُوْنَكَ عَنِ الْاَهِلَّةِ ۗ قُلْ هِيَ مَوَاقِيْتُ لِلنَّاسِ وَالْحَجِّ ۗ وَلَيْسَ الْبِرُّ بِاَنْ تَأْتُوا الْبُيُوْتَ مِنْ ظُهُوْرِهَا وَلٰكِنَّ الْبِرَّ مَنِ اتَّقٰىۚ وَأْتُوا الْبُيُوْتَ مِنْ اَبْوَابِهَا ۖ وَاتَّقُوا اللّٰهَ لَعَلَّكُمْ تُفْلِحُوْنَ", "yas'alûnaka 'anil-ahillah, qul hiya mawâqîtu lin-nâsi wal-ḫajj, wa laisal-birru bi'an ta'tul-buyûta min dhuhûrihâ wa lâkinnal-birra manittaqâ, wa'tul-buyûta min abwâbihâ wattaqullâha la'allakum tufliḫûn"], [190, "وَقَاتِلُوْا فِيْ سَبِيْلِ اللّٰهِ الَّذِيْنَ يُقَاتِلُوْنَكُمْ وَلَا تَعْتَدُوْا ۗ اِنَّ اللّٰهَ لَا يُحِبُّ الْمُعْتَدِيْنَ", "wa qâtilû fî sabîlillâhilladzîna yuqâtilûnakum wa lâ ta'tadû, innallâha lâ yuḫibbul-mu'tadîn"], [191, "وَاقْتُلُوْهُمْ حَيْثُ ثَقِفْتُمُوْهُمْ وَاَخْرِجُوْهُمْ مِّنْ حَيْثُ اَخْرَجُوْكُمْ وَالْفِتْنَةُ اَشَدُّ مِنَ الْقَتْلِ ۚ وَلَا تُقَاتِلُوْهُمْ عِنْدَ الْمَسْجِدِ الْحَرَامِ حَتّٰى يُقٰتِلُوْكُمْ فِيْهِۚ فَاِنْ قٰتَلُوْكُمْ فَاقْتُلُوْهُمْۗ  كَذٰلِكَ جَزَاۤءُ الْكٰفِرِيْنَ", "waqtulûhum ḫaitsu tsaqiftumûhum wa akhrijûhum min ḫaitsu akhrajûkum wal-fitnatu asyaddu minal-qatl, wa lâ tuqâtilûhum 'indal-masjidil-ḫarâmi ḫattâ yuqâtilûkum fîh, fa ing qâtalûkum faqtulûhum, kadzâlika jazâ'ul-kâfirîn"], [192, "فَاِنِ انْتَهَوْا فَاِنَّ اللّٰهَ غَفُوْرٌ رَّحِيْمٌ", "fa inintahau fa innallâha ghafûrur raḫîm"], [193, "وَقٰتِلُوْهُمْ حَتّٰى لَا تَكُوْنَ فِتْنَةٌ وَّيَكُوْنَ الدِّيْنُ لِلّٰهِ ۗ فَاِنِ انْتَهَوْا فَلَا عُدْوَانَ اِلَّا عَلَى الظّٰلِمِيْنَ", "wa qâtilûhum ḫattâ lâ takûna fitnatuw wa yakûnad-dînu lillâh, fa inintahau fa lâ 'udwâna illâ 'aladh-dhâlimîn"], [194, "اَلشَّهْرُ الْحَرَامُ بِالشَّهْرِ الْحَرَامِ وَالْحُرُمٰتُ قِصَاصٌۗ فَمَنِ اعْتَدٰى عَلَيْكُمْ فَاعْتَدُوْا عَلَيْهِ بِمِثْلِ مَا اعْتَدٰى عَلَيْكُمْ ۖ وَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّ اللّٰهَ مَعَ الْمُتَّقِيْنَ", "asy-syahrul-ḫarâmu bisy-syahril-ḫarâmi wal-ḫurumâtu qishâsh, fa mani'tadâ 'alaikum fa'tadû 'alaihi bimitsli ma'tadâ 'alaikum wattaqullâha wa'lamû annallâha ma'al-muttaqîn"], [195, "وَاَنْفِقُوْا فِيْ سَبِيْلِ اللّٰهِ وَلَا تُلْقُوْا بِاَيْدِيْكُمْ اِلَى التَّهْلُكَةِ ۛ وَاَحْسِنُوْا ۛ اِنَّ اللّٰهَ يُحِبُّ الْمُحْسِنِيْنَ", "wa anfiqû fî sabîlillâhi wa lâ tulqû bi'aidîkum ilat-tahlukati wa aḫsinû, innallâha yuḫibbul-muḫsinîn"], [196, "وَاَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلّٰهِ ۗ فَاِنْ اُحْصِرْتُمْ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِۚ وَلَا تَحْلِقُوْا رُءُوْسَكُمْ حَتّٰى يَبْلُغَ الْهَدْيُ مَحِلَّهٗ ۗ فَمَنْ كَانَ مِنْكُمْ مَّرِيْضًا اَوْ بِهٖٓ اَذًى مِّنْ رَّأْسِهٖ فَفِدْيَةٌ مِّنْ صِيَامٍ اَوْ صَدَقَةٍ اَوْ نُسُكٍ ۚ فَاِذَآ اَمِنْتُمْ ۗ فَمَنْ تَمَتَّعَ بِالْعُمْرَةِ اِلَى الْحَجِّ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِۚ فَمَنْ لَّمْ يَجِدْ فَصِيَامُ ثَلٰثَةِ اَيَّامٍ فِى الْحَجِّ وَسَبْعَةٍ اِذَا رَجَعْتُمْ ۗ تِلْكَ عَشَرَةٌ كَامِلَةٌ  ۗذٰلِكَ لِمَنْ لَّمْ يَكُنْ اَهْلُهٗ حَاضِرِى الْمَسْجِدِ الْحَرَامِ ۗ وَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّ اللّٰهَ شَدِيْدُ الْعِقَابِ ࣖ", "wa atimmul-ḫajja wal-'umrata lillâh, fa in uḫshirtum fa mastaisara minal-hady, wa lâ taḫliqû ru'ûsakum ḫattâ yablughal-hadyu maḫillah, fa mang kâna mingkum marîdlan au bihî adzam mir ra'sihî fa fidyatum min shiyâmin au shadaqatin au nusuk, fa idzâ amintum, fa man tamatta'a bil-'umrati ilal-ḫajji fa mastaisara minal-hady, fa mal lam yajid fa shiyâmu tsalâtsati ayyâmin fil-ḫajji wa sab'atin idzâ raja'tum, tilka 'asyaratung kâmilah, dzâlika limal lam yakun ahluhû ḫâdliril-masjidil-ḫarâm, wattaqullâha wa'lamû annallâha syadîdul-'iqâb"], [197, "اَلْحَجُّ اَشْهُرٌ مَّعْلُوْمٰتٌ ۚ فَمَنْ فَرَضَ فِيْهِنَّ الْحَجَّ فَلَا رَفَثَ وَلَا فُسُوْقَ وَلَا جِدَالَ فِى الْحَجِّ ۗ وَمَا تَفْعَلُوْا مِنْ خَيْرٍ يَّعْلَمْهُ اللّٰهُ ۗ وَتَزَوَّدُوْا فَاِنَّ خَيْرَ الزَّادِ التَّقْوٰىۖ وَاتَّقُوْنِ يٰٓاُولِى الْاَلْبَابِ", "al-ḫajju asy-hurum ma'lûmât, fa man faradla fîhinnal-ḫajja fa lâ rafatsa wa lâ fusûqa wa lâ jidâla fil-ḫajj, wa mâ taf'alû min khairiy ya'lam-hullâh, wa tazawwadû fa inna khairaz-zâdit-taqwâ wattaqûni yâ ulil-albâb"], [198, "لَيْسَ عَلَيْكُمْ جُنَاحٌ اَنْ تَبْتَغُوْا فَضْلًا مِّنْ رَّبِّكُمْ ۗ فَاِذَآ اَفَضْتُمْ مِّنْ عَرَفَاتٍ فَاذْكُرُوا اللّٰهَ عِنْدَ الْمَشْعَرِ الْحَرَامِ ۖ وَاذْكُرُوْهُ كَمَا هَدٰىكُمْ ۚ وَاِنْ كُنْتُمْ مِّنْ قَبْلِهٖ لَمِنَ الضَّاۤلِّيْنَ", "laisa 'alaikum junâḫun an tabtaghû fadllam mir rabbikum, fa idzâ afadltum min 'arafâtin fadzkurullâha 'indal-masy'aril-ḫarâmi wadzkurûhu kamâ hadâkum, wa ing kuntum ming qablihî laminadl-dlâllîn"], [199, "ثُمَّ اَفِيْضُوْا مِنْ حَيْثُ اَفَاضَ النَّاسُ وَاسْتَغْفِرُوا اللّٰهَ ۗ اِنَّ اللّٰهَ غَفُوْرٌ رَّحِيْمٌ", "tsumma afîdlû min ḫaitsu afâdlan-nâsu wastaghfirullâh, innallâha ghafûrur raḫîm"], [200, "فَاِذَا قَضَيْتُمْ مَّنَاسِكَكُمْ فَاذْكُرُوا اللّٰهَ كَذِكْرِكُمْ اٰبَاۤءَكُمْ اَوْ اَشَدَّ ذِكْرًا ۗ فَمِنَ النَّاسِ مَنْ يَّقُوْلُ رَبَّنَآ اٰتِنَا فِى الدُّنْيَا وَمَا لَهٗ فِى الْاٰخِرَةِ مِنْ خَلَاقٍ", "fa idzâ qadlaitum manasikakum fadzkurullâha kadzikrikum âbâ'akum au asyadda dzikrâ, fa minan-nâsi may yaqûlu rabbanâ âtinâ fid-dun-yâ wa mâ lahû fil-âkhirati min khalâq"], [201, "وَمِنْهُمْ مَّنْ يَّقُوْلُ رَبَّنَآ اٰتِنَا فِى الدُّنْيَا حَسَنَةً وَّفِى الْاٰخِرَةِ حَسَنَةً وَّقِنَا عَذَابَ النَّارِ", "wa min-hum may yaqûlu rabbanâ âtinâ fid-dun-yâ ḫasanataw wa fil-âkhirati ḫasanataw wa qinâ 'adzâban-nâr"], [202, "اُولٰۤىِٕكَ لَهُمْ نَصِيْبٌ مِّمَّا كَسَبُوْا ۗ وَاللّٰهُ سَرِيْعُ الْحِسَابِ", "ulâ'ika lahum nashîbum mimmâ kasabû, wallâhu sarî'ul-ḫisâb"], [203, "۞ وَاذْكُرُوا اللّٰهَ فِيْٓ اَيَّامٍ مَّعْدُوْدٰتٍ ۗ فَمَنْ تَعَجَّلَ فِيْ يَوْمَيْنِ فَلَآ اِثْمَ عَلَيْهِ ۚوَمَنْ تَاَخَّرَ فَلَآ اِثْمَ عَلَيْهِۙ لِمَنِ اتَّقٰىۗ وَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّكُمْ اِلَيْهِ تُحْشَرُوْنَ", "wadzkurullâha fî ayyâmim ma'dûdât, fa man ta'ajjala fî yaumaini fa lâ itsma 'alaîh, wa man ta'akhkhara fa lâ itsma 'alaihi limanittaqâ, wattaqullâha wa'lamû annakum ilaihi tuḫsyarûn"], [204, "وَمِنَ النَّاسِ مَنْ يُّعْجِبُكَ قَوْلُهٗ فِى الْحَيٰوةِ الدُّنْيَا وَيُشْهِدُ اللّٰهَ عَلٰى مَا فِيْ قَلْبِهٖ ۙ وَهُوَ اَلَدُّ الْخِصَامِ", "wa minan-nâsi may yu'jibuka qauluhû fil-ḫayâtid-dun-yâ wa yusy-hidullâha 'alâ mâ fî qalbihî wa huwa aladdul-khishâm"], [205, "وَاِذَا تَوَلّٰى سَعٰى فِى الْاَرْضِ لِيُفْسِدَ فِيْهَا وَيُهْلِكَ الْحَرْثَ وَالنَّسْلَ ۗ وَ اللّٰهُ لَا يُحِبُّ الْفَسَادَ", "wa idzâ tawallâ sa'â fil-ardli liyufsida fîhâ wa yuhlikal-ḫartsa wan-nasl, wallâhu lâ yuḫibbul-fasâd"], [206, "وَاِذَا قِيْلَ لَهُ اتَّقِ اللّٰهَ اَخَذَتْهُ الْعِزَّةُ بِالْاِثْمِ فَحَسْبُهٗ جَهَنَّمُ ۗ وَلَبِئْسَ الْمِهَادُ", "wa idzâ qîla lahuttaqillâha akhadzat-hul-'izzatu bil-itsmi fa ḫasbuhû jahannam, wa labi'sal-mihâd"], [207, "وَمِنَ النَّاسِ مَنْ يَّشْرِيْ نَفْسَهُ ابْتِغَاۤءَ مَرْضَاتِ اللّٰهِ ۗوَاللّٰهُ رَءُوْفٌۢ بِالْعِبَادِ", "wa minan-nâsi may yasyrî nafsahubtighâ'a mardlâtillâh, wallâhu ra'ûfum bil-'ibâd"], [208, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوا ادْخُلُوْا فِى السِّلْمِ كَاۤفَّةً  ۖوَّلَا تَتَّبِعُوْا خُطُوٰتِ الشَّيْطٰنِۗ اِنَّهٗ لَكُمْ عَدُوٌّ مُّبِيْنٌ", "yâ ayyuhalladzîna âmanudkhulû fis-silmi kâffataw wa lâ tattabi'û khuthuwâtisy-syaithân, innahû lakum 'aduwwum mubîn"], [209, "فَاِنْ زَلَلْتُمْ مِّنْۢ بَعْدِ مَا جَاۤءَتْكُمُ الْبَيِّنٰتُ فَاعْلَمُوْٓا اَنَّ اللّٰهَ عَزِيْزٌ حَكِيْمٌ", "fa in zalaltum mim ba'di mâ jâ'atkumul-bayyinâtu fa'lamû annallâha 'azîzun ḫakîm"], [210, "هَلْ يَنْظُرُوْنَ اِلَّآ اَنْ يَّأْتِيَهُمُ اللّٰهُ فِيْ ظُلَلٍ مِّنَ الْغَمَامِ وَالْمَلٰۤىِٕكَةُ وَقُضِيَ الْاَمْرُ ۗ وَاِلَى اللّٰهِ تُرْجَعُ الْاُمُوْرُ ࣖ", "hal yandhurûna illâ ay ya'tiyahumullâhu fî dhulalim minal-ghamâmi wal-malâ'ikatu wa qudliyal-amr, wa ilallâhi turja'ul-umûr"], [211, "سَلْ بَنِيْٓ اِسْرَاۤءِيْلَ كَمْ اٰتَيْنٰهُمْ مِّنْ اٰيَةٍ ۢ بَيِّنَةٍ ۗ وَمَنْ يُّبَدِّلْ نِعْمَةَ اللّٰهِ مِنْۢ بَعْدِ مَا جَاۤءَتْهُ فَاِنَّ اللّٰهَ  شَدِيْدُ الْعِقَابِ", "sal banî isrâ'îla kam âtainâhum min âyatim bayyinah, wa may yubaddil ni'matallâhi mim ba'di mâ jâ'at-hu fa innallâha syadîdul-'iqâb"], [212, "زُيِّنَ لِلَّذِيْنَ كَفَرُوا الْحَيٰوةُ الدُّنْيَا وَيَسْخَرُوْنَ مِنَ الَّذِيْنَ اٰمَنُوْا ۘ وَالَّذِيْنَ اتَّقَوْا فَوْقَهُمْ يَوْمَ الْقِيٰمَةِ ۗ وَاللّٰهُ يَرْزُقُ مَنْ يَّشَاۤءُ بِغَيْرِ حِسَابٍ", "zuyyina lilladzîna kafarul-ḫayâtud-dun-yâ wa yaskharûna minalladzîna âmanû, walladzînattaqau fauqahum yaumal-qiyâmah, wallâhu yarzuqu may yasyâ'u bighairi ḫisâb"], [213, "كَانَ النَّاسُ اُمَّةً وَّاحِدَةً ۗ فَبَعَثَ اللّٰهُ النَّبِيّٖنَ مُبَشِّرِيْنَ وَمُنْذِرِيْنَ ۖ وَاَنْزَلَ مَعَهُمُ الْكِتٰبَ بِالْحَقِّ لِيَحْكُمَ بَيْنَ النَّاسِ فِيْمَا اخْتَلَفُوْا فِيْهِ ۗ وَمَا اخْتَلَفَ فِيْهِ اِلَّا الَّذِيْنَ اُوْتُوْهُ مِنْۢ بَعْدِ مَا جَاۤءَتْهُمُ الْبَيِّنٰتُ بَغْيًا ۢ بَيْنَهُمْ ۚ فَهَدَى اللّٰهُ الَّذِيْنَ اٰمَنُوْا لِمَا اخْتَلَفُوْا فِيْهِ مِنَ الْحَقِّ بِاِذْنِهٖ ۗ وَاللّٰهُ يَهْدِيْ مَنْ يَّشَاۤءُ اِلٰى صِرَاطٍ مُّسْتَقِيْمٍ", "kânan-nâsu ummataw wâḫidah, fa ba'atsallâhun-nabiyyîna mubasysyirîna wa mundzirîna wa anzala ma'ahumul-kitâba bil-ḫaqqi liyaḫkuma bainan-nâsi fîmakhtalafû fîh, wa makhtalafa fîhi illalladzîna ûtûhu mim ba'di mâ jâ'at-humul-bayyinâtu baghyam bainahum, fa hadallâhulladzîna âmanû limakhtalafû fîhi minal-ḫaqqi bi'idznih, wallâhu yahdî may yasyâ'u ilâ shirâthim mustaqîm"], [214, "اَمْ حَسِبْتُمْ اَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَأْتِكُمْ مَّثَلُ الَّذِيْنَ خَلَوْا مِنْ قَبْلِكُمْ ۗ مَسَّتْهُمُ الْبَأْسَاۤءُ وَالضَّرَّاۤءُ وَزُلْزِلُوْا حَتّٰى يَقُوْلَ الرَّسُوْلُ وَالَّذِيْنَ اٰمَنُوْا مَعَهٗ مَتٰى نَصْرُ اللّٰهِ ۗ اَلَآ اِنَّ نَصْرَ اللّٰهِ قَرِيْبٌ", "am ḫasibtum an tadkhulul-jannata wa lammâ ya'tikum matsalulladzîna khalau ming qablikum, massat-humul-ba'sâ'u wadl-dlarrâ'u wa zulzilû ḫattâ yaqûlar-rasûlu walladzîna âmanû ma'ahû matâ nashrullâh, alâ inna nashrallâhi qarîb"], [215, "يَسْـَٔلُوْنَكَ مَاذَا يُنْفِقُوْنَ ۗ قُلْ مَآ اَنْفَقْتُمْ مِّنْ خَيْرٍ فَلِلْوَالِدَيْنِ وَالْاَقْرَبِيْنَ وَالْيَتٰمٰى وَالْمَسٰكِيْنِ وَابْنِ السَّبِيْلِ ۗ وَمَا تَفْعَلُوْا مِنْ خَيْرٍ فَاِنَّ اللّٰهَ بِهٖ عَلِيْمٌ", "yas'alûnaka mâdzâ yunfiqûn, qul mâ anfaqtum min khairin fa lil-wâlidaini wal-aqrabîna wal-yatâmâ wal-masâkîni wabnis-sabîl, wa mâ taf'alû min khairin fa innallâha bihî 'alîm"], [216, "كُتِبَ عَلَيْكُمُ الْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ ۚ وَعَسٰٓى اَنْ تَكْرَهُوْا شَيْـًٔا وَّهُوَ خَيْرٌ لَّكُمْ ۚ وَعَسٰٓى اَنْ تُحِبُّوْا شَيْـًٔا وَّهُوَ شَرٌّ لَّكُمْ ۗ وَاللّٰهُ يَعْلَمُ وَاَنْتُمْ لَا تَعْلَمُوْنَ ࣖ", "kutiba 'alaikumul-qitâlu wa huwa kur-hul lakum, wa 'asâ an takrahû syai'aw wa huwa khairul lakum, wa 'asâ an tuḫibbû syai'aw wa huwa syarrul lakum, wallâhu ya'lamu wa antum lâ ta'lamûn"], [217, "يَسْـَٔلُوْنَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيْهِۗ  قُلْ قِتَالٌ فِيْهِ كَبِيْرٌ ۗ وَصَدٌّ عَنْ سَبِيْلِ اللّٰهِ وَكُفْرٌۢ بِهٖ وَالْمَسْجِدِ الْحَرَامِ وَاِخْرَاجُ اَهْلِهٖ مِنْهُ اَكْبَرُ عِنْدَ اللّٰهِ ۚ وَالْفِتْنَةُ اَكْبَرُ مِنَ الْقَتْلِ ۗ وَلَا يَزَالُوْنَ يُقَاتِلُوْنَكُمْ حَتّٰى يَرُدُّوْكُمْ عَنْ دِيْنِكُمْ اِنِ اسْتَطَاعُوْا ۗ وَمَنْ يَّرْتَدِدْ مِنْكُمْ عَنْ دِيْنِهٖ فَيَمُتْ وَهُوَ كَافِرٌ فَاُولٰۤىِٕكَ حَبِطَتْ اَعْمَالُهُمْ فِى الدُّنْيَا وَالْاٰخِرَةِ ۚ وَاُولٰۤىِٕكَ اَصْحٰبُ النَّارِۚ هُمْ فِيْهَا خٰلِدُوْنَ", "yas'alûnaka 'anisy-syahril-ḫarâmi qitâlin fîh, qul qitâlun fîhi kabîr, wa shaddun 'an sabîlillâhi wa kufrum bihî wal-masjidil-ḫarâmi wa ikhrâju ahlihî min-hu akbaru 'indallâh, wal-fitnatu akbaru minal-qatl, wa lâ yazâlûna yuqâtilûnakum ḫattâ yaruddûkum 'an dînikum inistathâ'û, wa may yartadid mingkum 'an dînihî fa yamut wa huwa kâfirun fa ulâ'ika ḫabithat a'mâluhum fid-dun-yâ wal-âkhirah, wa ulâ'ika ash-ḫâbun-nâr, hum fîhâ khâlidûn"], [218, "اِنَّ الَّذِيْنَ اٰمَنُوْا وَالَّذِيْنَ هَاجَرُوْا وَجَاهَدُوْا فِيْ سَبِيْلِ اللّٰهِ ۙ اُولٰۤىِٕكَ يَرْجُوْنَ رَحْمَتَ اللّٰهِ ۗوَاللّٰهُ غَفُوْرٌ رَّحِيْمٌ", "innalladzîna âmanû walladzîna hâjarû wa jâhadû fî sabîlillâhi ulâ'ika yarjûna raḫmatallâh, wallâhu ghafûrur raḫîm"], [219, "۞ يَسْـَٔلُوْنَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِۗ قُلْ فِيْهِمَآ اِثْمٌ كَبِيْرٌ وَّمَنَافِعُ لِلنَّاسِۖ وَاِثْمُهُمَآ اَكْبَرُ مِنْ نَّفْعِهِمَاۗ وَيَسْـَٔلُوْنَكَ مَاذَا يُنْفِقُوْنَ ەۗ قُلِ الْعَفْوَۗ  كَذٰلِكَ يُبَيِّنُ اللّٰهُ لَكُمُ الْاٰيٰتِ لَعَلَّكُمْ تَتَفَكَّرُوْنَۙ", "yas'alûnaka 'anil-khamri wal-maisir, qul fîhimâ itsmung kabîruw wa manafi'u lin-nâsi wa itsmuhumâ akbaru min-naf'ihimâ, wa yas'alûnaka mâdzâ yunfiqûn, qulil-'afw, kadzâlika yubayyinullâhu lakumul-âyâti la'allakum tatafakkarûn"], [220, "فِى الدُّنْيَا وَالْاٰخِرَةِ ۗ وَيَسْـَٔلُوْنَكَ عَنِ الْيَتٰمٰىۗ قُلْ اِصْلَاحٌ لَّهُمْ خَيْرٌ ۗ وَاِنْ تُخَالِطُوْهُمْ فَاِخْوَانُكُمْ ۗ وَاللّٰهُ يَعْلَمُ الْمُفْسِدَ مِنَ الْمُصْلِحِ ۗ وَلَوْ شَاۤءَ اللّٰهُ لَاَعْنَتَكُمْ اِنَّ اللّٰهَ عَزِيْزٌ حَكِيْمٌ", "fid-dun-yâ wal-âkhirah, wa yas'alûnaka 'anil-yatâmâ, qul ishlâḫul lahum khaîr, wa in tukhâlithûhum fa ikhwânukum, wallâhu ya'lamul-mufsida minal-mushliḫ, walau syâ'allâhu la'a'natakum, innallâha 'azîzun ḫakîm"], [221, "وَلَا تَنْكِحُوا الْمُشْرِكٰتِ حَتّٰى يُؤْمِنَّ ۗ وَلَاَمَةٌ مُّؤْمِنَةٌ خَيْرٌ مِّنْ مُّشْرِكَةٍ وَّلَوْ اَعْجَبَتْكُمْ ۚ وَلَا تُنْكِحُوا الْمُشْرِكِيْنَ حَتّٰى يُؤْمِنُوْا ۗ وَلَعَبْدٌ مُّؤْمِنٌ خَيْرٌ مِّنْ مُّشْرِكٍ وَّلَوْ اَعْجَبَكُمْ ۗ اُولٰۤىِٕكَ يَدْعُوْنَ اِلَى النَّارِ ۖ وَاللّٰهُ يَدْعُوْٓا اِلَى الْجَنَّةِ وَالْمَغْفِرَةِ بِاِذْنِهٖۚ وَيُبَيِّنُ اٰيٰتِهٖ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُوْنَ ࣖ", "wa lâ tangkiḫul-musyrikâti ḫattâ yu'minn, wa la'amatum mu'minatun khairum mim musyrikatiw walau a'jabatkum, wa lâ tungkiḫul-musyrikîna ḫattâ yu'minû, wa la'abdum mu'minun khairum mim musyrikiw walau a'jabakum, ulâ'ika yad'ûna ilan-nâri wallâhu yad'û ilal-jannati wal-maghfirati bi'idznih, wa yubayyinu âyâtihî lin-nâsi la'allahum yatadzakkarûn"], [222, "وَيَسْـَٔلُوْنَكَ عَنِ الْمَحِيْضِ ۗ  قُلْ هُوَ اَذًىۙ فَاعْتَزِلُوا النِّسَاۤءَ فِى الْمَحِيْضِۙ وَلَا تَقْرَبُوْهُنَّ حَتّٰى يَطْهُرْنَ ۚ فَاِذَا تَطَهَّرْنَ فَأْتُوْهُنَّ مِنْ حَيْثُ اَمَرَكُمُ اللّٰهُ ۗ اِنَّ اللّٰهَ يُحِبُّ التَّوَّابِيْنَ وَيُحِبُّ الْمُتَطَهِّرِيْنَ", "wa yas'alûnaka 'anil-maḫîdl, qul huwa adzan fa'tazilun-nisâ'a fil-maḫîdli wa lâ taqrabûhunna ḫattâ yath-hurn, fa idzâ tathahharna fa'tûhunna min ḫaitsu amarakumullâh, innallâha yuḫibbut-tawwâbîna wa yuḫibbul-mutathahhirîn"], [223, "نِسَاۤؤُكُمْ حَرْثٌ لَّكُمْ ۖ فَأْتُوْا حَرْثَكُمْ اَنّٰى شِئْتُمْ ۖ وَقَدِّمُوْا لِاَنْفُسِكُمْ ۗ وَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّكُمْ مُّلٰقُوْهُ ۗ وَبَشِّرِ الْمُؤْمِنِيْنَ", "nisâ'ukum ḫartsul lakum fa'tû ḫartsakum annâ syi'tum wa qaddimû li'anfusikum, wattaqullâha wa'lamû annakum mulâqûh, wa basysyiril-mu'minîn"], [224, "وَلَا تَجْعَلُوا اللّٰهَ عُرْضَةً لِّاَيْمَانِكُمْ اَنْ تَبَرُّوْا وَتَتَّقُوْا وَتُصْلِحُوْا بَيْنَ النَّاسِۗ وَاللّٰهُ سَمِيْعٌ عَلِيْمٌ", "wa lâ taj'alullâha 'urdlatal li'aimânikum an tabarrû wa tattaqû wa tushliḫû bainan-nâs, wallâhu samî'un 'alîm"], [225, "لَا يُؤَاخِذُكُمُ اللّٰهُ بِاللَّغْوِ فِيْٓ اَيْمَانِكُمْ وَلٰكِنْ يُّؤَاخِذُكُمْ بِمَا كَسَبَتْ قُلُوْبُكُمْ ۗ وَاللّٰهُ غَفُوْرٌ حَلِيْمٌ", "lâ yu'âkhidzukumullâhu bil-laghwi fî aimânikum wa lâkiy yu'âkhidzukum bimâ kasabat qulûbukum, wallâhu ghafûrun ḫalîm"], [226, "لِلَّذِيْنَ يُؤْلُوْنَ مِنْ نِّسَاۤىِٕهِمْ تَرَبُّصُ اَرْبَعَةِ اَشْهُرٍۚ فَاِنْ فَاۤءُوْ فَاِنَّ اللّٰهَ غَفُوْرٌ رَّحِيْمٌ", "lilladzîna yu'lûna min nisâ'ihim tarabbushu arba'ati asy-hur, fa in fâ'û fa innallâha ghafûrur raḫîm"], [227, "وَاِنْ عَزَمُوا الطَّلَاقَ فَاِنَّ اللّٰهَ سَمِيْعٌ عَلِيْمٌ", "wa in 'azamuth-thalâqa fa innallâha samî'un 'alîm"], [228, "وَالْمُطَلَّقٰتُ يَتَرَبَّصْنَ بِاَنْفُسِهِنَّ ثَلٰثَةَ قُرُوْۤءٍۗ وَلَا يَحِلُّ لَهُنَّ اَنْ يَّكْتُمْنَ مَا خَلَقَ اللّٰهُ فِيْٓ اَرْحَامِهِنَّ اِنْ كُنَّ يُؤْمِنَّ بِاللّٰهِ وَالْيَوْمِ الْاٰخِرِۗ وَبُعُوْلَتُهُنَّ اَحَقُّ بِرَدِّهِنَّ فِيْ ذٰلِكَ اِنْ اَرَادُوْٓا اِصْلَاحًا ۗوَلَهُنَّ مِثْلُ الَّذِيْ عَلَيْهِنَّ بِالْمَعْرُوْفِۖ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ  ۗ وَاللّٰهُ عَزِيْزٌ حَكِيْمٌ ࣖ", "wal-muthallaqâtu yatarabbashna bi'anfusihinna tsalâtsata qurû', wa lâ yaḫillu lahunna ay yaktumna mâ khalaqallâhu fî ar-ḫâmihinna ing kunna yu'minna billâhi wal-yaumil-âkhir, wa bu'ûlatuhunna aḫaqqu biraddihinna fî dzâlika in arâdû ishlâḫâ, wa lahunna mitslulladzî 'alaihinna bil-ma'rûfi wa lir-rijâli 'alaihinna darajah, wallâhu 'azîzun ḫakîm"], [229, "اَلطَّلَاقُ مَرَّتٰنِ ۖ فَاِمْسَاكٌۢ بِمَعْرُوْفٍ اَوْ تَسْرِيْحٌۢ بِاِحْسَانٍ ۗ وَلَا يَحِلُّ لَكُمْ اَنْ تَأْخُذُوْا مِمَّآ اٰتَيْتُمُوْهُنَّ شَيْـًٔا اِلَّآ اَنْ يَّخَافَآ اَلَّا يُقِيْمَا حُدُوْدَ اللّٰهِ ۗ فَاِنْ خِفْتُمْ اَلَّا يُقِيْمَا حُدُوْدَ اللّٰهِ ۙ فَلَا جُنَاحَ عَلَيْهِمَا فِيْمَا افْتَدَتْ بِهٖ ۗ تِلْكَ حُدُوْدُ اللّٰهِ فَلَا تَعْتَدُوْهَا ۚوَمَنْ يَّتَعَدَّ حُدُوْدَ اللّٰهِ فَاُولٰۤىِٕكَ هُمُ الظّٰلِمُوْنَ", "ath-thalâqu marratâni fa imsâkum bima'rûfin au tasrîḫum bi'iḫsân, wa lâ yaḫillu lakum an ta'khudzû mimmâ âtaitumûhunna syai'an illâ ay yakhâfâ allâ yuqîmâ ḫudûdallâh, fa in khiftum allâ yuqîmâ ḫudûdallâhi fa lâ junâḫa 'alaihimâ fîmaftadat bih, tilka ḫudûdullâhi fa lâ ta'tadûhâ, wa may yata'adda ḫudûdallâhi fa ulâ'ika humudh-dhâlimûn"], [230, "فَاِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهٗ مِنْۢ بَعْدُ حَتّٰى تَنْكِحَ زَوْجًا غَيْرَهٗ ۗ فَاِنْ طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ اَنْ يَّتَرَاجَعَآ اِنْ ظَنَّآ اَنْ يُّقِيْمَا حُدُوْدَ اللّٰهِ ۗ وَتِلْكَ حُدُوْدُ اللّٰهِ يُبَيِّنُهَا لِقَوْمٍ يَّعْلَمُوْنَ", "fa in thallaqahâ fa lâ taḫillu lahû mim ba'du ḫattâ tangkiḫa zaujan ghairah, fa in thallaqahâ fa lâ junâḫa 'alaihimâ ay yatarâja'â in dhannâ ay yuqîmâ ḫudûdallâh, wa tilka ḫudûdullâhi yubayyinuhâ liqaumiy ya'lamûn"], [231, "وَاِذَا طَلَّقْتُمُ النِّسَاۤءَ فَبَلَغْنَ اَجَلَهُنَّ فَاَمْسِكُوْهُنَّ بِمَعْرُوْفٍ اَوْ سَرِّحُوْهُنَّ بِمَعْرُوْفٍۗ وَلَا تُمْسِكُوْهُنَّ ضِرَارًا لِّتَعْتَدُوْا ۚ وَمَنْ يَّفْعَلْ ذٰلِكَ فَقَدْ ظَلَمَ نَفْسَهٗ ۗ وَلَا تَتَّخِذُوْٓا اٰيٰتِ اللّٰهِ هُزُوًا وَّاذْكُرُوْا نِعْمَتَ اللّٰهِ عَلَيْكُمْ وَمَآ اَنْزَلَ عَلَيْكُمْ مِّنَ الْكِتٰبِ وَالْحِكْمَةِ يَعِظُكُمْ بِهٖ ۗوَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّ اللّٰهَ بِكُلِّ شَيْءٍ عَلِيْمٌ ࣖ", "wa idzâ thallaqtumun-nisâ'a fa balaghna ajalahunna fa amsikûhunna bima'rûfin au sarriḫûhunna bima'rûf, wa lâ tumsikûhunna dlirâral lita'tadû, wa may yaf'al dzâlika fa qad dhalama nafsah, wa lâ tattakhidzû âyâtillâhi huzuwaw wadzkurû ni'matallâhi 'alaikum wa mâ anzala 'alaikum minal-kitâbi wal-ḫikmati ya'idhukum bih, wattaqullâha wa'lamû annallâha bikulli syai'in 'alîm"], [232, "وَاِذَا طَلَّقْتُمُ النِّسَاۤءَ فَبَلَغْنَ اَجَلَهُنَّ فَلَا تَعْضُلُوْهُنَّ اَنْ يَّنْكِحْنَ اَزْوَاجَهُنَّ اِذَا تَرَاضَوْا بَيْنَهُمْ بِالْمَعْرُوْفِ ۗ ذٰلِكَ يُوْعَظُ بِهٖ مَنْ كَانَ مِنْكُمْ يُؤْمِنُ بِاللّٰهِ وَالْيَوْمِ الْاٰخِرِ ۗ ذٰلِكُمْ اَزْكٰى لَكُمْ وَاَطْهَرُ ۗ وَاللّٰهُ يَعْلَمُ وَاَنْتُمْ لَا تَعْلَمُوْنَ", "wa idzâ thallaqtumun-nisâ'a fa balaghna ajalahunna fa lâ ta'dlulûhunna ay yangkiḫna azwâjahunna idzâ tarâdlau bainahum bil-ma'rûf, dzâlika yû'adhu bihî mang kâna mingkum yu'minu billâhi wal-yaumil-âkhir, dzâlikum azkâ lakum wa ath-har, wallâhu ya'lamu wa antum lâ ta'lamûn"], [233, "۞ وَالْوَالِدٰتُ يُرْضِعْنَ اَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ لِمَنْ اَرَادَ اَنْ يُّتِمَّ الرَّضَاعَةَ ۗ وَعَلَى الْمَوْلُوْدِ لَهٗ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوْفِۗ  لَا تُكَلَّفُ نَفْسٌ اِلَّا وُسْعَهَا ۚ لَا تُضَاۤرَّ وَالِدَةٌ ۢبِوَلَدِهَا وَلَا مَوْلُوْدٌ لَّهٗ بِوَلَدِهٖ وَعَلَى الْوَارِثِ مِثْلُ ذٰلِكَ ۚ فَاِنْ اَرَادَا فِصَالًا عَنْ تَرَاضٍ مِّنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ عَلَيْهِمَا ۗوَاِنْ اَرَدْتُّمْ اَنْ تَسْتَرْضِعُوْٓا اَوْلَادَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ اِذَا سَلَّمْتُمْ مَّآ اٰتَيْتُمْ بِالْمَعْرُوْفِۗ وَاتَّقُوا اللّٰهَ وَاعْلَمُوْٓا اَنَّ اللّٰهَ بِمَا تَعْمَلُوْنَ بَصِيْرٌ", "wal-wâlidâtu yurdli'na aulâdahunna ḫaulaini kâmilaini liman arâda ay yutimmar-radlâ'ah, wa 'alal-maulûdi lahû rizquhunna wa kiswatuhunna bil-ma'rûf, lâ tukallafu nafsun illâ wus'ahâ, lâ tudlârra wâlidatum biwaladihâ wa lâ maulûdul lahû biwaladihî wa 'alal-wâritsi mitslu dzâlik, fa in arâdâ fishâlan 'an tarâdlim min-humâ wa tasyâwurin fa lâ junâḫa 'alaihimâ, wa in arattum an tastardli'û aulâdakum fa lâ junâḫa 'alaikum idzâ sallamtum mâ âtaitum bil-ma'rûf, wattaqullâha wa'lamû annallâha bimâ ta'malûna bashîr"], [234, "وَالَّذِيْنَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُوْنَ اَزْوَاجًا يَّتَرَبَّصْنَ بِاَنْفُسِهِنَّ اَرْبَعَةَ اَشْهُرٍ وَّعَشْرًا ۚ فاِذَا بَلَغْنَ اَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيْمَا فَعَلْنَ فِيْٓ اَنْفُسِهِنَّ بِالْمَعْرُوْفِۗ وَاللّٰهُ بِمَا تَعْمَلُوْنَ خَبِيْرٌ", "walladzîna yutawaffauna mingkum wa yadzarûna azwâjay yatarabbashna bi'anfusihinna arba'ata asy-huriw wa 'asyrâ, fa idzâ balaghna ajalahunna fa lâ junâḫa 'alaikum fîmâ fa'alna fî anfusihinna bil-ma'rûf, wallâhu bimâ ta'malûna khabîr"], [235, "وَلَا جُنَاحَ عَلَيْكُمْ فِيْمَا عَرَّضْتُمْ بِهٖ مِنْ خِطْبَةِ النِّسَاۤءِ اَوْ اَكْنَنْتُمْ فِيْٓ اَنْفُسِكُمْ ۗ عَلِمَ اللّٰهُ اَنَّكُمْ سَتَذْكُرُوْنَهُنَّ وَلٰكِنْ لَّا تُوَاعِدُوْهُنَّ سِرًّا اِلَّآ اَنْ تَقُوْلُوْا قَوْلًا مَّعْرُوْفًا ەۗ وَلَا تَعْزِمُوْا عُقْدَةَ النِّكَاحِ حَتّٰى يَبْلُغَ الْكِتٰبُ اَجَلَهٗ ۗوَاعْلَمُوْٓا اَنَّ اللّٰهَ يَعْلَمُ مَا فِيْٓ اَنْفُسِكُمْ فَاحْذَرُوْهُ ۚوَاعْلَمُوْٓا اَنَّ اللّٰهَ غَفُوْرٌ حَلِيْمٌ ࣖ", "wa lâ junâḫa 'alaikum fîmâ 'arradltum bihî min khithbatin-nisâ'i au aknantum fî anfusikum, 'alimallâhu annakum satadzkurûnahunna wa lâkil lâ tuwâ'idûhunna sirran illâ an taqûlû qaulam ma'rûfâ, wa lâ ta'zimû 'uqdatan-nikâḫi ḫattâ yablughal-kitâbu ajalah, wa'lamû annallâha ya'lamu mâ fî anfusikum faḫdzarûh, wa'lamû annallâha ghafûrun ḫalîm"], [236, "لَا جُنَاحَ عَلَيْكُمْ اِنْ طَلَّقْتُمُ النِّسَاۤءَ مَا لَمْ تَمَسُّوْهُنَّ اَوْ تَفْرِضُوْا لَهُنَّ فَرِيْضَةً ۖ وَّمَتِّعُوْهُنَّ عَلَى الْمُوْسِعِ قَدَرُهٗ وَعَلَى الْمُقْتِرِ قَدَرُهٗ ۚ مَتَاعًا ۢبِالْمَعْرُوْفِۚ حَقًّا عَلَى الْمُحْسِنِيْنَ", "lâ junâḫa 'alaikum in thallaqtumun-nisâ'a mâ lam tamassûhunna au tafridlû lahunna farîdlataw wa matti'ûhunna 'alal-mûsi'i qadaruhû wa 'alal-muqtiri qadaruh, matâ'am bil-ma'rûf, ḫaqqan 'alal-muḫsinîn"], [237, "وَاِنْ طَلَّقْتُمُوْهُنَّ مِنْ قَبْلِ اَنْ تَمَسُّوْهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيْضَةً فَنِصْفُ مَا فَرَضْتُمْ اِلَّآ اَنْ يَّعْفُوْنَ اَوْ يَعْفُوَا الَّذِيْ بِيَدِهٖ عُقْدَةُ النِّكَاحِ ۗ وَاَنْ تَعْفُوْٓا اَقْرَبُ لِلتَّقْوٰىۗ وَلَا تَنْسَوُا الْفَضْلَ بَيْنَكُمْ ۗ اِنَّ اللّٰهَ بِمَا تَعْمَلُوْنَ بَصِيْرٌ", "wa in thallaqtumûhunna ming qabli an tamassûhunna wa qad faradltum lahunna farîdlatan fa nishfu mâ faradltum illâ ay ya'fûna au ya'fuwalladzî biyadihî 'uqdatun-nikâḫ, wa an ta'fû aqrabu lit-taqwâ, wa lâ tansawul-fadlla bainakum, innallâha bimâ ta'malûna bashîr"], [238, "حَافِظُوْا عَلَى الصَّلَوٰتِ وَالصَّلٰوةِ الْوُسْطٰى وَقُوْمُوْا لِلّٰهِ قٰنِتِيْنَ", "ḫâfidhû 'alash-shalawâti wash-shalâtil-wusthâ wa qûmû lillâhi qânitîn"], [239, "فَاِنْ خِفْتُمْ فَرِجَالًا اَوْ رُكْبَانًا ۚ فَاِذَآ اَمِنْتُمْ فَاذْكُرُوا اللّٰهَ كَمَا عَلَّمَكُمْ مَّا لَمْ تَكُوْنُوْا تَعْلَمُوْنَ", "fa in khiftum fa rijâlan au rukbânâ, fa idzâ amintum fadzkurullâha kamâ 'allamakum mâ lam takûnû ta'lamûn"], [240, "وَالَّذِيْنَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُوْنَ اَزْوَاجًاۖ وَّصِيَّةً لِّاَزْوَاجِهِمْ مَّتَاعًا اِلَى الْحَوْلِ غَيْرَ اِخْرَاجٍ ۚ فَاِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِيْ مَا فَعَلْنَ فِيْٓ اَنْفُسِهِنَّ مِنْ مَّعْرُوْفٍۗ وَاللّٰهُ عَزِيْزٌ حَكِيْمٌ", "walladzîna yutawaffauna mingkum wa yadzarûna azwâjaw washiyyatal li'azwâjihim matâ'an ilal-ḫauli ghaira ikhrâj, fa in kharajna fa lâ junâḫa 'alaikum fî mâ fa'alna fî anfusihinna mim ma'rûf, wallâhu 'azîzun ḫakîm"], [241, "وَلِلْمُطَلَّقٰتِ مَتَاعٌ ۢبِالْمَعْرُوْفِۗ حَقًّا عَلَى الْمُتَّقِيْنَ", "wa lil-muthallaqâti matâ'um bil-ma'rûf, ḫaqqan 'alal-muttaqîn"], [242, "كَذٰلِكَ يُبَيِّنُ اللّٰهُ لَكُمْ اٰيٰتِهٖ لَعَلَّكُمْ تَعْقِلُوْنَ ࣖ", "kadzâlika yubayyinullâhu lakum âyâtihî la'allakum ta'qilûn"], [243, "۞ اَلَمْ تَرَ اِلَى الَّذِيْنَ خَرَجُوْا مِنْ دِيَارِهِمْ وَهُمْ اُلُوْفٌ حَذَرَ الْمَوْتِۖ  فَقَالَ لَهُمُ اللّٰهُ مُوْتُوْا ۗ ثُمَّ اَحْيَاهُمْ ۗ اِنَّ اللّٰهَ لَذُوْ فَضْلٍ عَلَى النَّاسِ وَلٰكِنَّ اَكْثَرَ النَّاسِ لَا يَشْكُرُوْنَ", "a lam tara ilalladzîna kharajû min diyârihim wa hum ulûfun ḫadzaral-mauti fa qâla lahumullâhu mûtû, tsumma aḫyâhum, innallâha ladzû fadllin 'alan-nâsi wa lâkinna aktsaran-nâsi lâ yasykurûn"], [244, "وَقَاتِلُوْا فِيْ سَبِيْلِ اللّٰهِ وَاعْلَمُوْٓا اَنَّ اللّٰهَ  سَمِيْعٌ عَلِيْمٌ", "wa qâtilû fî sabîlillâhi wa'lamû annallâha samî'un 'alîm"], [245, "مَنْ ذَا الَّذِيْ يُقْرِضُ اللّٰهَ قَرْضًا حَسَنًا فَيُضٰعِفَهٗ لَهٗٓ اَضْعَافًا كَثِيْرَةً ۗوَاللّٰهُ يَقْبِضُ وَيَبْصُۣطُۖ وَاِلَيْهِ تُرْجَعُوْنَ", "man dzalladzî yuqridlullâha qardlan ḫasanan fa yudlâ'ifahû lahû adl'âfang katsîrah, wallâhu yaqbidlu wa yabshuthu wa ilaihi turja'ûn"], [246, "اَلَمْ تَرَ اِلَى الْمَلَاِ مِنْۢ بَنِيْٓ اِسْرَاۤءِيْلَ مِنْۢ بَعْدِ مُوْسٰىۘ اِذْ قَالُوْا لِنَبِيٍّ لَّهُمُ ابْعَثْ لَنَا مَلِكًا نُّقَاتِلْ فِيْ سَبِيْلِ اللّٰهِ ۗ قَالَ هَلْ عَسَيْتُمْ اِنْ كُتِبَ عَلَيْكُمُ الْقِتَالُ اَلَّا تُقَاتِلُوْا ۗ قَالُوْا وَمَا لَنَآ اَلَّا نُقَاتِلَ فِيْ سَبِيْلِ اللّٰهِ وَقَدْاُخْرِجْنَا مِنْ دِيَارِنَا وَاَبْنَاۤىِٕنَا ۗ فَلَمَّا كُتِبَ عَلَيْهِمُ الْقِتَالُ تَوَلَّوْا اِلَّا قَلِيْلًا مِّنْهُمْ ۗوَاللّٰهُ عَلِيْمٌ ۢبِالظّٰلِمِيْنَ", "a lam tara ilal-mala'i mim banî isrâ'îla mim ba'di mûsâ, idz qâlû linabiyyil lahumub'ats lanâ malikan-nuqâtil fî sabîlillâh, qâla hal 'asaitum ing kutiba 'alaikumul-qitâlu allâ tuqâtilû, qâlû wa mâ lanâ allâ nuqâtila fî sabîlillâhi wa qad ukhrijnâ min diyârinâ wa abnâ'inâ, fa lammâ kutiba 'alaihimul-qitâlu tawallau illâ qalîlam min-hum, wallâhu 'alîmum bidh-dhâlimîn"], [247, "وَقَالَ لَهُمْ نَبِيُّهُمْ اِنَّ اللّٰهَ قَدْ بَعَثَ لَكُمْ طَالُوْتَ مَلِكًا ۗ قَالُوْٓا اَنّٰى يَكُوْنُ لَهُ الْمُلْكُ عَلَيْنَا وَنَحْنُ اَحَقُّ بِالْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِّنَ الْمَالِۗ قَالَ اِنَّ اللّٰهَ اصْطَفٰىهُ عَلَيْكُمْ وَزَادَهٗ بَسْطَةً فِى الْعِلْمِ وَالْجِسْمِ ۗ وَاللّٰهُ يُؤْتِيْ مُلْكَهٗ مَنْ يَّشَاۤءُ ۗ وَاللّٰهُ وَاسِعٌ عَلِيْمٌ", "wa qâla lahum nabiyyuhum innallâha qad ba'atsa lakum thâlûta malikâ, qâlû annâ yakûnu lahul-mulku 'alainâ wa naḫnu aḫaqqu bil-mulki min-hu wa lam yu'ta sa'atam minal-mâl, qâla innallâhashthafâhu 'alaikum wa zâdahû basthatan fil 'ilmi wal-jism, wallâhu yu'tî mulkahû may yasyâ', wallâhu wâsi'un 'alîm"], [248, "وَقَالَ لَهُمْ نَبِيُّهُمْ اِنَّ اٰيَةَ مُلْكِهٖٓ اَنْ يَّأْتِيَكُمُ التَّابُوْتُ فِيْهِ سَكِيْنَةٌ مِّنْ رَّبِّكُمْ وَبَقِيَّةٌ مِّمَّا تَرَكَ اٰلُ مُوْسٰى وَاٰلُ هٰرُوْنَ تَحْمِلُهُ الْمَلٰۤىِٕكَةُ ۗ اِنَّ فِيْ ذٰلِكَ لَاٰيَةً لَّكُمْ اِنْ كُنْتُمْ مُّؤْمِنِيْنَ ࣖ", "wa qâla lahum nabiyyuhum inna âyata mulkihî ay ya'tiyakumut-tâbûtu fîhi sakînatum mir rabbikum wa baqiyyatum mimmâ taraka âlu mûsâ wa âlu hârûna taḫmiluhul-malâ'ikah, inna fî dzâlika la'âyatal lakum ing kuntum mu'minîn"], [249, "فَلَمَّا فَصَلَ طَالُوْتُ بِالْجُنُوْدِ قَالَ اِنَّ اللّٰهَ مُبْتَلِيْكُمْ بِنَهَرٍۚ فَمَنْ شَرِبَ مِنْهُ فَلَيْسَ مِنِّيْۚ وَمَنْ لَّمْ يَطْعَمْهُ فَاِنَّهٗ مِنِّيْٓ اِلَّا مَنِ اغْتَرَفَ غُرْفَةً ۢبِيَدِهٖ ۚ فَشَرِبُوْا مِنْهُ اِلَّا قَلِيْلًا مِّنْهُمْ ۗ فَلَمَّا جَاوَزَهٗ هُوَ وَالَّذِيْنَ اٰمَنُوْا مَعَهٗۙ قَالُوْا لَا طَاقَةَ لَنَا الْيَوْمَ بِجَالُوْتَ وَجُنُوْدِهٖ ۗ قَالَ الَّذِيْنَ يَظُنُّوْنَ اَنَّهُمْ مُّلٰقُوا اللّٰهِ ۙ كَمْ مِّنْ فِئَةٍ قَلِيْلَةٍ غَلَبَتْ فِئَةً كَثِيْرَةً ۢبِاِذْنِ اللّٰهِ ۗ وَاللّٰهُ مَعَ الصّٰبِرِيْنَ", "fa lammâ fashala thâlûtu bil-junûdi qâla innallâha mubtalîkum binahar, fa man syariba min-hu fa laisa minnî, wa mal lam yath'am-hu fa innahû minnî illâ manightarafa ghurfatam biyadih, fa syaribû min-hu illâ qalîlam min-hum, fa lammâ jâwazahû huwa walladzîna âmanû ma'ahû qâlû lâ thâqata lanal-yauma bijâlûta wa junûdih, qâlalladzîna yadhunnûna annahum mulâqullâhi kam min fi'ating qalîlatin ghalabat fi'atang katsîratam bi'idznillâh, wallâhu ma'ash-shâbirîn"], [250, "وَلَمَّا بَرَزُوْا لِجَالُوْتَ وَجُنُوْدِهٖ قَالُوْا رَبَّنَآ اَفْرِغْ عَلَيْنَا صَبْرًا وَّثَبِّتْ اَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكٰفِرِيْنَ ۗ", "wa lammâ barazû lijâlûta wa junûdihî qâlû rabbanâ afrigh 'alainâ shabraw wa tsabbit aqdâmanâ wanshurnâ 'alal-qaumil-kâfirîn"], [251, "فَهَزَمُوْهُمْ بِاِذْنِ اللّٰهِ  ۗوَقَتَلَ دَاوٗدُ جَالُوْتَ وَاٰتٰىهُ اللّٰهُ الْمُلْكَ وَالْحِكْمَةَ وَعَلَّمَهٗ مِمَّا يَشَاۤءُ ۗ وَلَوْلَا دَفْعُ اللّٰهِ النَّاسَ بَعْضَهُمْ بِبَعْضٍ لَّفَسَدَتِ الْاَرْضُ وَلٰكِنَّ اللّٰهَ ذُوْ فَضْلٍ عَلَى الْعٰلَمِيْنَ", "fa hazamûhum bi'idznillâh, wa qatala dâwûdu jâlûta wa âtâhullâhul-mulka wal-ḫikmata wa 'allamahû mimmâ yasyâ', walau lâ daf'ullâhin-nâsa ba'dlahum biba'dlil lafasadatil-ardlu wa lâkinnallâha dzû fadllin 'alal-'âlamîn"], [252, "تِلْكَ اٰيٰتُ اللّٰهِ نَتْلُوْهَا عَلَيْكَ بِالْحَقِّ ۗ وَاِنَّكَ لَمِنَ الْمُرْسَلِيْنَ  ۔", "tilka âyâtullâhi natlûhâ 'alaika bil-ḫaqq, wa innaka laminal-mursalîn"], [253, "تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلٰى بَعْضٍۘ مِنْهُمْ مَّنْ كَلَّمَ اللّٰهُ وَرَفَعَ بَعْضَهُمْ دَرَجٰتٍۗ وَاٰتَيْنَا عِيْسَى ابْنَ مَرْيَمَ الْبَيِّنٰتِ وَاَيَّدْنٰهُ بِرُوْحِ الْقُدُسِۗ وَلَوْ شَاۤءَ اللّٰهُ مَا اقْتَتَلَ الَّذِيْنَ مِنْۢ بَعْدِهِمْ مِّنْۢ بَعْدِ مَا جَاۤءَتْهُمُ الْبَيِّنٰتُ وَلٰكِنِ اخْتَلَفُوْا فَمِنْهُمْ مَّنْ اٰمَنَ وَمِنْهُمْ مَّنْ كَفَرَ ۗوَلَوْ شَاۤءَ اللّٰهُ مَا اقْتَتَلُوْاۗ وَلٰكِنَّ اللّٰهَ يَفْعَلُ مَا يُرِيْدُ ࣖ", "tilkar-rusulu fadldlalnâ ba'dlahum 'alâ ba'dl, min-hum mang kallamallâhu wa rafa'a ba'dlahum darajât, wa âtainâ 'îsabna maryamal-bayyinâti wa ayyadnâhu birûḫil-qudus, walau syâ'allâhu maqtatalalladzîna mim ba'dihim mim ba'di mâ jâ'at-humul-bayyinâtu wa lâkinikhtalafû fa min-hum man âmana wa min-hum mang kafar, walau syâ'allâhu maqtatalû, wa lâkinnallâha yaf'alu mâ yurîd"], [254, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْٓا اَنْفِقُوْا مِمَّا رَزَقْنٰكُمْ مِّنْ قَبْلِ اَنْ يَّأْتِيَ يَوْمٌ لَّا بَيْعٌ فِيْهِ وَلَا خُلَّةٌ وَّلَا شَفَاعَةٌ  ۗوَالْكٰفِرُوْنَ هُمُ الظّٰلِمُوْنَ", "yâ ayyuhalladzîna âmanû anfiqû mimmâ razaqnâkum ming qabli ay ya'tiya yaumul lâ bai'un fîhi wa lâ khullatuw wa lâ syafâ'ah, wal-kâfirûna humudh-dhâlimûn"], [255, "اَللّٰهُ لَآ اِلٰهَ اِلَّا هُوَۚ اَلْحَيُّ الْقَيُّوْمُ ەۚ لَا تَأْخُذُهٗ سِنَةٌ وَّلَا نَوْمٌۗ  لَهٗ مَا فِى السَّمٰوٰتِ وَمَا فِى الْاَرْضِۗ مَنْ ذَا الَّذِيْ يَشْفَعُ عِنْدَهٗٓ اِلَّا بِاِذْنِهٖۗ يَعْلَمُ مَا بَيْنَ اَيْدِيْهِمْ وَمَا خَلْفَهُمْۚ وَلَا يُحِيْطُوْنَ بِشَيْءٍ مِّنْ عِلْمِهٖٓ اِلَّا بِمَا شَاۤءَۚ وَسِعَ كُرْسِيُّهُ السَّمٰوٰتِ وَالْاَرْضَۚ وَلَا يَـُٔوْدُهٗ حِفْظُهُمَاۚ وَهُوَ الْعَلِيُّ الْعَظِيْمُ", "allâhu lâ ilâha illâ huw, al-ḫayyul-qayyûm, lâ ta'khudzuhû sinatuw wa lâ na'ûm, lahû mâ fis-samâwâti wa mâ fil-ardl, man dzalladzî yasyfa'u 'indahû illâ bi'idznih, ya'lamu mâ baina aidîhim wa mâ khalfahum, wa lâ yuḫîthûna bisyai'im min 'ilmihî illâ bimâ syâ', wasi'a kursiyyuhus-samâwâti wal-ardl, wa lâ ya'ûduhû ḫifdhuhumâ, wa huwal-'aliyyul-'adhîm"], [256, "لَآ اِكْرَاهَ فِى الدِّيْنِۗ  قَدْ تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَنْ يَّكْفُرْ بِالطَّاغُوْتِ وَيُؤْمِنْۢ بِاللّٰهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقٰى لَا انْفِصَامَ لَهَا ۗوَاللّٰهُ سَمِيْعٌ عَلِيْمٌ", "lâ ikrâha fid-dîn, qat tabayyanar-rusydu minal-ghayy, fa may yakfur bith-thâghûti wa yu'mim billâhi fa qadistamsaka bil-'urwatil-wutsqâ lanfishâma lahâ, wallâhu samî'un 'alîm"], [257, "اَللّٰهُ وَلِيُّ الَّذِيْنَ اٰمَنُوْا يُخْرِجُهُمْ مِّنَ الظُّلُمٰتِ اِلَى النُّوْرِۗ وَالَّذِيْنَ كَفَرُوْٓا اَوْلِيَاۤؤُهُمُ الطَّاغُوْتُ يُخْرِجُوْنَهُمْ مِّنَ النُّوْرِ اِلَى الظُّلُمٰتِۗ  اُولٰۤىِٕكَ اَصْحٰبُ النَّارِۚ هُمْ فِيْهَا خٰلِدُوْنَ ࣖ", "allâhu waliyyulladzîna âmanû yukhrijuhum minadh-dhulumâti ilan-nûr, walladzîna kafarû auliyâ'uhumuth-thâghûtu yukhrijûnahum minan-nûri iladh-dhulumât, ulâ'ika ash-ḫâbun-nâr, hum fîhâ khâlidûn"], [258, "اَلَمْ تَرَ اِلَى الَّذِيْ حَاۤجَّ اِبْرٰهٖمَ فِيْ رَبِّهٖٓ اَنْ اٰتٰىهُ اللّٰهُ الْمُلْكَ ۘ اِذْ قَالَ اِبْرٰهٖمُ رَبِّيَ الَّذِيْ يُحْيٖ وَيُمِيْتُۙ قَالَ اَنَا۠ اُحْيٖ وَاُمِيْتُ ۗ قَالَ اِبْرٰهٖمُ فَاِنَّ اللّٰهَ يَأْتِيْ بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ فَبُهِتَ الَّذِيْ كَفَرَ ۗوَاللّٰهُ لَا يَهْدِى الْقَوْمَ الظّٰلِمِيْنَۚ", "a lam tara ilalladzî ḫâjja ibrâhîma fî rabbihî an âtâhullâhul-mulk, idz qâla ibrâhîmu rabbiyalladzî yuḫyî wa yumîtu qâla ana uḫyî wa umît, qâla ibrâhîmu fa innallâha ya'tî bisy-syamsi minal-masyriqi fa'ti bihâ minal-maghribi fa buhitalladzî kafar, wallâhu lâ yahdil-qaumadh-dhâlimîn"], [259, "اَوْ كَالَّذِيْ مَرَّ عَلٰى قَرْيَةٍ وَّهِيَ خَاوِيَةٌ عَلٰى عُرُوْشِهَاۚ قَالَ اَنّٰى يُحْيٖ هٰذِهِ اللّٰهُ بَعْدَ مَوْتِهَا ۚ فَاَمَاتَهُ اللّٰهُ مِائَةَ عَامٍ ثُمَّ بَعَثَهٗ ۗ قَالَ كَمْ لَبِثْتَ ۗ قَالَ لَبِثْتُ يَوْمًا اَوْ بَعْضَ يَوْمٍۗ قَالَ بَلْ لَّبِثْتَ مِائَةَ عَامٍ فَانْظُرْ اِلٰى طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۚ وَانْظُرْ اِلٰى حِمَارِكَۗ وَلِنَجْعَلَكَ اٰيَةً لِّلنَّاسِ وَانْظُرْ اِلَى الْعِظَامِ كَيْفَ نُنْشِزُهَا ثُمَّ نَكْسُوْهَا لَحْمًا ۗ فَلَمَّا تَبَيَّنَ لَهٗ ۙ قَالَ اَعْلَمُ اَنَّ اللّٰهَ عَلٰى كُلِّ شَيْءٍ قَدِيْرٌ", "au kalladzî marra 'alâ qaryatiw wa hiya khâwiyatun 'alâ 'urûsyihâ, qâla annâ yuḫyî hâdzihillâhu ba'da mautihâ, fa amâtahullâhu mi'ata 'âmin tsumma ba'atsah, qâla kam labitst, qâla labitstu yauman au ba'dla yaûm, qâla bal labitsta mi'ata 'âmin fandhur ilâ tha'âmika wa syarâbika lam yatasannah, wandhur ilâ ḫimârik, wa linaj'alaka âyatal lin-nâsi wandhur ilal-'idhâmi kaifa nunsyizuhâ tsumma naksûhâ laḫmâ, fa lammâ tabayyana lahû qâla a'lamu annallâha 'alâ kulli syai'ing qadîr"], [260, "وَاِذْ قَالَ اِبْرٰهٖمُ رَبِّ اَرِنِيْ كَيْفَ تُحْيِ الْمَوْتٰىۗ قَالَ اَوَلَمْ تُؤْمِنْ ۗقَالَ بَلٰى وَلٰكِنْ لِّيَطْمَىِٕنَّ قَلْبِيْ ۗقَالَ فَخُذْ اَرْبَعَةً مِّنَ الطَّيْرِفَصُرْهُنَّ اِلَيْكَ ثُمَّ اجْعَلْ عَلٰى كُلِّ جَبَلٍ مِّنْهُنَّ جُزْءًا ثُمَّ ادْعُهُنَّ يَأْتِيْنَكَ سَعْيًا ۗوَاعْلَمْ اَنَّ اللّٰهَ عَزِيْزٌحَكِيْمٌ ࣖ", "wa idz qâla ibrâhîmu rabbi arinî kaifa tuḫyil-mautâ, qâla a wa lam tu'min, qâla balâ wa lâkil liyathma'inna qalbî, qâla fakhudz arba'atam minath-thairi fa shur-hunna ilaika tsummaj'al 'alâ kulli jabalim min-hunna juz'an tsummad'uhunna ya'tînaka sa'yâ, wa'lam annallâha 'azîzun ḫakîm"], [261, "مَثَلُ الَّذِيْنَ يُنْفِقُوْنَ اَمْوَالَهُمْ فِيْ سَبِيْلِ اللّٰهِ كَمَثَلِ حَبَّةٍ اَنْۢبَتَتْ سَبْعَ سَنَابِلَ فِيْ كُلِّ سُنْۢبُلَةٍ مِّائَةُ حَبَّةٍ ۗ وَاللّٰهُ يُضٰعِفُ لِمَنْ يَّشَاۤءُ ۗوَاللّٰهُ وَاسِعٌ عَلِيْمٌ", "matsalulladzîna yunfiqûna amwâlahum fî sabîlillâhi kamatsali ḫabbatin ambatat sab'a sanâbila fî kulli sumbulatim mi'atu ḫabbah, wallâhu yudlâ'ifu limay yasyâ', wallâhu wâsi'un 'alîm"], [262, "اَلَّذِيْنَ يُنْفِقُوْنَ اَمْوَالَهُمْ فِيْ سَبِيْلِ اللّٰهِ ثُمَّ لَا يُتْبِعُوْنَ مَآ اَنْفَقُوْا مَنًّا وَّلَآ اَذًىۙ  لَّهُمْ اَجْرُهُمْ عِنْدَ رَبِّهِمْۚ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُوْنَ", "alladzîna yunfiqûna amwâlahum fî sabîlillâhi tsumma lâ yutbi'ûna mâ anfaqû mannaw wa lâ adzal lahum ajruhum 'inda rabbihim, wa lâ khaufun 'alaihim wa lâ hum yaḫzanûn"], [263, "۞ قَوْلٌ مَّعْرُوْفٌ وَّمَغْفِرَةٌ خَيْرٌ مِّنْ صَدَقَةٍ يَّتْبَعُهَآ اَذًى ۗ وَاللّٰهُ غَنِيٌّ حَلِيْمٌ", "qaulum ma'rûfuw wa maghfiratun khairum min shadaqatiy yatba'uhâ adzâ, wallâhu ghaniyyun ḫalîm"], [264, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْا لَا تُبْطِلُوْا صَدَقٰتِكُمْ بِالْمَنِّ وَالْاَذٰىۙ  كَالَّذِيْ يُنْفِقُ مَالَهٗ رِئَاۤءَ النَّاسِ وَلَا يُؤْمِنُ بِاللّٰهِ وَالْيَوْمِ الْاٰخِرِۗ  فَمَثَلُهٗ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌ فَاَصَابَهٗ وَابِلٌ فَتَرَكَهٗ صَلْدًا ۗ  لَا يَقْدِرُوْنَ عَلٰى شَيْءٍ مِّمَّا كَسَبُوْا ۗ وَاللّٰهُ لَا يَهْدِى الْقَوْمَ الْكٰفِرِيْنَ", "yâ ayyuhalladzîna âmanû lâ tubthilû shadaqâtikum bil-manni wal-adzâ kalladzî yunfiqu mâlahû ri'â'an-nâsi wa lâ yu'minu billâhi wal-yaumil-âkhir, fa matsaluhû kamatsali shafwânin 'alaihi turâbun fa ashâbahû wâbilun fa tarakahû shaldâ, lâ yaqdirûna 'alâ syai'im mimmâ kasabû, wallâhu lâ yahdil-qaumal-kâfirîn"], [265, "وَمَثَلُ الَّذِيْنَ يُنْفِقُوْنَ اَمْوَالَهُمُ ابْتِغَاۤءَ مَرْضَاتِ اللّٰهِ وَتَثْبِيْتًا مِّنْ اَنْفُسِهِمْ كَمَثَلِ جَنَّةٍۢ بِرَبْوَةٍ اَصَابَهَا وَابِلٌ فَاٰتَتْ اُكُلَهَا ضِعْفَيْنِۚ فَاِنْ لَّمْ يُصِبْهَا وَابِلٌ فَطَلٌّ  ۗوَاللّٰهُ بِمَا تَعْمَلُوْنَ بَصِيْرٌ", "wa matsalulladzîna yunfiqûna amwâlahumubtighâ'a mardlâtillâhi wa tatsbîtam min anfusihim kamatsali jannatim birabwatin ashâbahâ wâbilun fa âtat ukulahâ dli'faîn, fa il lam yushib-hâ wâbilun fa thall, wallâhu bimâ ta'malûna bashîr"], [266, "اَيَوَدُّ اَحَدُكُمْ اَنْ تَكُوْنَ لَهٗ جَنَّةٌ مِّنْ نَّخِيْلٍ وَّاَعْنَابٍ تَجْرِيْ مِنْ تَحْتِهَا الْاَنْهٰرُۙ  لَهٗ فِيْهَا مِنْ كُلِّ الثَّمَرٰتِۙ وَاَصَابَهُ الْكِبَرُ وَلَهٗ ذُرِّيَّةٌ ضُعَفَاۤءُۚ فَاَصَابَهَآ اِعْصَارٌ فِيْهِ نَارٌ فَاحْتَرَقَتْ ۗ  كَذٰلِكَ يُبَيِّنُ اللّٰهُ لَكُمُ الْاٰيٰتِ لَعَلَّكُمْ تَتَفَكَّرُوْنَ ࣖ", "a yawaddu aḫadukum an takûna lahû jannatum min nakhîliw wa a'nâbin tajrî min taḫtihal-an-hâru lahû fîhâ ming kullits-tsamarâti wa ashâbahul-kibaru wa lahû dzurriyyatun dlu'afâ', fa ashâbahâ i'shârun fîhi nârun faḫtaraqat, kadzâlika yubayyinullâhu lakumul-âyâti la'allakum tatafakkarûn"], [267, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْٓا اَنْفِقُوْا مِنْ طَيِّبٰتِ مَا كَسَبْتُمْ وَمِمَّآ اَخْرَجْنَا لَكُمْ مِّنَ الْاَرْضِ ۗ وَلَا تَيَمَّمُوا الْخَبِيْثَ مِنْهُ تُنْفِقُوْنَ وَلَسْتُمْ بِاٰخِذِيْهِ اِلَّآ اَنْ تُغْمِضُوْا فِيْهِ ۗ وَاعْلَمُوْٓا اَنَّ اللّٰهَ غَنِيٌّ حَمِيْدٌ", "yâ ayyuhalladzîna âmanû anfiqû min thayyibâti mâ kasabtum wa mimmâ akhrajnâ lakum minal-ardl, wa lâ tayammamul-khabîtsa min-hu tunfiqûna wa lastum bi'âkhidzîhi illâ an tughmidlû fîh, wa'lamû annallâha ghaniyyun ḫamîd"], [268, "اَلشَّيْطٰنُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُمْ بِالْفَحْشَاۤءِ ۚ وَاللّٰهُ يَعِدُكُمْ مَّغْفِرَةً مِّنْهُ وَفَضْلًا ۗ وَاللّٰهُ وَاسِعٌ عَلِيْمٌ ۖ", "asy-syaithânu ya'idukumul-faqra wa ya'murukum bil-faḫsyâ', wallâhu ya'idukum maghfiratam min-hu wa fadllâ, wallâhu wâsi'un 'alîm"], [269, "يُّؤْتِى الْحِكْمَةَ مَنْ يَّشَاۤءُ ۚ وَمَنْ يُّؤْتَ الْحِكْمَةَ فَقَدْ اُوْتِيَ خَيْرًا كَثِيْرًا ۗ وَمَا يَذَّكَّرُ اِلَّآ اُولُوا الْاَلْبَابِ", "yu'til-ḫikmata may yasyâ', wa may yu'tal-ḫikmata fa qad ûtiya khairang katsîrâ, wa mâ yadzdzakkaru illâ ulul-albâb"], [270, "وَمَآ اَنْفَقْتُمْ مِّنْ نَّفَقَةٍ اَوْ نَذَرْتُمْ مِّنْ نَّذْرٍ فَاِنَّ اللّٰهَ يَعْلَمُهٗ ۗ وَمَا لِلظّٰلِمِيْنَ مِنْ اَنْصَارٍ", "wa mâ anfaqtum min nafaqatin au nadzartum min nadzrin fa innallâha ya'lamuh, wa mâ lidh-dhâlimîna min anshâr"], [271, "اِنْ تُبْدُوا الصَّدَقٰتِ فَنِعِمَّا هِيَۚ وَاِنْ تُخْفُوْهَا وَتُؤْتُوْهَا الْفُقَرَاۤءَ فَهُوَ خَيْرٌ لَّكُمْ ۗ وَيُكَفِّرُ عَنْكُمْ مِّنْ سَيِّاٰتِكُمْ ۗ وَاللّٰهُ بِمَا تَعْمَلُوْنَ خَبِيْرٌ", "in tubdush-shadaqâti fa ni'immâ hiy, wa in tukhfûhâ wa tu'tûhal-fuqarâ'a fa huwa khairul lakum, wa yukaffiru 'angkum min sayyi'âtikum, wallâhu bimâ ta'malûna khabîr"], [272, "۞ لَيْسَ عَلَيْكَ هُدٰىهُمْ وَلٰكِنَّ اللّٰهَ يَهْدِيْ مَنْ يَّشَاۤءُ ۗوَمَا تُنْفِقُوْا مِنْ خَيْرٍ فَلِاَنْفُسِكُمْ ۗوَمَا تُنْفِقُوْنَ اِلَّا ابْتِغَاۤءَ وَجْهِ اللّٰهِ ۗوَمَا تُنْفِقُوْا مِنْ خَيْرٍ يُّوَفَّ اِلَيْكُمْ وَاَنْتُمْ لَا تُظْلَمُوْنَ", "laisa 'alaika hudâhum wa lâkinnallâha yahdî may yasyâ', wa mâ tunfiqû min khairin fa li'anfusikum, wa mâ tunfiqûna illabtighâ'a waj-hillâh, wa mâ tunfiqû min khairiy yuwaffa ilaikum wa antum lâ tudhlamûn"], [273, "لِلْفُقَرَاۤءِ الَّذِيْنَ اُحْصِرُوْا فِيْ سَبِيْلِ اللّٰهِ لَا يَسْتَطِيْعُوْنَ ضَرْبًا فِى الْاَرْضِۖ يَحْسَبُهُمُ الْجَاهِلُ اَغْنِيَاۤءَ مِنَ التَّعَفُّفِۚ  تَعْرِفُهُمْ بِسِيْمٰهُمْۚ  لَا يَسْـَٔلُوْنَ النَّاسَ اِلْحَافًا ۗوَمَا تُنْفِقُوْا مِنْ خَيْرٍ فَاِنَّ اللّٰهَ بِهٖ عَلِيْمٌ ࣖ", "lil-fuqarâ'illadzîna uḫshirû fî sabîlillâhi lâ yastathî'ûna dlarban fil-ardli yaḫsabuhumul-jâhilu aghniyâ'a minat-ta'affuf, ta'rifuhum bisîmâhum, lâ yas'alûnan-nâsa il-ḫâfâ, wa mâ tunfiqû min khairin fa innallâha bihî 'alîm"], [274, "اَلَّذِيْنَ يُنْفِقُوْنَ اَمْوَالَهُمْ بِالَّيْلِ وَالنَّهَارِ سِرًّا وَّعَلَانِيَةً فَلَهُمْ اَجْرُهُمْ عِنْدَ رَبِّهِمْۚ  وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُوْنَ", "alladzîna yunfiqûna amwâlahum bil-laili wan-nahâri sirraw wa 'alâniyatan fa lahum ajruhum 'inda rabbihim, wa lâ khaufun 'alaihim wa lâ hum yaḫzanûn"], [275, "اَلَّذِيْنَ يَأْكُلُوْنَ الرِّبٰوا لَا يَقُوْمُوْنَ اِلَّا كَمَا يَقُوْمُ الَّذِيْ يَتَخَبَّطُهُ الشَّيْطٰنُ مِنَ الْمَسِّۗ ذٰلِكَ بِاَنَّهُمْ قَالُوْٓا اِنَّمَا الْبَيْعُ مِثْلُ الرِّبٰواۘ وَاَحَلَّ اللّٰهُ الْبَيْعَ وَحَرَّمَ الرِّبٰواۗ  فَمَنْ جَاۤءَهٗ مَوْعِظَةٌ مِّنْ رَّبِّهٖ فَانْتَهٰى فَلَهٗ مَا سَلَفَۗ وَاَمْرُهٗٓ اِلَى اللّٰهِ ۗ وَمَنْ عَادَ فَاُولٰۤىِٕكَ اَصْحٰبُ النَّارِ ۚ هُمْ فِيْهَا خٰلِدُوْنَ", "alladzîna ya'kulûnar-ribâ lâ yaqûmûna illâ kamâ yaqûmulladzî yatakhabbathuhusy-syaithânu minal-mass, dzâlika bi'annahum qâlû innamal-bai'u mitslur-ribâ, wa aḫallallâhul-bai'a wa ḫarramar-ribâ, fa man jâ'ahû mau'idhatum mir rabbihî fantahâ fa lahû mâ salaf, wa amruhû ilallâh, wa man 'âda fa ulâ'ika ash-ḫâbun-nâr, hum fîhâ khâlidûn"], [276, "يَمْحَقُ اللّٰهُ الرِّبٰوا وَيُرْبِى الصَّدَقٰتِ ۗ وَاللّٰهُ لَا يُحِبُّ كُلَّ كَفَّارٍ اَثِيْمٍ", "yam-ḫaqullâhur-ribâ wa yurbish-shadaqât, wallâhu lâ yuḫibbu kulla kaffârin atsîm"], [277, "اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ وَاَقَامُوا الصَّلٰوةَ وَاٰتَوُا الزَّكٰوةَ لَهُمْ اَجْرُهُمْ عِنْدَ رَبِّهِمْۚ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُوْنَ", "innalladzîna âmanû wa 'amilush-shâliḫâti wa aqâmush-shalâta wa âtawuz-zakâta lahum ajruhum 'inda rabbihim, wa lâ khaufun 'alaihim wa lâ hum yaḫzanûn"], [278, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوا اتَّقُوا اللّٰهَ وَذَرُوْا مَا بَقِيَ مِنَ الرِّبٰوٓا اِنْ كُنْتُمْ مُّؤْمِنِيْنَ", "yâ ayyuhalladzîna âmanuttaqullâha wa dzarû mâ baqiya minar-ribâ ing kuntum mu'minîn"], [279, "فَاِنْ لَّمْ تَفْعَلُوْا فَأْذَنُوْا بِحَرْبٍ مِّنَ اللّٰهِ وَرَسُوْلِهٖۚ وَاِنْ تُبْتُمْ فَلَكُمْ رُءُوْسُ اَمْوَالِكُمْۚ  لَا تَظْلِمُوْنَ وَلَا تُظْلَمُوْنَ", "fa il lam taf'alû fa'dzanû biḫarbim minallâhi wa rasûlih, wa in tubtum fa lakum ru'ûsu amwâlikum, lâ tadhlimûna wa lâ tudhlamûn"], [280, "وَاِنْ كَانَ ذُوْ عُسْرَةٍ فَنَظِرَةٌ اِلٰى مَيْسَرَةٍ ۗ وَاَنْ تَصَدَّقُوْا خَيْرٌ لَّكُمْ اِنْ كُنْتُمْ تَعْلَمُوْنَ", "wa ing kâna dzû 'usratin fa nadhiratun ilâ maisarah, wa an tashaddaqû khairul lakum ing kuntum ta'lamûn"], [281, "وَاتَّقُوْا يَوْمًا تُرْجَعُوْنَ فِيْهِ اِلَى اللّٰهِ ۗثُمَّ تُوَفّٰى كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُوْنَ ࣖ", "wattaqû yauman turja'ûna fîhi ilallâh, tsumma tuwaffâ kullu nafsim mâ kasabat wa hum lâ yudhlamûn"], [282, "يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوْٓا اِذَا تَدَايَنْتُمْ بِدَيْنٍ اِلٰٓى اَجَلٍ مُّسَمًّى فَاكْتُبُوْهُۗ وَلْيَكْتُبْ بَّيْنَكُمْ كَاتِبٌۢ بِالْعَدْلِۖ وَلَا يَأْبَ كَاتِبٌ اَنْ يَّكْتُبَ كَمَا عَلَّمَهُ اللّٰهُ فَلْيَكْتُبْۚ وَلْيُمْلِلِ الَّذِيْ عَلَيْهِ الْحَقُّ وَلْيَتَّقِ اللّٰهَ رَبَّهٗ وَلَا يَبْخَسْ مِنْهُ شَيْـًٔاۗ  فَاِنْ كَانَ الَّذِيْ عَلَيْهِ الْحَقُّ سَفِيْهًا اَوْ ضَعِيْفًا اَوْ لَا يَسْتَطِيْعُ اَنْ يُّمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهٗ بِالْعَدْلِۗ وَاسْتَشْهِدُوْا شَهِيْدَيْنِ مِنْ رِّجَالِكُمْۚ فَاِنْ لَّمْ يَكُوْنَا رَجُلَيْنِ فَرَجُلٌ وَّامْرَاَتٰنِ مِمَّنْ تَرْضَوْنَ مِنَ الشُّهَدَۤاءِ اَنْ تَضِلَّ اِحْدٰىهُمَا فَتُذَكِّرَ اِحْدٰىهُمَا الْاُخْرٰىۗ وَلَا يَأْبَ الشُّهَدَۤاءُ اِذَا مَا دُعُوْا ۗ وَلَا تَسْـَٔمُوْٓا اَنْ تَكْتُبُوْهُ صَغِيْرًا اَوْ كَبِيْرًا اِلٰٓى اَجَلِهٖۗ ذٰلِكُمْ اَقْسَطُ عِنْدَ اللّٰهِ وَاَقْوَمُ لِلشَّهَادَةِ وَاَدْنٰىٓ اَلَّا تَرْتَابُوْٓا اِلَّآ اَنْ تَكُوْنَ تِجَارَةً حَاضِرَةً تُدِيْرُوْنَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ اَلَّا تَكْتُبُوْهَاۗ وَاَشْهِدُوْٓا اِذَا تَبَايَعْتُمْ ۖ وَلَا يُضَاۤرَّ كَاتِبٌ وَّلَا شَهِيْدٌ ەۗ وَاِنْ تَفْعَلُوْا فَاِنَّهٗ فُسُوْقٌۢ بِكُمْ ۗ وَاتَّقُوا اللّٰهَ ۗ وَيُعَلِّمُكُمُ اللّٰهُ ۗ وَاللّٰهُ بِكُلِّ شَيْءٍ عَلِيْمٌ", "yâ ayyuhalladzîna âmanû idzâ tadâyantum bidainin ilâ ajalim musamman faktubûh, walyaktub bainakum kâtibum bil-'adli wa lâ ya'ba kâtibun ay yaktuba kamâ 'allamahullâhu falyaktub, walyumlililladzî 'alaihil-ḫaqqu walyattaqillâha rabbahû wa lâ yabkhas min-hu syai'â, fa ing kânalladzî 'alaihil-ḫaqqu safîhan au dla'îfan au lâ yastathî'u ay yumilla huwa falyumlil waliyyuhû bil-'adl, wastasy-hidû syahîdaini mir rijâlikum, fa il lam yakûnâ rajulaini fa rajuluw wamra'atâni mim man tardlauna minasy-syuhadâ'i an tadlilla iḫdâhumâ fa tudzakkira iḫdâhumal-ukhrâ, wa lâ ya'basy-syuhadâ'u idzâ mâ du'û, wa lâ tas'amû an taktubûhu shaghîran au kabîran ilâ ajalih, dzâlikum aqsathu 'indallâhi wa aqwamu lisy-syahâdati wa adnâ allâ tartâbû illâ an takûna tijâratan ḫâdliratan tudîrûnahâ bainakum fa laisa 'alaikum junâḫun allâ taktubûhâ, wa asy-hidû idzâ tabâya'tum wa lâ yudlârra kâtibuw wa lâ syahîd, wa in taf'alû fa innahû fusûqum bikum, wattaqullâh, wa yu'allimukumullâh, wallâhu bikulli syai'in 'alîm"], [283, "۞ وَاِنْ كُنْتُمْ عَلٰى سَفَرٍ وَّلَمْ تَجِدُوْا كَاتِبًا فَرِهٰنٌ مَّقْبُوْضَةٌ  ۗفَاِنْ اَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِى اؤْتُمِنَ اَمَانَتَهٗ وَلْيَتَّقِ اللّٰهَ رَبَّهٗ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَۗ وَمَنْ يَّكْتُمْهَا فَاِنَّهٗٓ اٰثِمٌ قَلْبُهٗ ۗ وَاللّٰهُ بِمَا تَعْمَلُوْنَ عَلِيْمٌ ࣖ", "wa ing kuntum 'alâ safariw wa lam tajidû kâtiban fa rihânum maqbûdlah, fa in amina ba'dlukum ba'dlan falyu'addilladzi'tumina amânatahû walyattaqillâha rabbah, wa lâ taktumusy-syahâdah, wa may yaktum-hâ fa innahû âtsimung qalbuh, wallâhu bimâ ta'malûna 'alîm"], [284, "لِلّٰهِ مَا فِى السَّمٰوٰتِ وَمَا فِى الْاَرْضِ ۗ وَاِنْ تُبْدُو
