  mama: { name: "Mama", ids: ["yasin", "mulk", "kahfi", "kahfifull", "baqarah", "baqarahfull", "anam", "taubah", "sad", "pilihan", "rahman"], mode: "both",
          desc: "Yasin · Al-Mulk · Al-Kahfi · Al-Baqarah · Al-An'am · At-Taubah · Sad · Ayat Pilihan · Ar-Rahman" }
};
const hashId = location.hash.replace("#", "").toLowerCase();
const PID = PROFILES[hashId] ? hashId : "mama";
const PROFILE = PROFILES[PID];
// kahfiJumaatOnly profiles: short Al-Kahfi (1-10, 100-110) is read on Jumaat only
const JO = !!PROFILE.kahfiJumaatOnly;
if (!PROFILES[hashId]) document.body.classList.add("pick");
     // no person chosen yet -> show picker
window.addEventListener("hashchange", () => location.reload());
const SURAHS = PROFILE.ids.map(id => {
  const s = ALL_SURAHS.find(x => x.id === id);
  return Object.assign({}, s, { name: (PROFILE.rename && PROFILE.rename[id]) || s.name });
});

// settings are kept separately for each person (key is prefixed with the profile id)
const store = {
  get(k, d){ try{ const v = localStorage.getItem(PID + "_" + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PID + "_" + k, JSON.stringify(v)); }catch(e){} }
};

const now = new Date();

// ---- Jumaat follows the Islamic day: starts Thursday at Maghrib, ends Friday at Maghrib.
// Maghrib is calculated (sunset + 2 min) for the place chosen on the page (remembered per device).
const PLACES = {
  kamunting: { name: "Kamunting",     lat: 4.850, lng: 100.740 },   // default
  kulim:     { name: "Kulim",         lat: 5.365, lng: 100.562 },
  sgbuloh:   { name: "Sungai Buloh",  lat: 3.210, lng: 101.580 },
  iskandar:  { name: "Seri Iskandar", lat: 4.385, lng: 100.975 }
};
let placeId = store.get("q_place", "kamunting");
if (!PLACES[placeId]) placeId = "kamunting";
const LAT = PLACES[placeId].lat, LNG = PLACES[placeId].lng;
function maghrib(d){
  const rad = Math.PI / 180;
  const n = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
  const decl = -23.44 * Math.cos(2 * Math.PI / 365 * (n + 10));
  const B = 2 * Math.PI * (n - 81) / 364;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);      // minutes
  const ha = Math.acos((Math.sin(-0.833 * rad) - Math.sin(LAT * rad) * Math.sin(decl * rad)) /
                       (Math.cos(LAT * rad) * Math.cos(decl * rad))) / rad;          // degrees
  const sunsetUtcMin = 720 - 4 * LNG - eot + 4 * ha + 2;
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, Math.round(sunsetUtcMin)));
}
const mag = maghrib(now);
const magText = String(mag.getHours()).padStart(2, "0") + ":" + String(mag.getMinutes()).padStart(2, "0");
const malamJumaat = now.getDay() === 4 && now >= mag;          // Thursday after Maghrib
const isFriday = malamJumaat || (now.getDay() === 5 && now < mag);
// the Friday date this Jumaat belongs to (so the Al-Kahfi tick survives midnight)
const jd = new Date(now); if (malamJumaat) jd.setDate(jd.getDate() + 1);
const jumaatKey = "J" + jd.getFullYear() + "-" + (jd.getMonth()+1) + "-" + jd.getDate();
const dayKey = now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate();
const HARI = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
const BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];

// ---- state
let current = store.get("q_surah", SURAHS[0].id);
let arSize  = store.get("q_ar", 28);
let laSize  = store.get("q_la2", PROFILE.la || 20);          // Latin size, separate from Arabic
let mode    = store.get("q_mode", PROFILE.mode);      // both | latin | arab
let doneMap = store.get("q_done", {});           // { dayKey: {mulk:true,...} }
if (!SURAHS.some(x => x.id === current)) current = SURAHS[0].id;
if (!doneMap[dayKey]) doneMap = { [dayKey]: {}, kahfi: doneMap.kahfi }; // reset every new day
// Al-Kahfi is ticked per Jumaat (Thursday Maghrib to Friday Maghrib), the others per day
const JID = JO ? "kahfi" : "kahfifull";          // the Al-Kahfi set that belongs to Jumaat
const isDone  = id => (id === JID && isFriday) ? doneMap.kahfi === jumaatKey : !!doneMap[dayKey][id];
const setDone = (id, v) => { if (id === JID && isFriday) doneMap.kahfi = v ? jumaatKey : null; else doneMap[dayKey][id] = v; };
let lastPos = store.get("q_pos", {});            // { surahId: ayahKey }

// today's list: Al-Mulk + Yasin daily, Al-Kahfi on Friday
// daily list uses the short Al-Kahfi set; on Jumaat it is swapped for the full Al-Kahfi set
// sets marked optional (full Al-Baqarah, Ar-Rahman) have a tab but are not in the daily list
const todayList = SURAHS.filter(s => !s.optional).map(s => s.id).filter(id =>
  JO ? (id !== "kahfi" || isFriday) : (isFriday ? id !== "kahfi" : id !== "kahfifull"));

const MODE_LABEL = { both: "Arab+Latin", latin: "Latin sahaja", arab: "Arab sahaja" };
const MODE_NEXT  = { both: "latin", latin: "arab", arab: "both" };
const arDigits = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const $ = id => document.getElementById(id);

function applySettings(){
  document.documentElement.style.setProperty("--ar", arSize + "px");
  document.documentElement.style.setProperty("--la", laSize + "px");
  document.body.classList.remove("m-both", "m-latin", "m-arab");
  document.body.classList.add("m-" + mode);
  $("modeBtn").textContent = MODE_LABEL[mode];
}

function renderTabs(){
  $("tabs").style.gridTemplateColumns = "repeat(" + Math.min(4, SURAHS.length) + ",1fr)";
  $("tabs").innerHTML = SURAHS.map(s => {
    const tick = isDone(s.id) ? ' <span class="tick">✓</span>' : "";
    const sub = (s.jumaat || (JO && s.id === "kahfi")) ? "<span>Jumaat</span>" : "";
    return `<button class="tab ${s.id===current?"on":""}" data-id="${s.id}">${s.name}${tick}${sub}</button>`;
  }).join("");
}

function renderToday(){
  const names = todayList.map(id => {
    const s = SURAHS.find(x => x.id === id);
    return (isDone(id) ? "✓ " : "") + "<b>" + s.name + "</b>";
  }).join(" · ");
  $("today").innerHTML = (malamJumaat ? "Malam Jumaat – baca: " : isFriday ? "Hari ini Jumaat – baca: " : "Bacaan hari ini: ") + names +
    (isFriday ? "<br>Al-Kahfi: " + (JO ? "ayat 1–10 dan 100–110." : "baca <b>penuh</b> (110 ayat).") + (malamJumaat ? "" : " Sebelum Maghrib (± " + magText + ").")
      : "<br>" + (JO ? "Al-Kahfi: hari Jumaat sahaja." : "Al-Kahfi: ayat 1–10 dan 100–110.") +
        (now.getDay() === 4 ? (JO ? " Bermula" : " Baca penuh bermula") + " selepas Maghrib (± " + magText + ")." : "")) +
    '<div class="place">Lokasi: <select id="place">' +
    Object.keys(PLACES).map(k => `<option value="${k}" ${k===placeId?"selected":""}>${PLACES[k].name}</option>`).join("") +
    '</select> · Maghrib ± ' + magText + '</div>' +
    '<div class="find"><input id="findBox" type="search" inputmode="search" autocomplete="off" placeholder="Cari ayat: 152 atau baqarah 152">' +
    '<button id="findBtn">Pergi</button></div><div class="findmsg" id="findMsg"></div>';
  $("findBtn").addEventListener("click", findAyah);
  $("findBox").addEventListener("keydown", e => { if (e.key === "Enter") findAyah(); });
  $("place").addEventListener("change", e => { store.set("q_place", e.target.value); location.reload(); });
}

// ---- search: "152" jumps inside the open tab, "baqarah 152" opens that surah first
const norm = t => t.toLowerCase().replace(/\b(al|ar|at|as|ali)[- ]/g, "").replace(/[^a-z]/g, "");
function findAyah(){
  const q = $("findBox").value.trim();
  const num = (q.match(/(\d+)\s*$/) || [])[1];
  const name = norm(q.replace(/\d+\s*$/, ""));
  const say = t => { const m = $("findMsg"); if (m) m.textContent = t; };
  if (!q) return;
  // every (tab, part) that fits the name; with no name, only the open tab
  let hits = [];
  SURAHS.forEach(s => s.parts.forEach((p, pi) => {
    const nameOk = !name ? s.id === current
      : norm(s.name).includes(name) || s.id.includes(name) || norm(p.title.split("–")[0]).includes(name);
    if (nameOk) hits.push({ s, pi, has: !num || p.v.some(v => v[0] == num) });
  }));
  if (!hits.length) return say("Surah \"" + q.replace(/\d+\s*$/, "").trim() + "\" tiada dalam senarai ini.");
  const hit = hits.find(h => h.has);
  if (!hit) return say("Ayat " + num + " tiada dalam " + hits[0].s.name + " di sini.");
  if (hit.s.id !== current) { current = hit.s.id; store.set("q_surah", current); renderAll(false); $("findBox").value = q; }
  const el = num ? $("a" + hit.pi + "_" + num) : document.querySelector(".title");
  if (!el) return;
  // put the ayah just under the sticky header
  const top = el.getBoundingClientRect().top + window.scrollY - document.querySelector("header").offsetHeight - 10;
  window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
  if (num) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
  $("findBox").blur();
  say(num ? hit.s.name + " – ayat " + num : hit.s.name);
}

function renderSurah(){
  const s = SURAHS.find(x => x.id === current) || SURAHS[0];
  const parts = s.parts, info = s.info;
  let h = s.heading
    ? `<div class="title"><div class="a" style="font-family:inherit;font-size:24px;direction:ltr">${s.heading}</div><div class="n">${info}</div></div>`
    : `<div class="title"><div class="a">سورة ${s.ar}</div><div class="n">${s.name} · Surah ${s.no} · ${info}</div></div>`;
  if (!s.nobism) h += `<div class="bism"><div class="ba">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div class="bl">bismillâhir-raḫmânir-raḫîm</div></div>`;
  parts.forEach((p, pi) => {
    if (p.title) h += `<div class="part">${p.title}</div>`;
    p.v.forEach(v => {
      h += `<div class="ayah" id="a${pi}_${v[0]}" data-n="${pi}_${v[0]}">
        <div class="ar">${v[1]} <span class="num">${arDigits(v[0])}</span></div>
        <div class="la"><span class="n">${v[0]}.</span>${v[2]}</div></div>`;
    });
  });
  const d = isDone(s.id);
  h += `<button class="done ${d?"is":""}" id="doneBtn">${d ? "✓ Sudah dibaca hari ini" : "Tanda sudah baca " + s.name}</button>`;
  $("view").innerHTML = h;

  // tap an ayah to bookmark it (gold outline) – reopens at that ayah next time
  const mark = lastPos[s.id];
  if (mark && $("a" + mark)) $("a" + mark).classList.add("mark");
  document.querySelectorAll(".ayah").forEach(el => el.addEventListener("click", () => {
    document.querySelectorAll(".ayah.mark").forEach(m => m.classList.remove("mark"));
    if (lastPos[s.id] == el.dataset.n) { delete lastPos[s.id]; }
    else { lastPos[s.id] = el.dataset.n; el.classList.add("mark"); }
    store.set("q_pos", lastPos);
  }));
  $("doneBtn").addEventListener("click", () => {
    setDone(s.id, !isDone(s.id));
    if (isDone(s.id)) { delete lastPos[s.id]; store.set("q_pos", lastPos); }
    store.set("q_done", doneMap);
    renderAll(false);
  });
}

function renderAll(scroll){
  renderTabs(); renderToday(); renderSurah();
  if (scroll) {
    const m = lastPos[current];
    if (m && $("a" + m)) $("a" + m).scrollIntoView({block:"center"});
    else window.scrollTo(0, 0);
  }
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.id; store.set("q_surah", current); renderAll(true);
});
$("plus").addEventListener("click", () => { arSize = Math.min(64, arSize + 4); store.set("q_ar", arSize); applySettings(); });
$("minus").addEventListener("click", () => { arSize = Math.max(24, arSize - 4); store.set("q_ar", arSize); applySettings(); });
$("laPlus").addEventListener("click", () => { laSize = Math.min(56, laSize + 3); store.set("q_la2", laSize); applySettings(); });
$("laMinus").addEventListener("click", () => { laSize = Math.max(16, laSize - 3); store.set("q_la2", laSize); applySettings(); });
$("modeBtn").addEventListener("click", () => { mode = MODE_NEXT[mode]; store.set("q_mode", mode); applySettings(); });

$("who").textContent = PROFILE.name + " ▾";
$("pickList").innerHTML = Object.keys(PROFILES).map(k =>
  `<a class="pbtn" href="#${k}"${PROFILES[k].box ? ` style="background:${PROFILES[k].box}"` : ""}><b>${PROFILES[k].name}</b><span>${PROFILES[k].desc}</span></a>`).join("");
$("date").textContent = HARI[now.getDay()] + ", " + now.getDate() + " " + BULAN[now.getMonth()] + " " + now.getFullYear();
store.set("q_done", doneMap);
applySettings();
renderAll(true);

// ---- new-day refresh
// The date, Maghrib time and Jumaat status are worked out when the page loads. A phone keeps the page
// open in the background for days (especially from a home-screen icon), so without this the ticks and
// "Bacaan hari ini" stayed on the old day. Re-check whenever the page is shown again, and once a minute.
function freshCheck(){
  const n = new Date();
  const key = n.getFullYear() + "-" + (n.getMonth()+1) + "-" + n.getDate();
  const m = maghrib(n);
  const fri = (n.getDay() === 4 && n >= m) || (n.getDay() === 5 && n < m);
  if (key !== dayKey || fri !== isFriday) location.reload();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) freshCheck(); });
window.addEventListener("pageshow", freshCheck);
window.addEventListener("focus", freshCheck);
setInterval(freshCheck, 60000);
</script>
</body>
</html>
